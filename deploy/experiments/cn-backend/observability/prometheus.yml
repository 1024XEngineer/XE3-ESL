global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: speakup
    environment: cn-experiment

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: speakup-cn-experiment-api
    static_configs:
      - targets:
          - server:9090

  - job_name: speakup-cn-experiment-host
    static_configs:
      - targets:
          - node-exporter:9100
