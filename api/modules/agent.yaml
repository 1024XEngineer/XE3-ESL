paths:
  /v1/agent-threads:
    post:
      tags:
        - Agent
      summary: Create a durable Agent Thread
      description: |
        The optional active Goal must belong to the trusted Actor and be
        active. The Thread can start without a Goal for direct expression
        help. This operation does not create a Run or call a model.
      operationId: createAgentThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentThreadRequest'
            example:
              active_goal_id: 10000000-0000-4000-8000-000000000001
      responses:
        '201':
          description: The durable Thread was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Agent
      summary: List durable Agent Threads owned by the trusted Actor
      description: |
        Uses endpoint-specific opaque keyset cursors over
        `(updated_at DESC, thread_id DESC)`. A cursor from another endpoint is
        invalid. The focused Thread ID is returned independently of whether
        that Thread appears on the current page.
      operationId: listAgentThreads
      parameters:
        - $ref: '#/components/parameters/ThreadPageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page of the Actor's Threads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThreadList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/focused:
    get:
      tags:
        - Agent
      summary: Restore the trusted Actor's focused Agent Thread
      operationId: getFocusedAgentThread
      responses:
        '200':
          description: The current focused Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '204':
          description: The Actor has no focused Thread.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    put:
      tags:
        - Agent
      summary: Select one owned Agent Thread as focused
      description: |
        Repeating the same selection is idempotent. Selecting a missing or
        foreign-owned Thread returns the same not-found response.
      operationId: setFocusedAgentThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFocusedAgentThreadRequest'
      responses:
        '200':
          description: The selected canonical Agent Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Clear the trusted Actor's focused Agent Thread
      description: Clearing an already empty focused selection is idempotent.
      operationId: clearFocusedAgentThread
      responses:
        '204':
          description: The Actor now has no focused Thread.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore one durable Agent Thread
      operationId: getAgentThread
      responses:
        '200':
          description: The owned Thread and its selected active Goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Delete one owned Agent Thread
      description: |
        Removes only a Thread owned by the trusted Actor from conversation
        history. Practice-linked records remain available to the training and
        review flows. Deleting the focused Thread also clears the focused
        selection.
      operationId: deleteAgentThread
      responses:
        '204':
          description: The owned Thread was deleted.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/active-goal:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    put:
      tags:
        - Agent
      summary: Select one active Goal for a Thread
      description: |
        The link is owned by Agent Runtime. Goal remains authoritative for
        its lifecycle and must be revalidated by every future Run. Replaying an
        unchanged eligible selection is idempotent and preserves its timestamps.
      operationId: setAgentThreadActiveGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveGoalRequest'
      responses:
        '200':
          description: The Goal is now the Thread's single selected Goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadGoalLink'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore a bounded page of committed Messages
      description: |
        The first request returns the newest page. Every response page is
        ordered by ascending immutable `sequence`; `next_cursor` requests the
        immediately older page. Cursors are opaque, endpoint-specific, and
        bound to this Thread. User Messages are created only through the Run
        submission command so an initial pending Run is committed in the same
        transaction.
      operationId: listAgentMessages
      parameters:
        - $ref: '#/components/parameters/MessagePageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page in ascending server sequence order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/image-assets:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Upload one private image asset for an Agent Thread
      description: |
        The body is one raw JPEG, PNG, or WebP image. The server verifies the
        decoded format, byte and pixel limits, Actor ownership, and Thread
        binding before storing it under the private `image/v1` namespace.
        Uploading an image does not create a Message or Run.
      operationId: createAgentImageAsset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/webp:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      responses:
        '201':
          description: The original or idempotently restored image asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentImageAsset'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        '413':
          $ref: ../common/errors.yaml#/components/responses/PayloadTooLarge
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-image-assets/{image_asset_id}/content:
    parameters:
      - $ref: '#/components/parameters/AgentImageAssetId'
    get:
      tags:
        - Agent
      summary: Issue a short-lived read capability for an owned image
      description: |
        Returns a newly signed private-object URL. The URL is never persisted
        and is unavailable after the image enters deleting or deleted state.
      operationId: getAgentImageAssetContent
      responses:
        '200':
          description: Ephemeral image content capability.
          headers:
            Cache-Control:
              description: Prevent storage of the signed capability response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentImageContent'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-image-assets/{image_asset_id}:
    parameters:
      - $ref: '#/components/parameters/AgentImageAssetId'
    delete:
      tags:
        - Agent
      summary: Delete one owned Agent image asset
      description: |
        Durable deleting state is committed before the private object is
        removed. A completed deletion is idempotent.
      operationId: deleteAgentImageAsset
      responses:
        '204':
          description: Image object deletion completed.
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/voice-message-candidates:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Upload and transcribe one Agent voice Message candidate
      description: |
        The body is raw `audio/wav`. The server validates the recording, stores
        it under Agent-owned private object storage, and creates durable ASR
        candidate state. This operation never creates an AgentMessage or
        AgentRun; the user must explicitly confirm a returned candidate
        version. The upload idempotency scope is the trusted Actor, Thread, key,
        and recording checksum.
      operationId: createAgentVoiceMessageCandidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Durable candidate state, including the current ASR result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    get:
      tags:
        - Agent
      summary: Restore one owned Agent voice Message candidate
      operationId: getAgentVoiceMessageCandidate
      responses:
        '200':
          description: Current durable candidate and ASR state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Delete one unconfirmed Agent voice Message candidate
      description: |
        Object deletion is ordered after durable `deleting` state. Repeating a
        completed deletion is idempotent. If the candidate was already
        confirmed, its canonical AgentMessage text and AgentRun remain durable
        while the attached recording becomes unavailable.
      operationId: deleteAgentVoiceMessageCandidate
      responses:
        '204':
          description: Candidate recording deletion completed.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    post:
      tags:
        - Agent
      summary: Retry ASR for one retryable Agent voice Message candidate
      description: |
        A successful lease claim increments both `asr_attempt` and
        `candidate_version`. The server reloads the private recording and fences
        late workers so an older attempt cannot overwrite the current result.
        The request has no body.
      operationId: retryAgentVoiceMessageCandidate
      responses:
        '200':
          description: Current candidate after the retry or concurrent recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}/confirmations:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    post:
      tags:
        - Agent
      summary: Confirm a candidate as one canonical Agent voice Message
      description: |
        Confirmation atomically creates the user AgentMessage, its durable audio
        projection, immutable transcript evidence, and the initial pending
        AgentRun. `confirmed_text`, not the provider candidate text, becomes the
        canonical Message content. Replaying the same version and command
        restores and, when needed, resumes the original Run. Confirming an old
        candidate version returns 409.
      operationId: confirmAgentVoiceMessageCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAgentVoiceMessageCandidateRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '202':
          description: The original durable Run remains pending or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}/playback:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    get:
      tags:
        - Agent
      summary: Issue temporary playback access for one owned Agent recording
      description: |
        The returned HTTPS URL is an ephemeral bearer capability that expires
        no later than two minutes after issuance. It must not be persisted,
        logged, or shared. Deleted, deleting, missing, and foreign-owned audio
        resources all produce the same not-found response.
      operationId: getAgentMessageAudioPlayback
      responses:
        '200':
          description: Temporary private-recording playback access.
          headers:
            Cache-Control:
              description: Prevent storage of the bearer capability response.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAudioPlayback'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    delete:
      tags:
        - Agent
      summary: Delete the recording attached to an Agent voice Message
      description: |
        The canonical AgentMessage and its confirmed text remain in history.
        The audio projection becomes `deleted` and no longer exposes a playback
        path. Repeating a completed deletion is idempotent.
      operationId: deleteAgentMessageAudio
      responses:
        '204':
          description: Recording deletion completed; text history remains.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/speech:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    get:
      tags:
        - Agent
      summary: Synthesize one assistant Agent Message on demand
      description: |
        Returns ephemeral WAV bytes synthesized from the assistant Message's
        canonical text. The server never persists this generated TTS audio.
        User Messages and foreign-owned Messages produce the same not-found
        response.
      operationId: getAgentMessageSpeech
      responses:
        '200':
          description: Ephemeral synthesized assistant speech.
          headers:
            Cache-Control:
              description: Prevent storage of generated speech.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/translation:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    get:
      tags:
        - Agent
      summary: Translate one completed assistant Agent Message on demand
      description: |
        The server reads the canonical Message by the trusted Actor and Message
        ID; clients never submit translation source text. Only a persisted,
        non-empty assistant Message produced by a completed Run is eligible.
        The translation is ephemeral and does not modify the Message, Thread,
        Summary, Memory, or practice context.
      operationId: getAgentMessageTranslation
      responses:
        '200':
          description: Ephemeral Simplified Chinese translation.
          headers:
            Cache-Control:
              description: Prevent shared or persistent storage of generated text.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageTranslation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/speech-previews:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    post:
      tags:
        - Agent
      summary: Synthesize a short speech preview for an owned Agent Message
      description: |
        Returns ephemeral WAV bytes synthesized from a supplied feedback
        suggestion. The server verifies ownership of the parent Message and
        never persists the generated audio.
      operationId: createAgentMessageSpeechPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Ephemeral synthesized feedback suggestion.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one text or multimodal user Message and run the Agent
      description: |
        The user Message and its initial pending AgentRun are committed in one
        transaction. `client_message_id` is scoped to the trusted Actor and
        Thread. Replaying the same ID and content restores the original Run;
        changing the content or ordered image set returns 409. Attached images
        must already belong to the same Actor and Thread. Provider failures are
        represented by a durable `failed` Run so clients can inspect stable
        retry semantics.
      operationId: submitAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing this durable Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs/stream:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one user Message and stream the text Agent response
      description: |
        Commits the same durable user Message and AgentRun as the non-streaming
        endpoint, then returns a bounded UTF-8 Server-Sent Events stream.
        Events are ordered as `input.committed`, `assistant.started`, zero or
        more `assistant.delta`, and exactly one terminal `run.completed` or
        `run.failed`. Deltas contain visible assistant text only; reasoning and
        fragmented tool-call arguments are never exposed. Only the validated
        canonical assistant Message is persisted. Replaying
        `client_message_id` never creates a duplicate user Message.
      operationId: streamAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '200':
          description: |
            Agent Run event stream. Each event has an `event` field followed by
            one single-line JSON `data` field.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache, no-store`.
            X-Accel-Buffering:
              schema:
                type: string
              description: Always `no`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Restore an owned AgentRun
      operationId: getAgentRun
      responses:
        '200':
          description: The current durable Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Create a new attempt for one retryable failed Run
      description: |
        A retry never overwrites the failed Run. `client_retry_id` makes the
        retry command idempotent for the trusted Actor and Thread.
      operationId: retryAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '201':
          description: The original or replayed retry reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing the retry Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries/stream:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Retry one failed AgentRun and stream the new attempt
      description: |
        Creates or replays an idempotent retry attempt and uses the same event
        protocol as the initial streaming Run. It reuses the original durable
        user Message and never creates a duplicate.
      operationId: streamAgentRunRetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '200':
          description: Retry attempt event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/context-manifest:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Explain the persisted sources and budgets for one AgentRun
      description: |
        This audit projection contains selected Goal and Message sources,
        trimming, and final model configuration. It never contains hidden
        reasoning or credentials.
      operationId: getAgentRunContextManifest
      responses:
        '200':
          description: The immutable ContextManifest for the owned Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextManifest'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    AgentThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentVoiceCandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageAudioId:
      name: audio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentImageAssetId:
      name: image_asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
    ThreadPageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MessagePageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Endpoint-specific opaque keyset cursor returned by the server.
  schemas:
    AgentThread:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - title
        - created_at
        - updated_at
      properties:
        thread_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 32
          readOnly: true
        active_goal_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentThreadList:
      type: object
      additionalProperties: false
      required:
        - threads
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/AgentThread'
        focused_thread_id:
          type: string
          format: uuid
          readOnly: true
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
          readOnly: true
    CreateAgentThreadRequest:
      type: object
      additionalProperties: false
      properties:
        active_goal_id:
          type: string
          format: uuid
    SetFocusedAgentThreadRequest:
      type: object
      additionalProperties: false
      required:
        - thread_id
      properties:
        thread_id:
          type: string
          format: uuid
    SetActiveGoalRequest:
      type: object
      additionalProperties: false
      required:
        - goal_id
      properties:
        goal_id:
          type: string
          format: uuid
    ThreadGoalLink:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - goal_id
        - active
        - linked_at
        - updated_at
      properties:
        thread_id:
          type: string
          format: uuid
          readOnly: true
        goal_id:
          type: string
          format: uuid
          readOnly: true
        active:
          type: boolean
          const: true
          readOnly: true
        linked_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
        - sequence
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Present only for a user Message.
        produced_by_run_id:
          type: string
          format: uuid
          readOnly: true
          description: Present only for an assistant Message.
        modality:
          $ref: '#/components/schemas/AgentMessageModality'
          description: |
            Present as `voice` for a voice Message. It remains absent for a
            plain text Message so pre-voice strict clients keep the original
            response shape; absence therefore means `text`.
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        audio:
          $ref: '#/components/schemas/AgentMessageAudio'
        images:
          type: array
          minItems: 1
          maxItems: 4
          readOnly: true
          description: Present only for a multimodal user Message.
          items:
            $ref: '#/components/schemas/AgentImageAsset'
        speech_feedback_status_url:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/v1/speech-feedback/[A-Za-z0-9._~-]{1,128}$'
          readOnly: true
          description: |
            Present only for an eligible, confirmed user voice Message. It is
            absent, never null, for text, assistant, unconfirmed, hidden, or
            deleted sources.
        handoffs:
          type: array
          maxItems: 4
          description: |
            Trusted operations persisted with succeeded ToolCalls. The client
            must use these exact resource revisions instead of parsing
            assistant prose or model Tool output.
          items:
            $ref: '#/components/schemas/AgentMessageHandoff'
        created_at:
          type: string
          format: date-time
          readOnly: true
    AgentImageAsset:
      type: object
      additionalProperties: false
      required:
        - image_asset_id
        - thread_id
        - content_type
        - size_bytes
        - width
        - height
        - status
        - created_at
      properties:
        image_asset_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          readOnly: true
        width:
          type: integer
          minimum: 1
          maximum: 16384
          readOnly: true
        height:
          type: integer
          minimum: 1
          maximum: 16384
          readOnly: true
        status:
          type: string
          enum:
            - staged
            - attached
            - deleting
            - deleted
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        attached_at:
          type: string
          format: date-time
          readOnly: true
    AgentImageContent:
      type: object
      additionalProperties: false
      required:
        - content_url
        - expires_at
      properties:
        content_url:
          type: string
          format: uri
          pattern: '^https://'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageHandoff:
      type: object
      additionalProperties: false
      required:
        - type
        - label
        - practice_plan_id
        - plan_revision
        - target
        - scene_name
        - practice_experience
        - scene_category
        - practice_mode
        - roles
        - practice_scope
        - suggested_duration_seconds
        - min_effective_turns
        - max_effective_turns
        - executable_status
        - confirmation_prompt
      properties:
        type:
          type: string
          const: confirm_practice_plan
          readOnly: true
        label:
          type: string
          minLength: 1
          maxLength: 100
          readOnly: true
        practice_plan_id:
          type: string
          format: uuid
          readOnly: true
        plan_revision:
          type: integer
          minimum: 1
          readOnly: true
        target:
          type: string
          minLength: 1
          maxLength: 500
          readOnly: true
        scene_name:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
        practice_experience:
          $ref: ./scene.yaml#/components/schemas/PracticeExperience
        scene_category:
          $ref: ./scene.yaml#/components/schemas/SceneCategory
        practice_mode:
          $ref: ./scene.yaml#/components/schemas/PracticeMode
        roles:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
          readOnly: true
        practice_scope:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
        suggested_duration_seconds:
          type: integer
          minimum: 1
          readOnly: true
        min_effective_turns:
          type: integer
          minimum: 1
          maximum: 100
          readOnly: true
        max_effective_turns:
          type: integer
          minimum: 0
          maximum: 100
          description: Zero for a learner-completed, open-ended Practice.
          readOnly: true
        executable_status:
          type: string
          const: ready
          readOnly: true
        confirmation_prompt:
          type: string
          minLength: 1
          maxLength: 300
          readOnly: true
    AgentMessageModality:
      type: string
      enum:
        - text
        - voice
        - multimodal
      readOnly: true
    AgentMessageAudioStatus:
      type: string
      enum:
        - readable
        - deleting
        - deleted
      readOnly: true
    AgentMessageAudio:
      type: object
      additionalProperties: false
      description: |
        Safe public recording metadata for one voice Message. Private object
        keys, checksums, provider ETags, and signed URLs are never included.
        `playback_path` is present only while status is `readable`.
      required:
        - audio_id
        - status
        - content_type
        - size_bytes
        - duration_ms
      properties:
        audio_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/AgentMessageAudioStatus'
        content_type:
          type: string
          const: audio/wav
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 7400000
          readOnly: true
        duration_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 60000
          readOnly: true
        playback_path:
          type: string
          pattern: '^/v1/agent-message-audios/[0-9a-f-]+/playback$'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
    AgentVoiceMessageCandidateStatus:
      type: string
      enum:
        - staged
        - transcribing
        - candidate_ready
        - failed
        - confirming
        - confirmed
        - deleting
        - deleted
      readOnly: true
    AgentVoiceRecording:
      type: object
      additionalProperties: false
      required:
        - content_type
        - size_bytes
        - duration_ms
        - sample_rate
      properties:
        content_type:
          type: string
          const: audio/wav
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 7400000
          readOnly: true
        duration_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 60000
          readOnly: true
        sample_rate:
          type: integer
          minimum: 8000
          maximum: 48000
          readOnly: true
    AgentVoiceTranscriptCandidate:
      type: object
      additionalProperties: false
      required:
        - candidate_text
        - request_id
        - provider
        - model
      properties:
        candidate_text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
          readOnly: true
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        language:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
        emotion:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
        finish_reason:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
    AgentVoiceCandidateFailure:
      type: object
      additionalProperties: false
      required:
        - kind
        - retryable
      properties:
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          readOnly: true
        retryable:
          type: boolean
          readOnly: true
    AgentVoiceMessageCandidate:
      type: object
      additionalProperties: false
      description: |
        Agent-owned workflow state. The provider transcript is only a candidate;
        it does not become Message content until explicit confirmation. Storage
        object keys, checksums, leases, and fencing tokens are server-only.
      required:
        - candidate_id
        - thread_id
        - status
        - asr_attempt
        - candidate_version
        - recording
        - expires_at
        - created_at
        - updated_at
      properties:
        candidate_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/AgentVoiceMessageCandidateStatus'
        asr_attempt:
          type: integer
          minimum: 0
          readOnly: true
        candidate_version:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        recording:
          $ref: '#/components/schemas/AgentVoiceRecording'
        transcript:
          $ref: '#/components/schemas/AgentVoiceTranscriptCandidate'
        failure:
          $ref: '#/components/schemas/AgentVoiceCandidateFailure'
        expires_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_message_id:
          type: string
          format: uuid
          readOnly: true
        confirmed_run_id:
          type: string
          format: uuid
          readOnly: true
        message_audio_id:
          type: string
          format: uuid
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ConfirmAgentVoiceMessageCandidateRequest:
      type: object
      additionalProperties: false
      required:
        - candidate_version
        - client_message_id
        - confirmed_text
      properties:
        candidate_version:
          type: integer
          format: int64
          minimum: 1
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        confirmed_text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
    AgentVoiceMessageConfirmation:
      type: object
      additionalProperties: false
      required:
        - candidate
        - message
        - run
      properties:
        candidate:
          $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        message:
          $ref: '#/components/schemas/AgentMessage'
        run:
          $ref: '#/components/schemas/AgentRun'
    AgentMessageAudioPlayback:
      type: object
      additionalProperties: false
      description: |
        Ephemeral bearer capability for one owned Agent recording. It expires
        no later than two minutes after issuance and is never persisted as
        Message audio metadata.
      required:
        - playback_url
        - expires_at
      properties:
        playback_url:
          type: string
          format: uri
          pattern: '^https://'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageTranslation:
      type: object
      additionalProperties: false
      required:
        - message_id
        - target_language
        - translation
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        target_language:
          type: string
          const: zh-CN
          readOnly: true
        translation:
          type: string
          minLength: 1
          maxLength: 8000
          readOnly: true
    SubmitAgentRunRequest:
      $ref: '#/components/schemas/AppendAgentMessageRequest'
    RetryAgentRunRequest:
      type: object
      additionalProperties: false
      required:
        - client_retry_id
      properties:
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AgentRunStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
    AgentRunFailure:
      type: object
      additionalProperties: false
      required:
        - kind
        - retryable
      properties:
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        retryable:
          type: boolean
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    AgentRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - thread_id
        - input_message_id
        - attempt
        - status
        - requested_provider
        - requested_model
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        input_message_id:
          type: string
          format: uuid
          readOnly: true
        attempt:
          type: integer
          minimum: 1
          readOnly: true
        retry_of_run_id:
          type: string
          format: uuid
          readOnly: true
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        requested_provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        requested_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        max_output_tokens:
          type: integer
          minimum: 1
          readOnly: true
        assistant_message_id:
          type: string
          format: uuid
          readOnly: true
        provider_completion_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        provider_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        finish_reason:
          type: string
          enum:
            - stop
            - length
          readOnly: true
        usage:
          $ref: '#/components/schemas/TokenUsage'
        failure:
          $ref: '#/components/schemas/AgentRunFailure'
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ContextMessageSource:
      type: object
      additionalProperties: false
      required:
        - message_id
        - sequence
        - role
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
    ContextGoalSource:
      type: object
      additionalProperties: false
      required:
        - goal_id
        - version
      properties:
        goal_id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
    ContextMemorySource:
      type: object
      additionalProperties: false
      required:
        - memory_id
        - memory_version
        - type
        - scope
        - similarity
        - score
        - embedding_provider
        - embedding_model
        - embedding_dimensions
        - embedding_policy_version
        - retrieval_policy_version
      properties:
        memory_id:
          type: string
          format: uuid
          readOnly: true
        memory_version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        type:
          type: string
          minLength: 1
          maxLength: 32
          readOnly: true
