paths:
  /v1/matters:
    post:
      tags:
        - Matter
      summary: Create a user-owned real-world Matter
      operationId: createMatter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatterRequest'
            example:
              title: Customer renewal meeting
      responses:
        '201':
          description: The Matter was created for the trusted Actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Matter
      summary: List Matters owned by the trusted Actor
      operationId: listMatters
      responses:
        '200':
          description: The Actor's Matters ordered by latest update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterList'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/matters/{matter_id}:
    parameters:
      - $ref: '#/components/parameters/MatterId'
    get:
      tags:
        - Matter
      summary: Restore one Matter owned by the trusted Actor
      operationId: getMatter
      responses:
        '200':
          description: The current durable Matter state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    patch:
      tags:
        - Matter
      summary: Complete, archive, or reopen an owned Matter
      operationId: changeMatterStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMatterStatusRequest'
      responses:
        '200':
          description: The Matter lifecycle transition was committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads:
    post:
      tags:
        - Agent
      summary: Create a durable Agent Thread
      description: |
        The optional active Matter must belong to the trusted Actor and be
        active. The Thread can start without a Matter for direct expression
        help. This operation does not create a Run or call a model.
      operationId: createAgentThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentThreadRequest'
            example:
              active_matter_id: 10000000-0000-4000-8000-000000000001
      responses:
        '201':
          description: The durable Thread was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Agent
      summary: List durable Agent Threads owned by the trusted Actor
      operationId: listAgentThreads
      responses:
        '200':
          description: The Actor's Threads ordered by latest update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThreadList'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore one durable Agent Thread
      operationId: getAgentThread
      responses:
        '200':
          description: The owned Thread and its selected active Matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/active-matter:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    put:
      tags:
        - Agent
      summary: Select one active Matter for a Thread
      description: |
        The link is owned by Agent Runtime. Matter remains authoritative for
        its lifecycle and must be revalidated by every future Run. Replaying an
        unchanged eligible selection is idempotent and preserves its timestamps.
      operationId: setAgentThreadActiveMatter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveMatterRequest'
      responses:
        '200':
          description: The Matter is now the Thread's single selected Matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMatterLink'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore committed Messages in stable Thread order
      description: |
        User Messages are created only through the Run submission command so
        an initial pending Run is committed in the same transaction.
      operationId: listAgentMessages
      responses:
        '200':
          description: Messages ordered by the server-assigned sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageList'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one user Message and run the text Agent
      description: |
        The user Message and its initial pending AgentRun are committed in one
        transaction. `client_message_id` is scoped to the trusted Actor and
        Thread. Replaying the same ID and content restores the original Run;
        changing the content returns 409. Provider failures are represented by
        a durable `failed` Run so clients can inspect stable retry semantics.
      operationId: submitAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing this durable Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Restore an owned AgentRun
      operationId: getAgentRun
      responses:
        '200':
          description: The current durable Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Create a new attempt for one retryable failed Run
      description: |
        A retry never overwrites the failed Run. `client_retry_id` makes the
        retry command idempotent for the trusted Actor and Thread.
      operationId: retryAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '201':
          description: The original or replayed retry reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing the retry Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/context-manifest:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Explain the persisted sources and budgets for one AgentRun
      description: |
        This audit projection contains selected Matter and Message sources,
        trimming, and final model configuration. It never contains hidden
        reasoning or credentials.
      operationId: getAgentRunContextManifest
      responses:
        '200':
          description: The immutable ContextManifest for the owned Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextManifest'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    MatterId:
      name: matter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    MatterStatus:
      type: string
      enum:
        - active
        - completed
        - archived
    Matter:
      type: object
      additionalProperties: false
      required:
        - matter_id
        - title
        - status
        - version
        - created_at
        - updated_at
      properties:
        matter_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
        status:
          $ref: '#/components/schemas/MatterStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    MatterList:
      type: object
      additionalProperties: false
      required:
        - matters
      properties:
        matters:
          type: array
          items:
            $ref: '#/components/schemas/Matter'
    CreateMatterRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
    ChangeMatterStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - expected_version
      properties:
        status:
          $ref: '#/components/schemas/MatterStatus'
        expected_version:
          type: integer
          format: int64
          minimum: 1
    AgentThread:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - created_at
        - updated_at
      properties:
        thread_id:
          type: string
          format: uuid
          readOnly: true
        active_matter_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentThreadList:
      type: object
      additionalProperties: false
      required:
        - threads
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/AgentThread'
    CreateAgentThreadRequest:
      type: object
      additionalProperties: false
      properties:
        active_matter_id:
          type: string
          format: uuid
    SetActiveMatterRequest:
      type: object
      additionalProperties: false
      required:
        - matter_id
      properties:
        matter_id:
          type: string
          format: uuid
    ThreadMatterLink:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - matter_id
        - active
        - linked_at
        - updated_at
      properties:
        thread_id:
          type: string
          format: uuid
          readOnly: true
        matter_id:
          type: string
          format: uuid
          readOnly: true
        active:
          type: boolean
          const: true
          readOnly: true
        linked_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
        - sequence
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Present only for a user Message.
        produced_by_run_id:
          type: string
          format: uuid
          readOnly: true
          description: Present only for an assistant Message.
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        created_at:
          type: string
          format: date-time
          readOnly: true
    SubmitAgentRunRequest:
      $ref: '#/components/schemas/AppendAgentMessageRequest'
    RetryAgentRunRequest:
      type: object
      additionalProperties: false
      required:
        - client_retry_id
      properties:
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AgentRunStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
    AgentRunFailure:
      type: object
      additionalProperties: false
      required:
        - kind
        - retryable
      properties:
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        retryable:
          type: boolean
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    AgentRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - thread_id
        - input_message_id
        - attempt
        - status
        - requested_provider
        - requested_model
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        input_message_id:
          type: string
          format: uuid
          readOnly: true
        attempt:
          type: integer
          minimum: 1
          readOnly: true
        retry_of_run_id:
          type: string
          format: uuid
          readOnly: true
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        requested_provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        requested_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        max_output_tokens:
          type: integer
          minimum: 1
          readOnly: true
        assistant_message_id:
          type: string
          format: uuid
          readOnly: true
        provider_completion_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        provider_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        finish_reason:
          type: string
          enum:
            - stop
            - length
          readOnly: true
        usage:
          $ref: '#/components/schemas/TokenUsage'
        failure:
          $ref: '#/components/schemas/AgentRunFailure'
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ContextMessageSource:
      type: object
      additionalProperties: false
      required:
        - message_id
        - sequence
        - role
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
    ContextMatterSource:
      type: object
      additionalProperties: false
      required:
        - matter_id
        - version
        - title
      properties:
        matter_id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          readOnly: true
    ContextManifest:
      type: object
      additionalProperties: false
      required:
        - run_id
        - thread_id
        - input_message_id
        - instruction_version
        - selected_messages
        - omitted_message_count
        - trim_reason
        - max_input_characters
        - used_input_characters
        - requested_provider
        - requested_model
        - max_output_tokens
        - created_at
      properties:
        run_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        input_message_id:
          type: string
          format: uuid
          readOnly: true
        active_matter:
          $ref: '#/components/schemas/ContextMatterSource'
        instruction_version:
          type: string
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
          readOnly: true
        selected_messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContextMessageSource'
        omitted_message_count:
          type: integer
          minimum: 0
          readOnly: true
        trim_reason:
          type: string
          enum:
            - none
            - context_budget
          readOnly: true
        max_input_characters:
          type: integer
          minimum: 1
          readOnly: true
        used_input_characters:
          type: integer
          minimum: 1
          readOnly: true
        requested_provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        requested_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        max_output_tokens:
          type: integer
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageList:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
    AppendAgentMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - content
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
