        stable_profile_context_policy_version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
          readOnly: true
        selected_stable_profile:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ContextStableProfileSource'
