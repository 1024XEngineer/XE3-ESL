    AgentMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
        - sequence
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Present only for a user Message.
        produced_by_run_id:
          type: string
          format: uuid
          readOnly: true
          description: Present only for an assistant Message.
        modality:
          $ref: '#/components/schemas/AgentMessageModality'
          description: |
            Present as `voice` for a voice Message. It remains absent for a
            plain text Message so pre-voice strict clients keep the original
            response shape; absence therefore means `text`.
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        audio:
          $ref: '#/components/schemas/AgentMessageAudio'
        created_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageModality:
      type: string
      enum:
        - text
        - voice
      readOnly: true
    AgentMessageAudioStatus:
      type: string
      enum:
        - readable
        - deleting
        - deleted
      readOnly: true
    AgentMessageAudio:
      type: object
      additionalProperties: false
      description: |
        Safe public recording metadata for one voice Message. Private object
        keys, checksums, provider ETags, and signed URLs are never included.
        `playback_path` is present only while status is `readable`.
      required:
        - audio_id
        - status
        - content_type
        - size_bytes
        - duration_ms
      properties:
        audio_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/AgentMessageAudioStatus'
        content_type:
          type: string
          const: audio/wav
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 7400000
          readOnly: true
        duration_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 60000
          readOnly: true
        playback_path:
          type: string
          pattern: '^/v1/agent-message-audios/[0-9a-f-]+/playback$'
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
    AgentVoiceMessageCandidateStatus:
      type: string
