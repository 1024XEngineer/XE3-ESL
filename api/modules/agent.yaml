    AgentMessageList:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
          readOnly: true
    AppendAgentMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - content
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        image_asset_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: |
            Ordered private image assets previously uploaded to this Thread.
            Omit this property or send an empty array for a plain text Message.
