paths:
  /v1/agent-threads:
    post:
      tags:
        - Agent
      summary: Create a durable Agent Thread
      description: |
        Creates an empty conversation Thread for the trusted Actor. This
        operation does not create a Run or call a model.
      operationId: createAgentThread
      responses:
        '201':
          description: The durable Thread was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Agent
      summary: List durable Agent Threads owned by the trusted Actor
      description: |
        Uses endpoint-specific opaque keyset cursors over
        `(updated_at DESC, thread_id DESC)`. A cursor from another endpoint is
        invalid.
      operationId: listAgentThreads
      parameters:
        - $ref: '#/components/parameters/ThreadPageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page of the Actor's Threads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThreadList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore one durable Agent Thread
      operationId: getAgentThread
      responses:
        '200':
          description: The owned Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Delete one owned Agent Thread
      description: |
        Removes only a Thread owned by the trusted Actor from conversation
        history. Practice-linked records remain available to the training and
        review flows.
      operationId: deleteAgentThread
      responses:
        '204':
          description: The owned Thread was deleted.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore a bounded page of committed Messages
      description: |
        The first request returns the newest page. Every response page is
        ordered by ascending immutable `sequence`; `next_cursor` requests the
        immediately older page. Cursors are opaque, endpoint-specific, and
        bound to this Thread. User Messages are created only through the Run
        submission command so an initial pending Run is committed in the same
        transaction.
      operationId: listAgentMessages
      parameters:
        - $ref: '#/components/parameters/MessagePageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page in ascending server sequence order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/image-assets:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Upload one private image asset after validating an Agent Thread
      description: |
        The body is one raw JPEG, PNG, or WebP image. The server verifies the
        decoded format, byte and pixel limits, Actor ownership, and Thread
        access before storing a user-owned asset under the private media namespace.
        Uploading an image does not create a Message or Run.
      operationId: createAgentImageAsset
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 10485760
          image/webp:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      responses:
        '201':
          description: The ready image asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentImageAsset'
        '202':
          description: Another request is still completing the staged upload.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentImageAsset'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        '413':
          $ref: ../common/errors.yaml#/components/responses/PayloadTooLarge
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-image-assets/{image_asset_id}/content:
    parameters:
      - $ref: '#/components/parameters/AgentImageAssetId'
    get:
      tags:
        - Agent
      summary: Issue a short-lived read capability for an owned image
      description: |
        Returns a newly signed private-object URL. The URL is never persisted
        and is unavailable after the image enters deleting state.
      operationId: getAgentImageAssetContent
      responses:
        '200':
          description: Ephemeral image content capability.
          headers:
            Cache-Control:
              description: Prevent storage of the signed capability response.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentImageContent'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-image-assets/{image_asset_id}:
    parameters:
      - $ref: '#/components/parameters/AgentImageAssetId'
    delete:
      tags:
        - Agent
      summary: Delete one owned Agent image asset
      description: |
        Durable deleting state is committed before the private object is
        removed. A completed deletion is idempotent.
      operationId: deleteAgentImageAsset
      responses:
        '204':
          description: Image object deletion completed.
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/voice-transcriptions/realtime:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Stream one non-persistent Agent voice transcription
      description: |
        Upgrade to a Thread-scoped WebSocket that sends mono PCM s16le frames
        directly to the configured realtime speech recognizer. The server
        authenticates the Bearer Session, resolves Thread ownership, and
        validates `Sec-WebSocket-Protocol` before upgrading. The accepted
        connection is bound to that Actor and Thread; switching accounts
        requires closing it and authenticating a new connection.

        The client first sends `start` with an 8-128 character idempotency key
        and `sample_rate=16000`, then binary PCM frames, followed by `finish` or
        `cancel`. At most 1,920,000 PCM bytes are accepted. The server emits
        `transcription.started`, zero or more `transcription.updated`, and one
        `transcription.completed` or `transcription.failed` terminal event.
        Idempotency keys validate the live attempt only; this ephemeral stream
        does not persist or replay a prior result.

        This operation never creates a Voice Draft, Agent Message, audio
        attachment, transcript evidence, or object-storage entry. After
        `transcription.completed`, clients submit edited text through the
        existing Agent Run endpoint.
      operationId: streamAgentVoiceTranscription
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: Required Agent voice input subprotocol.
          schema:
            type: string
            const: speakup.voice-input.v1
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          headers:
            Sec-WebSocket-Protocol:
              description: Negotiated Agent voice input protocol.
              schema:
                type: string
                const: speakup.voice-input.v1
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
      x-websocket-client-text-frame-schema:
        $ref: ../websocket/agent-voice-transcription.schema.json#/$defs/ClientTextFrame
      x-websocket-event-schema:
        $ref: ../websocket/agent-voice-transcription.schema.json#/$defs/ServerEvent
      x-websocket-security:
        credential_location: authorization_header
        header: Authorization
        scheme: Bearer
        other_credential_locations_allowed: false
        production_transport: wss
        local_loopback_transport: ws
        pre_upgrade:
          validation_order:
            - session
            - actor
            - resource_ownership
            - subprotocol
            - upgrade
          authentication_failure:
            http_status: 401
            error_code: authentication_required
          resource_not_visible:
            http_status: 404
            error_code: resource_not_found
        reconnect:
          reauthenticate: true
        connection_binding:
          actor_fields:
            - user_id
            - session_id
          target_field: thread_id
          target_switch_allowed: false
        subprotocol:
          allowed:
            - speakup.voice-input.v1
          carries_credentials: false
  /v1/agent-threads/{thread_id}/voice-drafts/realtime:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Stream and transcribe one durable Agent voice Draft
      description: |
        Upgrade to a Thread-scoped WebSocket. The client sends `start` with an
        8-128 character idempotency key and `sample_rate=16000`, then mono PCM
        s16le binary frames followed by `finish` or `cancel`. The server stores
        the resulting WAV in private media storage and creates one durable ASR
        Draft. It emits `transcription.started`, zero or more
        `transcription.updated` events, and one terminal `draft.ready` or
        `draft.failed` event. A terminal persisted event carries the current
        Draft under `data.draft`.

        This operation never creates an AgentMessage or AgentRun. The user must
        explicitly confirm the returned `draft_version`. The idempotency scope
        is the trusted Actor, Thread, key, and recording checksum.
      operationId: streamAgentVoiceDraft
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: Required Agent voice input subprotocol.
          schema:
            type: string
            const: speakup.voice-input.v1
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          headers:
            Sec-WebSocket-Protocol:
              description: Negotiated Agent voice input protocol.
              schema:
                type: string
                const: speakup.voice-input.v1
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
      x-websocket-client-text-frame-schema:
        $ref: ../websocket/agent-voice-transcription.schema.json#/$defs/ClientTextFrame
      x-websocket-security:
        credential_location: authorization_header
        header: Authorization
        scheme: Bearer
        other_credential_locations_allowed: false
        production_transport: wss
        local_loopback_transport: ws
        pre_upgrade:
          validation_order:
            - session
            - actor
            - resource_ownership
            - subprotocol
            - upgrade
          authentication_failure:
            http_status: 401
            error_code: authentication_required
          resource_not_visible:
            http_status: 404
            error_code: resource_not_found
        reconnect:
          reauthenticate: true
        connection_binding:
          actor_fields:
            - user_id
            - session_id
          target_field: thread_id
          target_switch_allowed: false
        subprotocol:
          allowed:
            - speakup.voice-input.v1
          carries_credentials: false
  /v1/agent-voice-drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceDraftId'
    get:
      tags:
        - Agent
      summary: Restore one owned Agent voice Draft
      operationId: getAgentVoiceDraft
      responses:
        '200':
          description: Current durable Draft and ASR state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceDraft'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Delete one unconfirmed Agent voice Draft
      description: |
        Deletes the unconfirmed Draft and schedules its private recording for
        cleanup. Repeating a completed deletion is idempotent. A confirmed Draft
        must be managed through its attached Message audio resource.
      operationId: deleteAgentVoiceDraft
      responses:
        '204':
          description: Draft deletion accepted and recording cleanup scheduled.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-drafts/{draft_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceDraftId'
    post:
      tags:
        - Agent
      summary: Retry ASR for one retryable Agent voice Draft
      description: |
        A successful lease claim increments both `asr_attempt` and
        `draft_version`. The server reloads the private recording and fences
        late workers so an older attempt cannot overwrite the current result.
        The request has no body.
      operationId: retryAgentVoiceDraft
      responses:
        '200':
          description: Current Draft after the retry or concurrent recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceDraft'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-drafts/{draft_id}/confirmations:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceDraftId'
    post:
      tags:
        - Agent
      summary: Confirm a Draft as one canonical Agent voice Message
      description: |
        Confirmation atomically creates the user AgentMessage, its ordered audio
        attachment, and the initial pending AgentRun. `confirmed_text`, not the
        provider transcript, becomes the canonical Message content. Replaying
        the same version and command restores and, when needed, resumes the
        original Run. Confirming an old Draft version returns 409.
      operationId: confirmAgentVoiceDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAgentVoiceDraftRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '202':
          description: The original durable Run remains pending or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-drafts/{draft_id}/confirmations/stream:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceDraftId'
    post:
      tags:
        - Agent
      summary: Confirm a Draft and stream the Agent response
      description: |
        Commits the same Draft, Message, attachment, and Run as the non-streaming
        confirmation endpoint, then returns Server-Sent Events ordered as
        `input.committed`, zero or more typed `tool.started` plus
        `tool.completed` or `tool.failed` steps, one final output sequence
        (`assistant.output.started`, one or more `assistant.output.delta`, and
        `assistant.output.completed`), and exactly one terminal `run.completed`
        or `run.failed`. The `input.committed` payload contains the confirmed
        Draft under `draft`. Tool events expose only stable step identity and
        name; tool inputs and results remain private. Final output events share
        an `output_id` equal to the persisted assistant Message ID. Ordered
        deltas carry a one-based `sequence`, and their concatenation equals the
        completed output `text` and canonical Message content.
      operationId: streamAgentVoiceDraftConfirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAgentVoiceDraftRequest'
      responses:
        '200':
          description: Agent voice confirmation event stream.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache, no-store`.
            X-Accel-Buffering:
              schema:
                type: string
              description: Always `no`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}/playback:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    get:
      tags:
        - Agent
      summary: Issue temporary playback access for one owned Agent recording
      description: |
        The returned HTTPS URL is an ephemeral bearer capability that expires
        no later than two minutes after issuance. It must not be persisted,
        logged, or shared. Deleted, deleting, missing, and foreign-owned audio
        resources all produce the same not-found response.
      operationId: getAgentMessageAudioPlayback
      responses:
        '200':
          description: Temporary private-recording playback access.
          headers:
            Cache-Control:
              description: Prevent storage of the bearer capability response.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAudioPlayback'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    delete:
      tags:
        - Agent
      summary: Delete the recording attached to an Agent voice Message
      description: |
        The canonical AgentMessage and its confirmed text remain in history.
        Later Message projections omit `audio`; `modality: voice` remains as
        provenance. Repeating a completed deletion is idempotent.
      operationId: deleteAgentMessageAudio
      responses:
        '204':
          description: Recording deletion completed; text history remains.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/speech:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    get:
      tags:
        - Agent
      summary: Synthesize one assistant Agent Message on demand
      description: |
        Returns ephemeral WAV bytes synthesized from the assistant Message's
        canonical text. The server never persists this generated TTS audio.
        User Messages and foreign-owned Messages produce the same not-found
        response.
      operationId: getAgentMessageSpeech
      responses:
        '200':
          description: Ephemeral synthesized assistant speech.
          headers:
            Cache-Control:
              description: Prevent storage of generated speech.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/translation:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    get:
      tags:
        - Agent
      summary: Translate one completed assistant Agent Message on demand
      description: |
        The server reads the canonical Message by the trusted Actor and Message
        ID; clients never submit translation source text. Only a persisted,
        non-empty assistant Message produced by a completed Run is eligible.
        The translation is ephemeral and does not modify the Message, Thread,
        Summary, Memory, or practice context.
      operationId: getAgentMessageTranslation
      responses:
        '200':
          description: Ephemeral Simplified Chinese translation.
          headers:
            Cache-Control:
              description: Prevent shared or persistent storage of generated text.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageTranslation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/speech-previews:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    post:
      tags:
        - Agent
      summary: Synthesize a short speech preview for an owned Agent Message
      description: |
        Returns ephemeral WAV bytes synthesized from a supplied feedback
        suggestion. The server verifies ownership of the parent Message and
        never persists the generated audio.
      operationId: createAgentMessageSpeechPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Ephemeral synthesized feedback suggestion.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one text or multimodal user Message and run the Agent
      description: |
        The user Message and its initial pending AgentRun are committed in one
        transaction. `client_message_id` is scoped to the trusted Actor and
        Thread. Replaying the same ID and content restores the original Run;
        changing the content or ordered image set returns 409. Attached images
        must already belong to the same Actor and Thread. Provider failures are
        represented by a durable `failed` Run so clients can inspect stable
        retry semantics.
      operationId: submitAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing this durable Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs/stream:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one user Message and stream the text Agent response
      description: |
        Commits the same durable user Message and AgentRun as the non-streaming
        endpoint, then returns a bounded UTF-8 Server-Sent Events stream.
        Events are ordered as `input.committed`, zero or more typed
        `tool.started` plus `tool.completed` or `tool.failed` steps, one final
        output sequence (`assistant.output.started`, one or more
        `assistant.output.delta`, and `assistant.output.completed`), and exactly
        one terminal `run.completed` or `run.failed`. Tool inputs, results,
        reasoning, and non-final model text are never exposed. Final output
        events share an `output_id` equal to the persisted assistant Message
        ID. Ordered deltas carry a one-based `sequence`, and their concatenation
        equals the completed output `text` and canonical Message content.
        Replaying `client_message_id` never creates a duplicate user Message.
      operationId: streamAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '200':
          description: |
            Agent Run event stream. Each event has an `event` field followed by
            one single-line JSON `data` field.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache, no-store`.
            X-Accel-Buffering:
              schema:
                type: string
              description: Always `no`.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Restore an owned AgentRun
      operationId: getAgentRun
      responses:
        '200':
          description: The current durable Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Create a new attempt for one retryable failed Run
      description: |
        A retry never overwrites the failed Run. `client_retry_id` makes the
        retry command idempotent for the trusted Actor and Thread.
      operationId: retryAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '201':
          description: The original or replayed retry reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing the retry Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries/stream:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Retry one failed AgentRun and stream the new attempt
      description: |
        Creates or replays an idempotent retry attempt and uses the same event
        protocol as the initial streaming Run. It reuses the original durable
        user Message and never creates a duplicate.
      operationId: streamAgentRunRetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '200':
          description: Retry attempt event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    AgentThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentVoiceDraftId:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageAudioId:
      name: audio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentImageAssetId:
      name: image_asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
    ThreadPageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MessagePageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Endpoint-specific opaque keyset cursor returned by the server.
  schemas:
    AgentThread:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - title
        - created_at
        - updated_at
      properties:
        thread_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 32
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentThreadList:
      type: object
      additionalProperties: false
      required:
        - threads
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/AgentThread'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
          readOnly: true
    AgentMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - thread_id
        - sequence
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        sequence:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        role:
          type: string
          enum:
            - user
            - assistant
          readOnly: true
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Present only for a user Message.
        produced_by_run_id:
          type: string
          format: uuid
          readOnly: true
          description: Present only for an assistant Message.
        modality:
          $ref: '#/components/schemas/AgentMessageModality'
          description: |
            Present as `voice` for a voice Message. It remains absent for a
            plain text Message so pre-voice strict clients keep the original
            response shape; absence therefore means `text`. A user-deleted
            recording does not rewrite Message provenance, so `voice` may
            remain while `audio` is absent.
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        audio:
          $ref: '#/components/schemas/AgentMessageAudio'
          description: Present only while the confirmed recording is retained.
        images:
          type: array
          minItems: 1
          maxItems: 4
          readOnly: true
          description: Present only for a multimodal user Message.
          items:
            $ref: '#/components/schemas/AgentImageAsset'
        speech_feedback_status_url:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/v1/agent-messages/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/evaluation$'
          readOnly: true
          description: |
            Actor-owned AGENT_MESSAGE_FEEDBACK Evaluation URL. Present only for
            an eligible, confirmed user voice Message. It is absent, never null,
            for text, assistant, unconfirmed, hidden, or deleted sources.
        client_actions:
          type: array
          maxItems: 4
          description: |
            Trusted generic client operations persisted with succeeded
            ToolCalls. Business clients validate each versioned payload before
            executing it. Actions never come from assistant prose or model Tool
            output.
          items:
            $ref: '#/components/schemas/AgentClientAction'
        created_at:
          type: string
          format: date-time
          readOnly: true
    AgentImageAsset:
      type: object
      additionalProperties: false
      required:
        - image_asset_id
        - content_type
        - size_bytes
        - width
        - height
        - status
        - created_at
      properties:
        image_asset_id:
          type: string
          format: uuid
          readOnly: true
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          readOnly: true
        width:
          type: integer
          minimum: 1
          maximum: 16384
          readOnly: true
        height:
          type: integer
          minimum: 1
          maximum: 16384
          readOnly: true
        status:
          type: string
          enum:
            - staged
            - ready
            - deleting
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        attached_at:
          type: string
          format: date-time
          readOnly: true
    AgentImageContent:
      type: object
      additionalProperties: false
      required:
        - content_url
        - expires_at
      properties:
        content_url:
          type: string
          format: uri
          pattern: '^https://'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    AgentClientAction:
      type: object
      additionalProperties: false
      required:
        - type
        - payload
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9._:-]{0,63}$'
          readOnly: true
        payload:
          type: object
          additionalProperties: true
          x-max-utf8-bytes: 16384
          readOnly: true
    AgentMessageModality:
      type: string
      enum:
        - text
        - voice
        - multimodal
      readOnly: true
    AgentMessageAudioStatus:
      type: string
      const: readable
      readOnly: true
    AgentMessageAudio:
      type: object
      additionalProperties: false
      description: |
        Safe public recording metadata for one voice Message. Private object
        keys, checksums, provider ETags, and signed URLs are never included.
        Deletion is acknowledged with HTTP 204; deleted recordings are absent
        from later Message projections instead of exposing a second durable
        audio state machine.
      required:
        - audio_id
        - status
        - content_type
        - size_bytes
        - duration_ms
        - playback_path
      properties:
        audio_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/AgentMessageAudioStatus'
        content_type:
          type: string
          const: audio/wav
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 7400000
          readOnly: true
        duration_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 60000
          readOnly: true
        playback_path:
          type: string
          pattern: '^/v1/agent-message-audios/[0-9a-f-]+/playback$'
          readOnly: true
    AgentVoiceDraftStatus:
      type: string
      enum:
        - transcribing
        - ready
        - failed
        - confirmed
      readOnly: true
    AgentVoiceRecording:
      type: object
      additionalProperties: false
      required:
        - content_type
        - size_bytes
        - duration_ms
        - sample_rate
      properties:
        content_type:
          type: string
          const: audio/wav
          readOnly: true
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 7400000
          readOnly: true
        duration_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 60000
          readOnly: true
        sample_rate:
          type: integer
          minimum: 8000
          maximum: 48000
          readOnly: true
    AgentVoiceTranscript:
      type: object
      additionalProperties: false
      required:
        - text
        - request_id
        - provider
        - model
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
          readOnly: true
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          readOnly: true
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        language:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
        emotion:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
        finish_reason:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
    AgentVoiceDraftFailure:
      type: object
      additionalProperties: false
      required:
        - kind
        - retryable
      properties:
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          readOnly: true
        retryable:
          type: boolean
          readOnly: true
    AgentVoiceDraft:
      type: object
      additionalProperties: false
      description: |
        Agent-owned durable voice-input workflow. The provider transcript does
        not become Message content until explicit confirmation. Storage object
        keys, checksums, leases, and fencing tokens are server-only.
      required:
        - draft_id
        - thread_id
        - status
        - asr_attempt
        - draft_version
        - recording
        - created_at
        - updated_at
      properties:
        draft_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        status:
          $ref: '#/components/schemas/AgentVoiceDraftStatus'
        asr_attempt:
          type: integer
          minimum: 1
          readOnly: true
        draft_version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        recording:
          $ref: '#/components/schemas/AgentVoiceRecording'
        transcript:
          $ref: '#/components/schemas/AgentVoiceTranscript'
        failure:
          $ref: '#/components/schemas/AgentVoiceDraftFailure'
        expires_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_message_id:
          type: string
          format: uuid
          readOnly: true
        confirmed_run_id:
          type: string
          format: uuid
          readOnly: true
        message_audio_id:
          type: string
          format: uuid
          readOnly: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ConfirmAgentVoiceDraftRequest:
      type: object
      additionalProperties: false
      required:
        - draft_version
        - client_message_id
        - confirmed_text
      properties:
        draft_version:
          type: integer
          format: int64
          minimum: 1
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        confirmed_text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
    AgentVoiceMessageConfirmation:
      type: object
      additionalProperties: false
      required:
        - draft
        - message
        - run
      properties:
        draft:
          $ref: '#/components/schemas/AgentVoiceDraft'
        message:
          $ref: '#/components/schemas/AgentMessage'
        run:
          $ref: '#/components/schemas/AgentRun'
    AgentMessageAudioPlayback:
      type: object
      additionalProperties: false
      description: |
        Ephemeral bearer capability for one owned Agent recording. It expires
        no later than two minutes after issuance and is never persisted as
        Message audio metadata.
      required:
        - playback_url
        - expires_at
      properties:
        playback_url:
          type: string
          format: uri
          pattern: '^https://'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageTranslation:
      type: object
      additionalProperties: false
      required:
        - message_id
        - target_language
        - translation
      properties:
        message_id:
          type: string
          format: uuid
          readOnly: true
        target_language:
          type: string
          const: zh-CN
          readOnly: true
        translation:
          type: string
          minLength: 1
          maxLength: 8000
          readOnly: true
    SubmitAgentRunRequest:
      $ref: '#/components/schemas/AppendAgentMessageRequest'
    RetryAgentRunRequest:
      type: object
      additionalProperties: false
      required:
        - client_retry_id
      properties:
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    AgentRunStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - failed
    AgentRunFailure:
      type: object
      additionalProperties: false
      required:
        - kind
        - retryable
      properties:
        kind:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        retryable:
          type: boolean
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    AgentRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - thread_id
        - input_message_id
        - attempt
        - status
        - requested_provider
        - requested_model
        - max_output_tokens
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          format: uuid
          readOnly: true
        thread_id:
          type: string
          format: uuid
          readOnly: true
        input_message_id:
          type: string
          format: uuid
          readOnly: true
        attempt:
          type: integer
          minimum: 1
          readOnly: true
        retry_of_run_id:
          type: string
          format: uuid
          readOnly: true
        client_retry_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        requested_provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          readOnly: true
        requested_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        max_output_tokens:
          type: integer
          minimum: 1
          readOnly: true
        assistant_message_id:
          type: string
          format: uuid
          readOnly: true
        completion_source:
          type: string
          enum:
            - model
            - domain
          description: >-
            Present only for completed Runs. Model completions include provider
            metadata and usage; domain completions include the completing tool
            identity instead.
          readOnly: true
        provider_completion_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        provider_model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        finish_reason:
          type: string
          enum:
            - stop
            - length
          readOnly: true
        usage:
          $ref: '#/components/schemas/TokenUsage'
        domain_tool_call_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        domain_tool_name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          readOnly: true
        failure:
          $ref: '#/components/schemas/AgentRunFailure'
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentMessageList:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
        next_cursor:
          type: string
          minLength: 1
          maxLength: 1024
          readOnly: true
    AppendAgentMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_message_id
        - content
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 16384
        image_asset_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: |
            Ordered private image assets previously uploaded to this Thread.
            Omit this property or send an empty array for a plain text Message.
