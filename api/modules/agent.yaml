paths:
  /v1/matters:
    post:
      tags:
        - Matter
      summary: Create a user-owned real-world Matter
      operationId: createMatter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatterRequest'
            example:
              title: Customer renewal meeting
      responses:
        '201':
          description: The Matter was created for the trusted Actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Matter
      summary: List Matters owned by the trusted Actor
      operationId: listMatters
      responses:
        '200':
          description: The Actor's Matters ordered by latest update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatterList'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/matters/{matter_id}:
    parameters:
      - $ref: '#/components/parameters/MatterId'
    get:
      tags:
        - Matter
      summary: Restore one Matter owned by the trusted Actor
      operationId: getMatter
      responses:
        '200':
          description: The current durable Matter state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    patch:
      tags:
        - Matter
      summary: Complete, archive, or reopen an owned Matter
      operationId: changeMatterStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMatterStatusRequest'
      responses:
        '200':
          description: The Matter lifecycle transition was committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matter'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads:
    post:
      tags:
        - Agent
      summary: Create a durable Agent Thread
      description: |
        The optional active Matter must belong to the trusted Actor and be
        active. The Thread can start without a Matter for direct expression
        help. This operation does not create a Run or call a model.
      operationId: createAgentThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentThreadRequest'
            example:
              active_matter_id: 10000000-0000-4000-8000-000000000001
      responses:
        '201':
          description: The durable Thread was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Agent
      summary: List durable Agent Threads owned by the trusted Actor
      description: |
        Uses endpoint-specific opaque keyset cursors over
        `(updated_at DESC, thread_id DESC)`. A cursor from another endpoint is
        invalid. The focused Thread ID is returned independently of whether
        that Thread appears on the current page.
      operationId: listAgentThreads
      parameters:
        - $ref: '#/components/parameters/ThreadPageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page of the Actor's Threads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThreadList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/focused:
    get:
      tags:
        - Agent
      summary: Restore the trusted Actor's focused Agent Thread
      operationId: getFocusedAgentThread
      responses:
        '200':
          description: The current focused Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '204':
          description: The Actor has no focused Thread.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    put:
      tags:
        - Agent
      summary: Select one owned Agent Thread as focused
      description: |
        Repeating the same selection is idempotent. Selecting a missing or
        foreign-owned Thread returns the same not-found response.
      operationId: setFocusedAgentThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFocusedAgentThreadRequest'
      responses:
        '200':
          description: The selected canonical Agent Thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Clear the trusted Actor's focused Agent Thread
      description: Clearing an already empty focused selection is idempotent.
      operationId: clearFocusedAgentThread
      responses:
        '204':
          description: The Actor now has no focused Thread.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore one durable Agent Thread
      operationId: getAgentThread
      responses:
        '200':
          description: The owned Thread and its selected active Matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentThread'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/active-matter:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    put:
      tags:
        - Agent
      summary: Select one active Matter for a Thread
      description: |
        The link is owned by Agent Runtime. Matter remains authoritative for
        its lifecycle and must be revalidated by every future Run. Replaying an
        unchanged eligible selection is idempotent and preserves its timestamps.
      operationId: setAgentThreadActiveMatter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveMatterRequest'
      responses:
        '200':
          description: The Matter is now the Thread's single selected Matter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMatterLink'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/messages:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    get:
      tags:
        - Agent
      summary: Restore a bounded page of committed Messages
      description: |
        The first request returns the newest page. Every response page is
        ordered by ascending immutable `sequence`; `next_cursor` requests the
        immediately older page. Cursors are opaque, endpoint-specific, and
        bound to this Thread. User Messages are created only through the Run
        submission command so an initial pending Run is committed in the same
        transaction.
      operationId: listAgentMessages
      parameters:
        - $ref: '#/components/parameters/MessagePageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: One bounded page in ascending server sequence order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/voice-message-candidates:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Upload and transcribe one Agent voice Message candidate
      description: |
        The body is raw `audio/wav`. The server validates the recording, stores
        it under Agent-owned private object storage, and creates durable ASR
        candidate state. This operation never creates an AgentMessage or
        AgentRun; the user must explicitly confirm a returned candidate
        version. The upload idempotency scope is the trusted Actor, Thread, key,
        and recording checksum.
      operationId: createAgentVoiceMessageCandidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Durable candidate state, including the current ASR result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    get:
      tags:
        - Agent
      summary: Restore one owned Agent voice Message candidate
      operationId: getAgentVoiceMessageCandidate
      responses:
        '200':
          description: Current durable candidate and ASR state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    delete:
      tags:
        - Agent
      summary: Delete one unconfirmed Agent voice Message candidate
      description: |
        Object deletion is ordered after durable `deleting` state. Repeating a
        completed deletion is idempotent. If the candidate was already
        confirmed, its canonical AgentMessage text and AgentRun remain durable
        while the attached recording becomes unavailable.
      operationId: deleteAgentVoiceMessageCandidate
      responses:
        '204':
          description: Candidate recording deletion completed.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    post:
      tags:
        - Agent
      summary: Retry ASR for one retryable Agent voice Message candidate
      description: |
        A successful lease claim increments both `asr_attempt` and
        `candidate_version`. The server reloads the private recording and fences
        late workers so an older attempt cannot overwrite the current result.
        The request has no body.
      operationId: retryAgentVoiceMessageCandidate
      responses:
        '200':
          description: Current candidate after the retry or concurrent recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageCandidate'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-voice-message-candidates/{candidate_id}/confirmations:
    parameters:
      - $ref: '#/components/parameters/AgentVoiceCandidateId'
    post:
      tags:
        - Agent
      summary: Confirm a candidate as one canonical Agent voice Message
      description: |
        Confirmation atomically creates the user AgentMessage, its durable audio
        projection, immutable transcript evidence, and the initial pending
        AgentRun. `confirmed_text`, not the provider candidate text, becomes the
        canonical Message content. Replaying the same version and command
        restores and, when needed, resumes the original Run. Confirming an old
        candidate version returns 409.
      operationId: confirmAgentVoiceMessageCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAgentVoiceMessageCandidateRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '202':
          description: The original durable Run remains pending or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVoiceMessageConfirmation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}/playback:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    get:
      tags:
        - Agent
      summary: Issue temporary playback access for one owned Agent recording
      description: |
        The returned HTTPS URL is an ephemeral bearer capability that expires
        no later than two minutes after issuance. It must not be persisted,
        logged, or shared. Deleted, deleting, missing, and foreign-owned audio
        resources all produce the same not-found response.
      operationId: getAgentMessageAudioPlayback
      responses:
        '200':
          description: Temporary private-recording playback access.
          headers:
            Cache-Control:
              description: Prevent storage of the bearer capability response.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAudioPlayback'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-message-audios/{audio_id}:
    parameters:
      - $ref: '#/components/parameters/AgentMessageAudioId'
    delete:
      tags:
        - Agent
      summary: Delete the recording attached to an Agent voice Message
      description: |
        The canonical AgentMessage and its confirmed text remain in history.
        The audio projection becomes `deleted` and no longer exposes a playback
        path. Repeating a completed deletion is idempotent.
      operationId: deleteAgentMessageAudio
      responses:
        '204':
          description: Recording deletion completed; text history remains.
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/speech:
    parameters:
      - $ref: '#/components/parameters/AgentMessageId'
    get:
      tags:
        - Agent
      summary: Synthesize one assistant Agent Message on demand
      description: |
        Returns ephemeral WAV bytes synthesized from the assistant Message's
        canonical text. The server never persists this generated TTS audio.
        User Messages and foreign-owned Messages produce the same not-found
        response.
      operationId: getAgentMessageSpeech
      responses:
        '200':
          description: Ephemeral synthesized assistant speech.
          headers:
            Cache-Control:
              description: Prevent storage of generated speech.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-threads/{thread_id}/runs:
    parameters:
      - $ref: '#/components/parameters/AgentThreadId'
    post:
      tags:
        - Agent
      summary: Submit one user Message and run the text Agent
      description: |
        The user Message and its initial pending AgentRun are committed in one
        transaction. `client_message_id` is scoped to the trusted Actor and
        Thread. Replaying the same ID and content restores the original Run;
        changing the content returns 409. Provider failures are represented by
        a durable `failed` Run so clients can inspect stable retry semantics.
      operationId: submitAgentTextRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRunRequest'
      responses:
        '201':
          description: The original or replayed Run reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing this durable Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Restore an owned AgentRun
      operationId: getAgentRun
      responses:
        '200':
          description: The current durable Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/retries:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    post:
      tags:
        - Agent
      summary: Create a new attempt for one retryable failed Run
      description: |
        A retry never overwrites the failed Run. `client_retry_id` makes the
        retry command idempotent for the trusted Actor and Thread.
      operationId: retryAgentRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAgentRunRequest'
      responses:
        '201':
          description: The original or replayed retry reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '202':
          description: Another request is already processing the retry Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-runs/{run_id}/context-manifest:
    parameters:
      - $ref: '#/components/parameters/AgentRunId'
    get:
      tags:
        - Agent
      summary: Explain the persisted sources and budgets for one AgentRun
      description: |
        This audit projection contains selected Matter and Message sources,
        trimming, and final model configuration. It never contains hidden
        reasoning or credentials.
      operationId: getAgentRunContextManifest
      responses:
        '200':
          description: The immutable ContextManifest for the owned Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextManifest'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    MatterId:
      name: matter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentVoiceCandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageAudioId:
      name: audio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
    ThreadPageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MessagePageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Endpoint-specific opaque keyset cursor returned by the server.
  schemas:
    MatterStatus:
      type: string
      enum:
        - active
        - completed
        - archived
    Matter:
      type: object
      additionalProperties: false
      required:
        - matter_id
        - title
        - status
        - version
        - created_at
        - updated_at
      properties:
        matter_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
        status:
          $ref: '#/components/schemas/MatterStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    MatterList:
      type: object
      additionalProperties: false
      required:
        - matters
      properties:
        matters:
          type: array
          items:
            $ref: '#/components/schemas/Matter'
    CreateMatterRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
    ChangeMatterStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - expected_version
      properties:
        status:
          $ref: '#/components/schemas/MatterStatus'
        expected_version:
          type: integer
          format: int64
          minimum: 1
    AgentThread:
      type: object
      additionalProperties: false
      required:
        - thread_id
        - title
        - created_at
        - updated_at
      properties:
