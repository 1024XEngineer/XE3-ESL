          $ref: '#/components/schemas/Version'
    JobTargetCandidate:
      type: object
      description: |
        Unconfirmed or user-confirmed structured candidate. Its compact UTF-8
        JSON encoding is limited to 65536 bytes by every server boundary.
      x-max-utf8-json-bytes: 65536
      additionalProperties: false
      required:
        - source
        - general_advice_only
        - job_title
        - seniority
        - responsibilities
        - core_skills
        - communication_focus
        - practice_goals
        - scope_notice
        - catalog_recommendation
      properties:
