        job_title:
          type: string
          minLength: 1
          maxLength: 512
        seniority:
          type: string
          minLength: 1
          maxLength: 256
        responsibilities:
          $ref: '#/components/schemas/JobTargetCandidateItems'
        core_skills:
          $ref: '#/components/schemas/JobTargetCandidateItems'
        communication_focus:
