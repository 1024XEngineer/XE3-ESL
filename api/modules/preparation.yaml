paths:
  /v1/interview-preparations:
    post:
      tags: [Preparation]
      summary: Analyze interview material into a preparation card
      operationId: createInterviewPreparation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateInterviewPreparationRequest'
            encoding:
              input:
                contentType: application/json
      responses:
        '201':
          description: The actor-owned draft interview preparation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewPreparation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        '502':
          $ref: ../common/errors.yaml#/components/responses/DefaultError
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/interview-preparations/{interview_preparation_id}:
    get:
      tags: [Preparation]
      summary: Get an interview preparation
      operationId: getInterviewPreparation
      parameters:
        - $ref: '#/components/parameters/InterviewPreparationId'
      responses:
        '200':
          description: The actor-owned interview preparation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewPreparation'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    patch:
      tags: [Preparation]
      summary: Regenerate, confirm, or discard an interview preparation
      operationId: patchInterviewPreparation
      parameters:
        - $ref: '#/components/parameters/InterviewPreparationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchInterviewPreparationRequest'
      responses:
        '200':
          description: The updated interview preparation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewPreparation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-plans:
    get:
      tags: [Preparation]
      summary: List the current user's practice cards
      operationId: listPracticePlans
      parameters:
        - name: practice_experience
          in: query
          required: true
          schema:
            $ref: ../modules/scene.yaml#/components/schemas/PracticeExperience
      responses:
        '200':
          description: Newest-first practice cards for the requested experience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlanList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    post:
      tags: [Preparation]
      summary: Create a practice card from current user input
      description: |
        Creates one complete PracticePlan. Interview plans reference one exact
        confirmed InterviewPreparation version. Direct Scene plans carry only
        their background summary. The Plan freezes all execution inputs used by
        later Sessions; there is no separate Profile, Snapshot, or revision row.
      operationId: createPracticePlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePracticePlanRequest'
            example:
              source_thread_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              background_summary: Backend engineer preparing concise project stories.
              scene_id: interview
              scene_version: 1
              selected_role_ids: [interviewer]
              practice_option_id: full_simulation
              max_effective_turns: 6
      responses:
        '201':
          description: The created practice card or its idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-plans/{practice_plan_id}:
    get:
      tags: [Preparation]
      summary: Get a practice card
      operationId: getPracticePlan
      parameters:
        - $ref: '#/components/parameters/PracticePlanId'
      responses:
        '200':
          description: The actor-owned practice card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-plans/{practice_plan_id}/confirm:
    post:
      tags: [Preparation]
      summary: Confirm an Agent-created draft practice card
      operationId: confirmPracticePlan
      parameters:
        - $ref: '#/components/parameters/PracticePlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPracticePlanRequest'
      responses:
        '200':
          description: The ready practice card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    InterviewPreparationId:
      name: interview_preparation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AggregateId'
    PracticePlanId:
      name: practice_plan_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AggregateId'
  schemas:
    AggregateId:
      type: string
      format: uuid
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    JobTargetSource:
      type: string
      enum: [job_description, quick_start]
    InterviewPreparationInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/JobTargetSource'
        job_title:
          type: string
          maxLength: 512
        job_description:
          type: string
          maxLength: 65536
        company:
          type: string
          maxLength: 512
        seniority:
          type: string
          maxLength: 256
        candidate_background:
          type: string
          maxLength: 16384
        practice_focus:
          type: string
          maxLength: 8192
    InterviewCatalogRecommendation:
      type: object
      additionalProperties: false
      required:
        - scene_id
        - scene_version
        - selected_role_ids
        - practice_option_id
      properties:
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        scene_version:
          type: integer
          minimum: 1
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
    InterviewPreparationCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - general_advice_only
        - job_title
        - seniority
        - responsibilities
        - core_skills
        - communication_focus
        - practice_goals
        - scope_notice
        - catalog_recommendation
      properties:
        source:
          $ref: '#/components/schemas/JobTargetSource'
        general_advice_only:
          type: boolean
        job_title:
          type: string
          minLength: 1
        company:
          type: string
        seniority:
          type: string
          minLength: 1
        responsibilities:
          $ref: '#/components/schemas/NonEmptyTextList'
        core_skills:
          $ref: '#/components/schemas/NonEmptyTextList'
        communication_focus:
          $ref: '#/components/schemas/NonEmptyTextList'
        practice_goals:
          $ref: '#/components/schemas/NonEmptyTextList'
        scope_notice:
          type: string
          minLength: 1
        catalog_recommendation:
          $ref: '#/components/schemas/InterviewCatalogRecommendation'
    NonEmptyTextList:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 2048
    ResumeMaterial:
      type: object
      additionalProperties: false
      required:
        - target_position
        - professional_summary
        - work_experiences
        - project_experiences
        - education_experiences
        - skills
        - awards
      properties:
        target_position:
          type: string
        professional_summary:
          type: string
        work_experiences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [company, position, duties, achievements]
            properties:
              company: {type: string}
              position: {type: string}
              start_date: {type: string}
              end_date: {type: string}
              duties:
                type: array
                items: {type: string}
              achievements:
                type: array
                items: {type: string}
        project_experiences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [project_name, role, description, technologies, duties, achievements]
            properties:
              project_name: {type: string}
              role: {type: string}
              description: {type: string}
              technologies:
                type: array
                items: {type: string}
              duties:
                type: array
                items: {type: string}
              achievements:
                type: array
                items: {type: string}
        education_experiences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [school, major, degree]
            properties:
              school: {type: string}
              major: {type: string}
              degree: {type: string}
              gpa: {type: string}
              start_date: {type: string}
              end_date: {type: string}
        skills:
          type: array
          items: {type: string}
        awards:
          type: array
          items: {type: string}
    CreateInterviewPreparationRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          $ref: '#/components/schemas/InterviewPreparationInput'
        resume:
          type: string
          format: binary
          contentMediaType: application/pdf
    PatchInterviewPreparationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, action]
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [regenerate, confirm, discard]
        input:
          $ref: '#/components/schemas/InterviewPreparationInput'
        candidate:
          $ref: '#/components/schemas/InterviewPreparationCandidate'
    InterviewPreparation:
      type: object
      additionalProperties: false
      required:
        - interview_preparation_id
        - user_id
        - input
        - candidate
        - status
        - version
        - created_at
        - updated_at
      properties:
        interview_preparation_id:
          $ref: '#/components/schemas/AggregateId'
        user_id:
          type: string
          format: uuid
        input:
          $ref: '#/components/schemas/InterviewPreparationInput'
        candidate:
          $ref: '#/components/schemas/InterviewPreparationCandidate'
        resume_content:
          $ref: '#/components/schemas/ResumeMaterial'
        status:
          type: string
          enum: [draft, confirmed, discarded]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePracticePlanRequest:
      type: object
      additionalProperties: false
      required:
        - scene_id
        - scene_version
        - selected_role_ids
        - practice_option_id
      properties:
        source_thread_id:
          type: string
          format: uuid
        background_summary:
          type: string
          maxLength: 65536
        interview_preparation_id:
          $ref: '#/components/schemas/AggregateId'
        expected_interview_version:
          type: integer
          minimum: 1
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        scene_version:
          type: integer
          minimum: 1
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
        max_effective_turns:
          type: integer
          minimum: 0
          maximum: 64
        ielts_selection:
          $ref: '#/components/schemas/IELTSQuestionSelection'
        ielts_prepared_answers:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/IELTSPreparedAnswerRequest'
    ConfirmPracticePlanRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
    PlanPreparationSnapshot:
      type: object
      additionalProperties: false
      required: [background_summary]
      properties:
        background_summary:
          type: string
        interview:
          $ref: '#/components/schemas/InterviewPreparationSnapshot'
    InterviewPreparationSnapshot:
      type: object
      additionalProperties: false
      required: [interview_preparation_id, version, input, candidate]
      properties:
        interview_preparation_id:
          $ref: '#/components/schemas/AggregateId'
        version:
          type: integer
          minimum: 1
        input:
          $ref: '#/components/schemas/InterviewPreparationInput'
        candidate:
          $ref: '#/components/schemas/InterviewPreparationCandidate'
        resume_content:
          $ref: '#/components/schemas/ResumeMaterial'
    SceneSelectionSnapshot:
      type: object
      additionalProperties: false
      required: [scene, selected_role_ids, practice_option_id]
      properties:
        scene:
          $ref: ../modules/scene.yaml#/components/schemas/SceneDefinition
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
    PracticeSessionPolicy:
      type: object
      additionalProperties: false
      required:
        - completion_mode
        - suggested_duration_seconds
        - min_effective_turns
        - max_effective_turns
        - coverage_checkpoint_turn
        - max_follow_ups_per_question
        - early_completion_rule
        - retry_allowed
        - question_translation_allowed
        - question_tips_allowed
        - speech_feedback_allowed
      properties:
        completion_mode:
          type: string
          enum: [TURN_LIMITED, USER_CONTROLLED]
        suggested_duration_seconds: {type: integer, minimum: 1}
        min_effective_turns: {type: integer, minimum: 1}
        max_effective_turns: {type: integer, minimum: 0, maximum: 64}
        coverage_checkpoint_turn: {type: integer, minimum: 1}
        max_follow_ups_per_question: {type: integer, minimum: 0}
        early_completion_rule:
          type: string
          enum: [COVERAGE_SATISFIED_AFTER_CHECKPOINT]
        retry_allowed: {type: boolean}
        question_translation_allowed: {type: boolean}
        question_tips_allowed: {type: boolean}
        speech_feedback_allowed: {type: boolean}
    PracticeObjective:
      type: object
      additionalProperties: false
      required: [objective_id, description]
      properties:
        objective_id:
          $ref: '#/components/schemas/ResourceId'
        description:
          type: string
          minLength: 1
    IELTSQuestionSelection:
      type: object
      additionalProperties: false
      properties:
        part_1_set_id: {type: string}
        topic_group_id: {type: string}
        cue_card_type: {type: string}
    IELTSPreparedAnswerRequest:
      type: object
      additionalProperties: false
      required: [bank_id, part, source_id, question_position, answer, personalized]
      properties:
        bank_id: {type: string}
        part:
          type: string
          enum: [PART_1, PART_2, PART_3]
        source_id: {type: string}
        question_position: {type: integer, minimum: 1}
        answer: {type: string, minLength: 1, maxLength: 2000}
        personalized: {type: boolean}
    IELTSPreparedAnswer:
      type: object
      additionalProperties: false
      required: [question_position, answer, personalized]
      properties:
        question_position: {type: integer, minimum: 1}
        answer: {type: string, minLength: 1, maxLength: 2000}
        personalized: {type: boolean}
    IELTSAssignmentPart:
      type: object
      additionalProperties: false
      required: [part, source_id, turn_blueprints]
      properties:
        part:
          type: string
          enum: [PART_1, PART_2, PART_3]
        source_id: {type: string}
        topic_title: {type: string}
        cue_card: {type: string}
        turn_blueprints:
          type: array
          minItems: 1
          items: {type: string}
        prepared_answers:
          type: array
          items:
            $ref: '#/components/schemas/IELTSPreparedAnswer'
    IELTSAssignment:
      type: object
      additionalProperties: false
      required: [bank_id, season, mode, parts]
      properties:
        bank_id: {type: string}
        season: {type: string}
        mode:
          type: string
          enum: [FULL_MOCK, PART_1, PART_2, PART_3]
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IELTSAssignmentPart'
    PracticePlan:
      type: object
      additionalProperties: false
      required:
        - practice_plan_id
        - user_id
        - preparation_snapshot
        - scene_selection
        - session_policy
        - practice_objectives
        - version
        - practice_plan_status
        - created_at
        - updated_at
      properties:
        practice_plan_id:
          $ref: '#/components/schemas/AggregateId'
        user_id:
          type: string
          format: uuid
        source_thread_id:
          type: string
          format: uuid
        preparation_snapshot:
          $ref: '#/components/schemas/PlanPreparationSnapshot'
        scene_selection:
          $ref: '#/components/schemas/SceneSelectionSnapshot'
        session_policy:
          $ref: '#/components/schemas/PracticeSessionPolicy'
        practice_objectives:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PracticeObjective'
        ielts_assignment:
          $ref: '#/components/schemas/IELTSAssignment'
        version:
          type: integer
          minimum: 1
        practice_plan_status:
          type: string
          enum: [draft, ready]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PracticePlanSummary:
      type: object
      additionalProperties: false
      required:
        - practice_plan_id
        - version
        - practice_plan_status
        - practice_experience
        - scene_name
        - practice_scope
        - job_title
        - practice_objectives
        - resume_used
        - suggested_duration_seconds
        - min_effective_turns
        - max_effective_turns
        - created_at
        - updated_at
      properties:
        practice_plan_id:
          $ref: '#/components/schemas/AggregateId'
        version: {type: integer, minimum: 1}
        practice_plan_status:
          type: string
          enum: [draft, ready]
        practice_experience:
          $ref: ../modules/scene.yaml#/components/schemas/PracticeExperience
        scene_name: {type: string}
        practice_scope: {type: string}
        job_title: {type: string}
        practice_objectives:
          type: array
          minItems: 1
          items: {type: string}
        resume_used: {type: boolean}
        suggested_duration_seconds: {type: integer, minimum: 1}
        min_effective_turns: {type: integer, minimum: 1}
        max_effective_turns: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PracticePlanList:
      type: object
      additionalProperties: false
      required: [practice_plans]
      properties:
        practice_plans:
          type: array
          items:
            $ref: '#/components/schemas/PracticePlanSummary'
