paths:
  /v1/practice-plans:
    post:
      tags:
        - Preparation
      summary: Create a complete practice plan revision
      description: |
        Creates one ready PracticePlan from an immutable Preparation Snapshot
        and an exact active Scene version. Goal and Agent Thread references are
        optional, actor-owned context; neither is used as a fallback or as an
        anchor for the other. The persisted revision freezes every input needed
        by Practice and does not create a PracticeSession.
      operationId: createPracticePlan
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePracticePlanRequest'
            example:
              source_thread_id: 20000000-0000-4000-8000-000000000001
              goal_id: 10000000-0000-4000-8000-000000000001
              preparation_snapshot_id: psnap_demo_backend_v1
              scene_id: scn_programmer_interview
              scene_version: 1
              selected_role_ids:
                - role_technical_interviewer
              practice_option_id: option_technical_focus
      responses:
        '201':
          description: A complete ready PracticePlan or its idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-plans/{practice_plan_id}:
    get:
      tags:
        - Preparation
      summary: Get the current practice plan revision
      operationId: getPracticePlan
      parameters:
        - $ref: '#/components/parameters/PracticePlanId'
      responses:
        '200':
          description: The actor-owned current PracticePlan revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    put:
      tags:
        - Preparation
      summary: Append a practice plan revision
      description: |
        Appends a complete immutable revision using the expected current
        revision. The frozen Goal, Preparation Snapshot, and Scene version do
        not change; only the selected roles, option, policy, and objectives are
        recalculated from the already frozen Scene definition.
      operationId: updatePracticePlan
      parameters:
        - $ref: '#/components/parameters/PracticePlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePracticePlanRequest'
      responses:
        '200':
          description: The appended ready revision or its idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticePlan'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/preparation-profiles:
    post:
      tags:
        - Preparation
      summary: Create or return the preparation profile for one intent
      description: |
        The authenticated actor is resolved from the Bearer Session and owns the
        created profile. The request does not accept a trusted `user_id`. A fixed
        actor may be supplied only by an explicit Mock or Test adapter. When
        supplied, `job_target_id` and `job_target_confirmation_version` bind
        the profile to one exact server-confirmed JobTarget version; the pair
        must be supplied together. `resume_id` and `resume_revision` likewise
        bind one exact, parsed Resume Revision owned by the actor.
      operationId: createPreparationProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreparationProfileRequest'
            example:
              resume_id: 50000000-0000-4000-8000-000000000001
              resume_revision: 1
              job_description_ref: jd_demo_backend_v1
              background_summary: |-
                Backend engineer with three years of Go experience, responsible
                for an API reliability project and cross-team delivery.
      responses:
        '201':
          description: The preparation profile created for the current actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationProfile'
              example:
                preparation_profile_id: prep_demo_backend
                user_id: user_demo
                resume_id: 50000000-0000-4000-8000-000000000001
                resume_revision: 1
                job_description_ref: jd_demo_backend_v1
                background_summary: |
                  Backend engineer with three years of Go experience, responsible
                  for an API reliability project and cross-team delivery.
                version: 1
                updated_at: '2026-07-23T10:00:00Z'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/preparation-profiles/{preparation_profile_id}/snapshots:
    post:
      tags:
        - Preparation
      summary: Freeze a confirmed preparation profile
      operationId: createPreparationSnapshot
      parameters:
        - $ref: '#/components/parameters/PreparationProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreparationSnapshotRequest'
            example:
              source_version: 1
      responses:
        '201':
          description: Immutable preparation content for a future session snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationSnapshot'
              example:
                preparation_snapshot_id: psnap_demo_backend_v1
                source_profile_id: prep_demo_backend
                source_version: 1
                resume_snapshot:
                  resume_id: 50000000-0000-4000-8000-000000000001
                  revision: 1
                  material:
                    target_position: Backend Engineer
                    professional_summary: Go backend engineer.
                    work_experiences: []
                    project_experiences: []
                    education_experiences: []
                    skills: [Go, PostgreSQL]
                    awards: []
                job_description_snapshot: Build reliable APIs and explain engineering trade-offs.
                background_snapshot: |
                  Backend engineer with three years of Go experience, responsible
                  for an API reliability project and cross-team delivery.
                created_at: '2026-07-23T10:01:00Z'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets:
    post:
      tags:
        - Preparation
      summary: Create a JobTarget draft
      description: |
        Creates actor-owned, versioned untrusted input. `job_description`
        requires inline job_description. `quick_start` requires job_title and
        omits job_description. This operation does not create a Snapshot, Plan,
        or Session.
      operationId: createJobTarget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobTargetRequest'
      responses:
        '201':
          description: Created draft or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}:
    get:
      tags:
        - Preparation
      summary: Restore a JobTarget stage
      description: |
        Returns only the authenticated actor's current server-authoritative
        input, analysis, and confirmation stage. Cross-account and discarded
        targets return 404.
      operationId: getJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
      responses:
        '200':
          description: Current JobTarget recovery projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    put:
      tags:
        - Preparation
      summary: Replace JobTarget input
      description: |
        Replaces the editable input at the expected version. A material change
        increments input_version and immediately makes prior analysis and
        confirmation inapplicable to the current projection.
      operationId: updateJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobTargetRequest'
      responses:
        '200':
          description: Updated draft or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/analyses:
    post:
      tags:
        - Preparation
      summary: Start or recover JobTarget parsing
      description: |
        Claims at most one live parser attempt for the expected input version.
        A live attempt returns 202; a completed candidate returns 200. Parser
        output remains unconfirmed and cannot itself become user fact.
      operationId: analyzeJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeJobTargetRequest'
      responses:
        '200':
          description: Parsed candidate or recovered terminal parse stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '202':
          description: Another worker holds the current live parse lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        '503':
          $ref: ../common/errors.yaml#/components/responses/DefaultError
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/confirmations:
    post:
      tags:
        - Preparation
      summary: Confirm an edited JobTarget candidate
      description: |
        Persists an explicit user-edited confirmation for the exact input and
        analysis versions. No Snapshot, Plan, or Session is created.
      operationId: confirmJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmJobTargetRequest'
      responses:
        '200':
          description: Confirmed JobTarget or original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/discard:
    post:
      tags:
        - Preparation
      summary: Discard an unconfirmed JobTarget draft
      operationId: discardJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardJobTargetRequest'
      responses:
        '200':
          description: Discarded target tombstone or original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    PracticePlanId:
      name: practice_plan_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    PreparationProfileId:
      name: preparation_profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    JobTargetId:
      name: job_target_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    Version:
      type: integer
      minimum: 1
    CreatePracticePlanRequest:
      type: object
      additionalProperties: false
      required:
        - preparation_snapshot_id
        - scene_id
        - scene_version
        - selected_role_ids
        - practice_option_id
      properties:
        source_thread_id:
          $ref: '#/components/schemas/ResourceId'
        goal_id:
          $ref: '#/components/schemas/ResourceId'
        preparation_snapshot_id:
          $ref: '#/components/schemas/ResourceId'
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        scene_version:
          $ref: '#/components/schemas/Version'
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
        ielts_selection:
          $ref: '#/components/schemas/IELTSPracticeSelection'
        max_effective_turns:
          type: integer
          minimum: 1
    UpdatePracticePlanRequest:
      type: object
      additionalProperties: false
      required:
        - expected_plan_revision
        - selected_role_ids
        - practice_option_id
        - max_effective_turns
      properties:
        expected_plan_revision:
          $ref: '#/components/schemas/Version'
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
        max_effective_turns:
          type: integer
          minimum: 1
    GoalSnapshot:
      type: object
      additionalProperties: false
      required:
        - goal_id
        - title
        - version
      properties:
        goal_id:
          $ref: '#/components/schemas/ResourceId'
        title:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          format: int64
          minimum: 1
    SceneSelectionSnapshot:
      type: object
      additionalProperties: false
      required:
        - scene
        - selected_role_ids
        - practice_option_id
      properties:
        scene:
          $ref: ./scene.yaml#/components/schemas/SceneDefinition
        selected_role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceId'
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
    PracticeObjective:
      type: object
      additionalProperties: false
      required:
        - objective_id
        - description
      properties:
        objective_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,127}$'
        description:
          type: string
          minLength: 1
    PracticeSessionPolicy:
      type: object
      additionalProperties: false
      description: |
        The effective-Turn budget frozen into a PracticePlan revision. Invalid
        input and technical failures do not advance the budget.
      required:
        - suggested_duration_seconds
        - min_effective_turns
        - max_effective_turns
        - coverage_checkpoint_turn
        - max_follow_ups_per_question
        - early_completion_rule
        - retry_allowed
        - question_translation_allowed
      properties:
        suggested_duration_seconds:
          type: integer
          minimum: 1
        min_effective_turns:
          type: integer
          minimum: 1
        max_effective_turns:
          type: integer
          minimum: 1
        coverage_checkpoint_turn:
          type: integer
          minimum: 1
        max_follow_ups_per_question:
          type: integer
          minimum: 0
          maximum: 3
        early_completion_rule:
          type: string
          enum:
            - COVERAGE_SATISFIED_AFTER_CHECKPOINT
        retry_allowed:
          type: boolean
        question_translation_allowed:
          type: boolean
    IELTSPracticeSelection:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - FULL_MOCK
            - PART_1
            - PART_2
            - PART_3
        part_1_set_id:
          $ref: '#/components/schemas/ResourceId'
        topic_group_id:
          $ref: '#/components/schemas/ResourceId'
      oneOf:
        - properties:
            mode:
              const: FULL_MOCK
          required:
            - part_1_set_id
            - topic_group_id
        - properties:
            mode:
              const: PART_1
          required:
            - part_1_set_id
          not:
            required:
              - topic_group_id
        - properties:
            mode:
              enum:
                - PART_2
                - PART_3
          required:
            - topic_group_id
          not:
            required:
              - part_1_set_id
    IELTSPracticeAssignment:
      type: object
      additionalProperties: false
      required:
        - bank_id
        - season
        - mode
        - part_1_questions
        - part_2_questions
        - part_3_questions
        - turn_blueprints
      properties:
        bank_id:
          $ref: '#/components/schemas/ResourceId'
        season:
          type: string
          minLength: 1
        mode:
          type: string
          enum:
            - FULL_MOCK
            - PART_1
            - PART_2
            - PART_3
        part_1_set_id:
          $ref: '#/components/schemas/ResourceId'
        topic_group_id:
          $ref: '#/components/schemas/ResourceId'
        topic_title:
          type: string
          minLength: 1
        part_2_cue_card:
          type: string
          minLength: 1
        part_1_questions:
          type: integer
          minimum: 0
          maximum: 8
        part_2_questions:
          type: integer
          minimum: 0
          maximum: 1
        part_3_questions:
          type: integer
          minimum: 0
          maximum: 5
        turn_blueprints:
          type: array
          minItems: 1
          maxItems: 14
          items:
            type: string
            minLength: 1
    PracticePlan:
      type: object
      additionalProperties: false
      required:
        - practice_plan_id
        - user_id
        - preparation_snapshot
        - scene_selection
        - session_policy
        - practice_objectives
        - plan_revision
        - practice_plan_status
        - created_at
        - updated_at
      properties:
        practice_plan_id:
          $ref: '#/components/schemas/ResourceId'
        user_id:
          $ref: '#/components/schemas/ResourceId'
        source_thread_id:
          $ref: '#/components/schemas/ResourceId'
        goal_snapshot:
          $ref: '#/components/schemas/GoalSnapshot'
        preparation_snapshot:
          $ref: '#/components/schemas/PreparationSnapshot'
        scene_selection:
          $ref: '#/components/schemas/SceneSelectionSnapshot'
        session_policy:
          $ref: '#/components/schemas/PracticeSessionPolicy'
        practice_objectives:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PracticeObjective'
        ielts_assignment:
          $ref: '#/components/schemas/IELTSPracticeAssignment'
        plan_revision:
          $ref: '#/components/schemas/Version'
        practice_plan_status:
          type: string
          enum:
            - ready
            - archived
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePreparationProfileRequest:
      type: object
      additionalProperties: false
      required:
        - background_summary
      properties:
        resume_id:
          type: string
          format: uuid
        resume_revision:
          type: integer
          format: int64
          minimum: 1
        job_description_ref:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: '^[^\s\u0000](?:[^\u0000]*[^\s\u0000])?$'
        background_summary:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: '^[^\s\u0000](?:[^\u0000]*[^\s\u0000])?$'
        job_target_id:
          $ref: '#/components/schemas/ResourceId'
        job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
      dependentRequired:
        resume_id:
          - resume_revision
        resume_revision:
          - resume_id
        job_target_id:
          - job_target_confirmation_version
        job_target_confirmation_version:
          - job_target_id
    PreparationProfile:
      type: object
      additionalProperties: false
      required:
        - preparation_profile_id
        - user_id
        - background_summary
        - version
        - updated_at
      properties:
        preparation_profile_id:
          $ref: '#/components/schemas/ResourceId'
        user_id:
          $ref: '#/components/schemas/ResourceId'
        resume_id:
          type: string
          format: uuid
        resume_revision:
          type: integer
          format: int64
          minimum: 1
        job_description_ref:
          type: string
          minLength: 1
        background_summary:
          type: string
          minLength: 1
        job_target_id:
          $ref: '#/components/schemas/ResourceId'
        job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
        version:
          $ref: '#/components/schemas/Version'
        updated_at:
          type: string
          format: date-time
      dependentRequired:
        resume_id:
          - resume_revision
        resume_revision:
          - resume_id
        job_target_id:
          - job_target_confirmation_version
        job_target_confirmation_version:
          - job_target_id
    CreatePreparationSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - source_version
      properties:
        source_version:
          $ref: '#/components/schemas/Version'
    PreparationSnapshot:
      type: object
      additionalProperties: false
      required:
        - preparation_snapshot_id
        - source_profile_id
        - source_version
        - background_snapshot
        - created_at
      properties:
        preparation_snapshot_id:
          $ref: '#/components/schemas/ResourceId'
        source_profile_id:
          $ref: '#/components/schemas/ResourceId'
        source_version:
          $ref: '#/components/schemas/Version'
        source_job_target_id:
          $ref: '#/components/schemas/ResourceId'
        source_job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
        job_target_input_snapshot:
          $ref: '#/components/schemas/JobTargetInput'
        job_target_candidate_snapshot:
          $ref: '#/components/schemas/JobTargetCandidate'
        resume_snapshot:
          $ref: '#/components/schemas/PreparationResumeRevisionSnapshot'
        job_description_snapshot:
          type: string
          minLength: 1
        background_snapshot:
          type: string
          minLength: 1
