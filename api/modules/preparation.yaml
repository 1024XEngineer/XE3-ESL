paths:
  /v1/scenario-definitions:
    get:
      tags:
        - Preparation
      summary: List active scenario definitions
      description: |
        Returns active scenarios in stable menu order. Presentation order does
        not define a workflow or required progression.
      operationId: listScenarioDefinitions
      security: []
      responses:
        '200':
          description: Active scenarios in stable display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDefinitionList'
              example:
                scenarios:
                  - scenario_definition_id: scn_programmer_interview
                    scenario_type: INTERVIEW
                    name: English interview for technical roles
                    version: 1
                    status: active
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/scenario-definitions/{scenario_definition_id}:
    get:
      tags:
        - Preparation
      summary: Get an active scenario definition and its MS1 configuration
      description: |
        Returns the current configuration and stable practice choices for one
        scenario. FULL_SIMULATION uses the caller's selected interviewer
        perspective; each FOCUS option is bound to exactly one perspective.
      operationId: getScenarioDefinition
      security: []
      parameters:
        - $ref: '#/components/parameters/ScenarioDefinitionId'
      responses:
        '200':
          description: Scenario definition, current configuration, and practice options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
              example:
                scenario_definition:
                  scenario_definition_id: scn_programmer_interview
                  scenario_type: INTERVIEW
                  name: English interview for technical roles
                  version: 1
                  status: active
                scenario_config:
                  scenario_config_id: scfg_backend_engineer
                  scenario_definition_id: scn_programmer_interview
                  config_type: INTERVIEW
                  version: 1
                  job_title: Backend engineer
                  job_description: Build reliable APIs and explain engineering trade-offs.
                  focus_areas:
                    - introduction
                    - system_design
                    - project_depth
                    - collaboration
                practice_options:
                  - practice_option_id: option_full_simulation
                    scenario_definition_id: scn_programmer_interview
                    practice_option_type: FULL_SIMULATION
                    display_name: Full simulation
                    version: 1
                  - practice_option_id: option_technical_focus
                    scenario_definition_id: scn_programmer_interview
                    role_definition_id: role_technical_interviewer
                    practice_option_type: FOCUS
                    display_name: Technical depth focus
                    version: 1
                  - practice_option_id: option_hr_focus
                    scenario_definition_id: scn_programmer_interview
                    role_definition_id: role_hr_interviewer
                    practice_option_type: FOCUS
                    display_name: Recruiter and motivation focus
                    version: 1
                  - practice_option_id: option_project_manager_focus
                    scenario_definition_id: scn_programmer_interview
                    role_definition_id: role_project_manager
                    practice_option_type: FOCUS
                    display_name: Delivery and collaboration focus
                    version: 1
                  - practice_option_id: option_executive_focus
                    scenario_definition_id: scn_programmer_interview
                    role_definition_id: role_executive_interviewer
                    practice_option_type: FOCUS
                    display_name: Leadership and impact focus
                    version: 1
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/scenario-definitions/{scenario_definition_id}/role-definitions:
    get:
      tags:
        - Preparation
      summary: List optional interviewer perspectives for a scenario
      description: |
        Each role is an independently selectable interviewer perspective, not a
        mandatory recruitment stage. The stable response order is menu
        presentation only. Leadership and impact is an optional perspective for
        senior, lead, or management roles.
      operationId: listRoleDefinitions
      security: []
      parameters:
        - $ref: '#/components/parameters/ScenarioDefinitionId'
      responses:
        '200':
          description: Role definitions in stable display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionList'
              example:
                roles:
                  - role_definition_id: role_technical_interviewer
                    scenario_definition_id: scn_programmer_interview
                    role_type: TECHNICAL_INTERVIEWER
                    display_name: Technical depth perspective
                    responsibilities: Probe technical depth, engineering trade-offs, and decision making.
                    style: Precise and evidence seeking.
                    focus_areas:
                      - system_design
                      - project_depth
                    version: 1
                  - role_definition_id: role_hr_interviewer
                    scenario_definition_id: scn_programmer_interview
                    role_type: HR_INTERVIEWER
                    display_name: Recruiter and motivation perspective
                    responsibilities: Explore career motivation and communication clarity.
                    style: Warm and structured.
                    focus_areas:
                      - motivation
                      - communication
                    version: 1
                  - role_definition_id: role_project_manager
                    scenario_definition_id: scn_programmer_interview
                    role_type: PROJECT_MANAGER
                    display_name: Delivery and collaboration perspective
                    responsibilities: Explore delivery ownership and cross-functional collaboration.
                    style: Outcome oriented and collaborative.
                    focus_areas:
                      - delivery
                      - collaboration
                    version: 1
                  - role_definition_id: role_executive_interviewer
                    scenario_definition_id: scn_programmer_interview
                    role_type: EXECUTIVE_INTERVIEWER
                    display_name: Leadership and impact perspective
                    responsibilities: Explore leadership judgment and measurable impact for senior or management roles.
                    style: Concise, high level, and optional for advanced roles.
                    focus_areas:
                      - impact
                      - judgment
                    version: 1
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/preparation-profiles:
    post:
      tags:
        - Preparation
      summary: Create or return the preparation profile for one intent
      description: |
        The authenticated actor is resolved from the Bearer Session and owns the
        created profile. The request does not accept a trusted `user_id`. A fixed
        actor may be supplied only by an explicit Mock or Test adapter. When
        supplied, `job_target_id` and `job_target_confirmation_version` bind
        the profile to one exact server-confirmed JobTarget version; the pair
        must be supplied together.
      operationId: createPreparationProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreparationProfileRequest'
            example:
              resume_ref: resume_demo_backend_v1
              job_description_ref: jd_demo_backend_v1
              background_summary: |-
                Backend engineer with three years of Go experience, responsible
                for an API reliability project and cross-team delivery.
      responses:
        '201':
          description: The preparation profile created for the current actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationProfile'
              example:
                preparation_profile_id: prep_demo_backend
                user_id: user_demo
                resume_ref: resume_demo_backend_v1
                job_description_ref: jd_demo_backend_v1
                background_summary: |
                  Backend engineer with three years of Go experience, responsible
                  for an API reliability project and cross-team delivery.
                version: 1
                updated_at: '2026-07-23T10:00:00Z'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/preparation-profiles/{preparation_profile_id}/snapshots:
    post:
      tags:
        - Preparation
      summary: Freeze a confirmed preparation profile
      operationId: createPreparationSnapshot
      parameters:
        - $ref: '#/components/parameters/PreparationProfileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreparationSnapshotRequest'
            example:
              source_version: 1
      responses:
        '201':
          description: Immutable preparation content for a future session snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationSnapshot'
              example:
                preparation_snapshot_id: psnap_demo_backend_v1
                source_profile_id: prep_demo_backend
                source_version: 1
                resume_snapshot: Go backend engineer; API reliability project.
                job_description_snapshot: Build reliable APIs and explain engineering trade-offs.
                background_snapshot: |
                  Backend engineer with three years of Go experience, responsible
                  for an API reliability project and cross-team delivery.
                created_at: '2026-07-23T10:01:00Z'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets:
    post:
      tags:
        - Preparation
      summary: Create a JobTarget draft
      description: |
        Creates actor-owned, versioned untrusted input. `job_description`
        requires inline job_description. `quick_start` requires job_title and
        omits job_description. This operation does not create a Snapshot, Plan,
        or Session.
      operationId: createJobTarget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobTargetRequest'
      responses:
        '201':
          description: Created draft or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}:
    get:
      tags:
        - Preparation
      summary: Restore a JobTarget stage
      description: |
        Returns only the authenticated actor's current server-authoritative
        input, analysis, and confirmation stage. Cross-account and discarded
        targets return 404.
      operationId: getJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
      responses:
        '200':
          description: Current JobTarget recovery projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    put:
      tags:
        - Preparation
      summary: Replace JobTarget input
      description: |
        Replaces the editable input at the expected version. A material change
        increments input_version and immediately makes prior analysis and
        confirmation inapplicable to the current projection.
      operationId: updateJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobTargetRequest'
      responses:
        '200':
          description: Updated draft or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/analyses:
    post:
      tags:
        - Preparation
      summary: Start or recover JobTarget parsing
      description: |
        Claims at most one live parser attempt for the expected input version.
        A live attempt returns 202; a completed candidate returns 200. Parser
        output remains unconfirmed and cannot itself become user fact.
      operationId: analyzeJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeJobTargetRequest'
      responses:
        '200':
          description: Parsed candidate or recovered terminal parse stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '202':
          description: Another worker holds the current live parse lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        '503':
          $ref: ../common/errors.yaml#/components/responses/DefaultError
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/confirmations:
    post:
      tags:
        - Preparation
      summary: Confirm an edited JobTarget candidate
      description: |
        Persists an explicit user-edited confirmation for the exact input and
        analysis versions. No Snapshot, Plan, or Session is created.
      operationId: confirmJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmJobTargetRequest'
      responses:
        '200':
          description: Confirmed JobTarget or original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/job-targets/{job_target_id}/discard:
    post:
      tags:
        - Preparation
      summary: Discard an unconfirmed JobTarget draft
      operationId: discardJobTarget
      parameters:
        - $ref: '#/components/parameters/JobTargetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardJobTargetRequest'
      responses:
        '200':
          description: Discarded target tombstone or original idempotent result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTarget'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    ScenarioDefinitionId:
      name: scenario_definition_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    PreparationProfileId:
      name: preparation_profile_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    JobTargetId:
      name: job_target_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    Version:
      type: integer
      minimum: 1
    ScenarioType:
      type: string
      enum:
        - INTERVIEW
    ScenarioDefinition:
      type: object
      additionalProperties: false
      required:
        - scenario_definition_id
        - scenario_type
        - name
        - version
        - status
      properties:
        scenario_definition_id:
          $ref: '#/components/schemas/ResourceId'
        scenario_type:
          $ref: '#/components/schemas/ScenarioType'
        name:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Version'
        status:
          type: string
          enum:
            - active
            - inactive
    ScenarioDefinitionList:
      type: object
      additionalProperties: false
      required:
        - scenarios
      properties:
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioDefinition'
    ScenarioConfig:
      oneOf:
        - $ref: '#/components/schemas/InterviewScenarioConfig'
      discriminator:
        propertyName: config_type
        mapping:
          INTERVIEW: '#/components/schemas/InterviewScenarioConfig'
    InterviewScenarioConfig:
      type: object
      additionalProperties: false
      required:
        - scenario_config_id
        - scenario_definition_id
        - config_type
        - version
        - job_title
        - job_description
        - focus_areas
      properties:
        scenario_config_id:
          $ref: '#/components/schemas/ResourceId'
        scenario_definition_id:
          $ref: '#/components/schemas/ResourceId'
        config_type:
          type: string
          const: INTERVIEW
        version:
          $ref: '#/components/schemas/Version'
        job_title:
          type: string
          minLength: 1
        job_description:
          type: string
          minLength: 1
        focus_areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RoleDefinition:
      type: object
      description: |
        A selectable interviewer perspective owned by Preparation. Its position
        in a returned list is presentation order, never a required stage.
      additionalProperties: false
      required:
        - role_definition_id
        - scenario_definition_id
        - role_type
        - display_name
        - responsibilities
        - style
        - focus_areas
        - version
      properties:
        role_definition_id:
          $ref: '#/components/schemas/ResourceId'
        scenario_definition_id:
          $ref: '#/components/schemas/ResourceId'
        role_type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable machine type; it does not encode workflow progression.
        display_name:
          type: string
          minLength: 1
        responsibilities:
          type: string
          minLength: 1
        style:
          type: string
          minLength: 1
        focus_areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        voice_config_ref:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Version'
    PracticeOptionDefinition:
      type: object
      description: |
        A stable practice choice for the current perspective. FULL_SIMULATION
        omits role_definition_id; FOCUS references exactly one role.
      additionalProperties: false
      required:
        - practice_option_id
        - scenario_definition_id
        - practice_option_type
        - display_name
        - version
      properties:
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
        scenario_definition_id:
          $ref: '#/components/schemas/ResourceId'
        role_definition_id:
          $ref: '#/components/schemas/ResourceId'
        practice_option_type:
          type: string
          enum:
            - FULL_SIMULATION
            - FOCUS
        display_name:
          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Version'
    ScenarioDetail:
      type: object
      additionalProperties: false
      required:
        - scenario_definition
        - scenario_config
        - practice_options
      properties:
        scenario_definition:
          $ref: '#/components/schemas/ScenarioDefinition'
        scenario_config:
          $ref: '#/components/schemas/ScenarioConfig'
        practice_options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PracticeOptionDefinition'
    RoleDefinitionList:
      type: object
      additionalProperties: false
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
    CreatePreparationProfileRequest:
      type: object
      additionalProperties: false
      required:
        - background_summary
      properties:
        resume_ref:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: '^[^\s\u0000](?:[^\u0000]*[^\s\u0000])?$'
        job_description_ref:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: '^[^\s\u0000](?:[^\u0000]*[^\s\u0000])?$'
        background_summary:
          type: string
          minLength: 1
          maxLength: 65536
          pattern: '^[^\s\u0000](?:[^\u0000]*[^\s\u0000])?$'
        job_target_id:
          $ref: '#/components/schemas/ResourceId'
        job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
      dependentRequired:
        job_target_id:
          - job_target_confirmation_version
        job_target_confirmation_version:
          - job_target_id
    PreparationProfile:
      type: object
      additionalProperties: false
      required:
        - preparation_profile_id
        - user_id
        - background_summary
        - version
        - updated_at
      properties:
        preparation_profile_id:
          $ref: '#/components/schemas/ResourceId'
        user_id:
          $ref: '#/components/schemas/ResourceId'
        resume_ref:
          type: string
          minLength: 1
        job_description_ref:
          type: string
          minLength: 1
        background_summary:
          type: string
          minLength: 1
        job_target_id:
          $ref: '#/components/schemas/ResourceId'
        job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
        version:
          $ref: '#/components/schemas/Version'
        updated_at:
          type: string
          format: date-time
      dependentRequired:
        job_target_id:
          - job_target_confirmation_version
        job_target_confirmation_version:
          - job_target_id
    CreatePreparationSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - source_version
      properties:
        source_version:
          $ref: '#/components/schemas/Version'
    PreparationSnapshot:
      type: object
      additionalProperties: false
      required:
        - preparation_snapshot_id
        - source_profile_id
        - source_version
        - background_snapshot
        - created_at
      properties:
        preparation_snapshot_id:
          $ref: '#/components/schemas/ResourceId'
        source_profile_id:
          $ref: '#/components/schemas/ResourceId'
        source_version:
          $ref: '#/components/schemas/Version'
        source_job_target_id:
          $ref: '#/components/schemas/ResourceId'
        source_job_target_confirmation_version:
          $ref: '#/components/schemas/Version'
        job_target_input_snapshot:
          $ref: '#/components/schemas/JobTargetInput'
        job_target_candidate_snapshot:
          $ref: '#/components/schemas/JobTargetCandidate'
        resume_snapshot:
          type: string
          minLength: 1
        job_description_snapshot:
          type: string
          minLength: 1
        background_snapshot:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
      dependentRequired:
        source_job_target_id:
          - source_job_target_confirmation_version
          - job_target_input_snapshot
          - job_target_candidate_snapshot
        source_job_target_confirmation_version:
          - source_job_target_id
          - job_target_input_snapshot
          - job_target_candidate_snapshot
        job_target_input_snapshot:
          - source_job_target_id
          - source_job_target_confirmation_version
          - job_target_candidate_snapshot
        job_target_candidate_snapshot:
          - source_job_target_id
          - source_job_target_confirmation_version
          - job_target_input_snapshot
    JobTargetSource:
      type: string
      enum:
        - job_description
        - quick_start
    JobTargetInput:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          $ref: '#/components/schemas/JobTargetSource'
        job_title:
          type: string
          minLength: 1
          maxLength: 512
        job_description:
          type: string
          minLength: 1
          maxLength: 65536
        company:
          type: string
          minLength: 1
          maxLength: 512
        seniority:
          type: string
          minLength: 1
          maxLength: 256
        candidate_background:
          type: string
          minLength: 1
          maxLength: 16384
        resume_ref:
