paths:
  /v1/scenes:
    get:
      tags:
        - Scene
      summary: List active Scene definitions
      description: |
        Returns active Scenes in stable menu order. Presentation order does
        not define a workflow or required progression.
      operationId: listScenes
      security: []
      responses:
        '200':
          description: Active Scene definitions in stable display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDefinitionList'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/scenes/{scene_id}:
    get:
      tags:
        - Scene
      summary: Get one active Scene definition
      operationId: getScene
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          description: The versioned Scene definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneDefinition'
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/scenes/{scene_id}/roles:
    get:
      tags:
        - Scene
      summary: List selectable roles for one Scene
      description: |
        Response order is presentation order and never implies a mandatory
        workflow stage.
      operationId: listRoleDefinitions
      security: []
      parameters:
        - $ref: '#/components/parameters/SceneId'
      responses:
        '200':
          description: Scene roles in stable display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDefinitionList'
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/scenes/ielts-speaking/question-bank:
    get:
      tags:
        - Scene
      summary: Get the published IELTS Speaking question bank
      description: |
        Returns the current published Part 1 sets and Part 2/Part 3 topic
        groups. Hidden or incomplete topic groups are never exposed.
      operationId: getIeltsSpeakingQuestionBank
      security: []
      responses:
        '200':
          description: Published IELTS Speaking sets in stable catalog order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IeltsQuestionBank'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    SceneId:
      name: scene_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    Version:
      type: integer
      minimum: 1
    SceneFamily:
      type: string
      enum:
        - INTERVIEW
        - EXAM
        - WORKPLACE
        - DAILY
    SceneModel:
      type: string
      enum:
        - PROJECT_EXPERIENCE_DEEP_DIVE
        - INTERVIEW_BASIC_DIALOGUE
        - IELTS_SPEAKING_PART_1
        - IELTS_SPEAKING_PART_2
        - IELTS_SPEAKING_PART_3
        - IELTS_SPEAKING_FULL_MOCK
        - EXAM_BASIC_DIALOGUE
        - PROGRESS_AND_RISK_UPDATE
        - WORKPLACE_BASIC_DIALOGUE
        - HOTEL_CHECKIN_AND_ISSUE_HANDLING
        - DAILY_BASIC_DIALOGUE
    SceneStatus:
      type: string
      enum:
        - active
        - inactive
    ScenePrompt:
      type: object
      additionalProperties: false
      required:
        - public_scene_brief
        - practice_goal
        - user_role
        - ai_role
        - persona_summary
        - focus_areas
        - turn_blueprints
        - suggested_duration_seconds
      properties:
        public_scene_brief:
          type: string
          minLength: 1
        practice_goal:
          type: string
          minLength: 1
        user_role:
          type: string
          minLength: 1
        ai_role:
          type: string
          minLength: 1
        persona_summary:
          type: string
          minLength: 1
        focus_areas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        turn_blueprints:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        suggested_duration_seconds:
          type: integer
          minimum: 1
    PracticeObjectiveDefinition:
      type: object
      additionalProperties: false
      required:
        - objective_id
        - description
      properties:
        objective_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,127}$'
        description:
          type: string
          minLength: 1
    RoleDefinition:
      type: object
      additionalProperties: false
      required:
        - role_definition_id
        - scene_id
        - role_type
        - display_name
        - responsibilities
        - style
        - practice_objectives
      properties:
        role_definition_id:
          $ref: '#/components/schemas/ResourceId'
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        role_type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        display_name:
          type: string
          minLength: 1
        responsibilities:
          type: string
          minLength: 1
        style:
          type: string
          minLength: 1
        practice_objectives:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PracticeObjectiveDefinition'
        voice_config_ref:
          type: string
          minLength: 1
    RoleDefinitionList:
      type: object
      additionalProperties: false
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
    PracticeOptionType:
      type: string
      enum:
        - FULL_SIMULATION
        - FOCUS
    PracticeOption:
      type: object
      additionalProperties: false
      required:
        - practice_option_id
        - scene_id
        - practice_option_type
        - display_name
      properties:
        practice_option_id:
          $ref: '#/components/schemas/ResourceId'
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        role_definition_id:
          $ref: '#/components/schemas/ResourceId'
        practice_option_type:
          $ref: '#/components/schemas/PracticeOptionType'
        display_name:
          type: string
          minLength: 1
    SceneDefinition:
      type: object
      additionalProperties: false
      required:
        - scene_id
        - scene_family
        - scene_model
        - name
        - scene_version
        - status
        - turn_policy_ref
        - session_policy_ref
        - evaluation_policy_ref
        - prompt
        - roles
        - practice_options
      properties:
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        scene_family:
          $ref: '#/components/schemas/SceneFamily'
        scene_model:
          $ref: '#/components/schemas/SceneModel'
        name:
          type: string
          minLength: 1
        scene_version:
          $ref: '#/components/schemas/Version'
        status:
          $ref: '#/components/schemas/SceneStatus'
        turn_policy_ref:
          $ref: '#/components/schemas/ResourceId'
        session_policy_ref:
          $ref: '#/components/schemas/ResourceId'
        evaluation_policy_ref:
          $ref: '#/components/schemas/ResourceId'
        prompt:
          $ref: '#/components/schemas/ScenePrompt'
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleDefinition'
        practice_options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PracticeOption'
    SceneDefinitionList:
      type: object
      additionalProperties: false
      required:
        - scenes
      properties:
        scenes:
          type: array
          items:
            $ref: '#/components/schemas/SceneDefinition'
    IeltsQuestionBank:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - bank_id
        - season
        - source_cutoff
        - part1_sets
        - part1_topics
        - topic_groups
      properties:
        schema_version:
          type: integer
          const: 2
        bank_id:
          $ref: '#/components/schemas/ResourceId'
        season:
          type: string
          minLength: 1
        source_cutoff:
          type: string
          format: date-time
        part1_sets:
          type: array
          minItems: 38
          maxItems: 38
          items:
            $ref: '#/components/schemas/IeltsPart1Set'
        part1_topics:
          type: array
          minItems: 38
          maxItems: 38
          items:
            $ref: '#/components/schemas/IeltsPart1PracticeTopic'
        topic_groups:
          type: array
          minItems: 56
          maxItems: 56
          items:
            $ref: '#/components/schemas/IeltsTopicGroup'
    IeltsPart1Set:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - topics
        - question_count
        - published
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        title:
          type: string
          minLength: 1
        topics:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/IeltsPart1Topic'
        question_count:
          type: integer
          const: 8
        published:
          type: boolean
          const: true
    IeltsPart1Topic:
      type: object
      additionalProperties: false
      required:
        - title
        - release
        - questions
      properties:
        title:
          type: string
          minLength: 1
        release:
          type: string
          enum:
            - new
            - carry_over
            - evergreen
        questions:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
    IeltsPart1PracticeTopic:
      type: object
      additionalProperties: false
      required:
        - id
        - title_zh
        - title_en
        - release
        - category
        - questions
        - published
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        title_zh:
          type: string
          minLength: 1
        title_en:
          type: string
          minLength: 1
        release:
          type: string
          enum:
            - new
            - carry_over
            - evergreen
        category:
          $ref: '#/components/schemas/IeltsTopicCategory'
        questions:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
        published:
          type: boolean
          const: true
    IeltsTopicGroup:
      type: object
      additionalProperties: false
      required:
        - id
        - title_zh
        - release
        - region
        - category
        - part2
        - part3_questions
        - published
        - supplemented_question_count
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        title_zh:
          type: string
          minLength: 1
        release:
          type: string
          enum:
            - new
            - carry_over
        region:
          type: string
          const: mainland
        category:
          $ref: '#/components/schemas/IeltsTopicCategory'
        part2:
          $ref: '#/components/schemas/IeltsPart2CueCard'
        part3_questions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
        published:
          type: boolean
          const: true
        supplemented_question_count:
          type: integer
          minimum: 0
          maximum: 5
    IeltsPart2CueCard:
      type: object
      additionalProperties: false
      required:
        - prompt
        - points
      properties:
        prompt:
          type: string
          minLength: 1
        points:
          type: array
          minItems: 3
          items:
            type: string
            minLength: 1
    IeltsTopicCategory:
      type: string
      enum:
        - person
        - place
        - thing
        - event
