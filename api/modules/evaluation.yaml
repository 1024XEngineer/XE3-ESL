paths:
  /v1/evaluations:
    post:
      tags:
        - Evaluation
      summary: Create or return one logical Evaluation
      description: |
        Accepts trusted Practice and EvidenceSnapshot references for one Scene,
        Core 4D, or dual-channel evaluation. The authenticated Actor is derived
        by the server. Callers cannot submit an owner, tenant, revision number,
        or server idempotency key.

        The server derives root and per-channel idempotency keys from the
        canonical request. `client_request_id` is trace-only and has no
        authority over deduplication.
      operationId: createEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
            examples:
              dualChannel:
                value:
                  practice_session_id: session_demo_001
                  input_snapshot_id: snapshot_demo_001
                  input_revision: 1
                  scope: SESSION
                  scene_type: INTERVIEW
                  channels:
                    - SCENE
                    - CORE_4D
                  scene_strategy_ref: interview/project-deep-dive/1.0.0
                  core_4d_strategy_ref: speaking-core4d/1.0.0
                  pipeline_version: evaluation-pipeline/1.0.0
                  client_request_id: trace_demo_001
      responses:
        '200':
          description: |
            An idempotent replay returned the same logical Evaluation and its
            honest current non-QUEUED revision state. No work was requeued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReplay'
              example:
                evaluation_id: 7b000001-0000-4000-8000-000000000001
                evaluation_revision_id: a1000001-0000-4000-8000-000000000001
                revision: 1
                evaluation_status: READY
                status_url: /v1/evaluations/7b000001-0000-4000-8000-000000000001
        '202':
          description: The logical Evaluation exists and is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationAccepted'
              example:
                evaluation_id: 7b000001-0000-4000-8000-000000000001
                evaluation_revision_id: a1000001-0000-4000-8000-000000000001
                revision: 1
                evaluation_status: QUEUED
                status_url: /v1/evaluations/7b000001-0000-4000-8000-000000000001
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: '#/components/responses/EvaluationConflict'
        '422':
          $ref: '#/components/responses/EvaluationPolicyRejected'
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/evaluations/{evaluation_id}:
    get:
      tags:
        - Evaluation
      summary: Get the current publishable Evaluation revision
      description: |
        Returns the current publishable immutable revision for one logical
        Evaluation. Audit and governance readers use a future revision-specific
        contract; callers must not treat `evaluation_id` as a physical result
        identifier.
      operationId: getEvaluation
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Current Actor-owned Evaluation state and frozen results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
              example:
                evaluation_id: 7b000001-0000-4000-8000-000000000001
                evaluation_revision_id: a1000001-0000-4000-8000-000000000001
                revision: 1
                practice_session_id: session_demo_001
                input_snapshot_id: snapshot_demo_001
                input_revision: 1
                scope: SESSION
                scene_type: INTERVIEW
                channels:
                  - SCENE
                  - CORE_4D
                scene_strategy_ref: interview/project-deep-dive/1.0.0
                core_4d_strategy_ref: speaking-core4d/1.0.0
                pipeline_version: evaluation-pipeline/1.0.0
                schema_version: evaluation-schema/1.0.0
                evaluation_status: RUNNING
                module_statuses:
                  scene: RUNNING
                  core_4d: PENDING
                is_final: false
                created_at: '2026-07-28T12:00:00Z'
                updated_at: '2026-07-28T12:00:01Z'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/evaluations/{evaluation_id}/re-evaluate:
    post:
      tags:
        - Evaluation
      summary: Create an immutable replacement Evaluation revision
      description: |
        Creates a new revision for the same logical Evaluation. The server
        assigns the next revision and `supersedes_revision_id`; callers cannot
        overwrite or select a revision number.
      operationId: reevaluateEvaluation
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReevaluateEvaluationRequest'
            example:
              channels:
                - SCENE
                - CORE_4D
              scene_strategy_ref: interview/project-deep-dive/1.1.0
              core_4d_strategy_ref: speaking-core4d/1.0.0
              pipeline_version: evaluation-pipeline/1.1.0
              client_request_id: trace_demo_reevaluate_001
      responses:
        '200':
          description: |
            An idempotent replay returned the same logical Evaluation and its
            honest current non-QUEUED revision state. No revision or work was
            created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReplay'
              example:
                evaluation_id: 7b000001-0000-4000-8000-000000000001
                evaluation_revision_id: a1000002-0000-4000-8000-000000000002
                revision: 2
                supersedes_revision_id: a1000001-0000-4000-8000-000000000001
                evaluation_status: READY
                status_url: /v1/evaluations/7b000001-0000-4000-8000-000000000001
        '202':
          description: A replacement immutable revision has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationAccepted'
              example:
                evaluation_id: 7b000001-0000-4000-8000-000000000001
                evaluation_revision_id: a1000002-0000-4000-8000-000000000002
                revision: 2
                supersedes_revision_id: a1000001-0000-4000-8000-000000000001
                evaluation_status: QUEUED
                status_url: /v1/evaluations/7b000001-0000-4000-8000-000000000001
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        '409':
          $ref: '#/components/responses/EvaluationConflict'
        '422':
          $ref: '#/components/responses/EvaluationPolicyRejected'
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/interview-report:
    get:
      tags:
        - Evaluation
      summary: Get the current Interview Shadow report
      description: |
        Returns the current Actor-owned SESSION + INTERVIEW + SCENE Shadow
        Evaluation revision projected as a private, qualitative report. A
        resource owned by another Actor is indistinguishable from a missing
        resource. This read never freezes evidence, creates or re-evaluates an
        Evaluation, or invokes a provider.

        The response is private and must not be persisted by intermediaries.
        Servers must not log report findings, confirmed transcripts, resume
        context, or evidence excerpts.
      operationId: getInterviewReport
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
      responses:
        '200':
          description: |
            Current report state. QUEUED and RUNNING are pollable, READY
            contains a qualitative report, and FAILED contains only a stable
            technical failure.
          headers:
            Cache-Control:
              required: true
              description: Prevents shared or private storage of the report.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReportEnvelope'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/ielts-speaking-report:
    get:
      tags:
        - Evaluation
      summary: Get the current IELTS Speaking full-mock Shadow report
      description: |
        Returns the current Actor-owned SESSION + IELTS_SPEAKING + SCENE
        Evaluation revision produced by ielts-speaking-full-mock-shadow/v1.
        A resource owned by another Actor is indistinguishable from a missing
        resource. This read never freezes evidence, creates or re-evaluates an
        Evaluation, or invokes a provider.

        The response is private and must not be persisted by intermediaries.
        Servers must not log report findings, confirmed transcripts, Cue Card
        notes, evidence excerpts, audio locators, prompts, or provider output.
      operationId: getIeltsSpeakingReport
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
      responses:
        '200':
          description: |
            Current report state. QUEUED and RUNNING are pollable, READY
            contains an honest partial practice report, and FAILED contains
            only a stable technical failure.
          headers:
            Cache-Control:
              required: true
              description: Prevents shared or private storage of the report.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IeltsSpeakingReportEnvelope'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/report:
    get:
      tags:
        - Evaluation
      summary: Get the canonical IELTS Session report state
      description: |
        Returns one Actor-owned completed IELTS Practice Session's canonical
        report envelope. The read includes the durable completion handoff, so
        QUEUED may precede creation of the Evaluation ledger. FULL_MOCK resolves
        only the IELTS Speaking Shadow strategy; PART_1, PART_2, and PART_3
        resolve only the General Scene strategy. Cross-Actor resources are
        indistinguishable from missing resources.

        `available_sections` is ordered metadata copied from the frozen IELTS
        assignment. PART_2 remains one combined Part 2 + Part 3 Session; this
        endpoint does not synthesize per-section scores. READY points to the
        canonical FormalReport through `report_ref`.

        This GET is read-only and private. It never freezes evidence, queues
        scoring, invokes a provider, or logs report content.
      operationId: getPracticeSessionReport
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
      responses:
        '200':
          description: Pollable canonical report state.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSessionReportEnvelope'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  responses:
    EvaluationNotFound:
      description: The logical Evaluation does not exist for the current Actor.
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
          example:
            error:
              code: evaluation_not_found
              message: Evaluation was not found.
              retryable: false
              correlation_id: corr_evaluation_not_found
    EvaluationConflict:
      description: The requested Evaluation revision or operation conflicts with current state.
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
          example:
            error:
              code: evaluation_version_conflict
              message: Evaluation state changed before the operation completed.
              retryable: false
              correlation_id: corr_evaluation_version_conflict
    EvaluationPolicyRejected:
      description: The requested strategy or policy is unavailable or incompatible.
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
          example:
            error:
              code: evaluation_strategy_not_available
              message: The requested Evaluation strategy is not available.
              retryable: false
              correlation_id: corr_evaluation_strategy_not_available
  parameters:
    EvaluationId:
      name: evaluation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EvaluationUUID'
    PracticeSessionId:
      name: practice_session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StableIdentifier'
  schemas:
    EvaluationUUID:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    StableIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
    VersionReference:
      type: string
      minLength: 3
      maxLength: 160
      pattern: '^[A-Za-z][A-Za-z0-9._:/-]*$'
    ConfigHash:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
    ArtifactDigest:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
    EvaluationChannel:
      type: string
      enum:
        - SCENE
        - CORE_4D
    EvaluationScope:
      type: string
      enum:
        - TURN
        - SESSION
    EvaluationSceneType:
      type: string
      enum:
        - IELTS_SPEAKING
        - INTERVIEW
        - OVERSEAS_DAILY_LIFE
        - OVERSEAS_WORKPLACE
    PracticeSessionReportEnvelope:
      type: object
      additionalProperties: false
      required:
        - practice_session_id
        - practice_mode
        - report_scope
        - available_sections
        - detail_schema
        - evaluation_status
        - status_url
      properties:
        practice_session_id:
          $ref: '#/components/schemas/StableIdentifier'
        practice_mode:
          type: string
          enum: [PART_1, PART_2, PART_3, FULL_MOCK]
        report_scope:
          type: string
          enum: [PART_1, PART_2_3, PART_3, FULL_MOCK]
        available_sections:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [PART_1, PART_2, PART_3]
        detail_schema:
          type: string
          enum:
            - ielts-speaking-practice-report/v1
            - general-scene-evaluation/v1
            - ielts-speaking-report/v1
        evaluation_status:
          type: string
          enum: [QUEUED, RUNNING, READY, FAILED]
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        status_url:
          type: string
          maxLength: 157
          pattern: '^/v1/practice-sessions/[A-Za-z0-9][A-Za-z0-9_-]*/report$'
        report_ref:
          $ref: '#/components/schemas/PracticeSessionReportRef'
        scoreability_status:
          $ref: '#/components/schemas/EvaluationReportScoreabilityStatus'
        summary:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^\S(?:[\s\S]*\S)?$'
        stable_failure:
          $ref: '#/components/schemas/PracticeSessionReportFailure'
      dependentRequired:
        evaluation_id: [evaluation_revision_id, revision]
        evaluation_revision_id: [evaluation_id, revision]
        revision: [evaluation_id, evaluation_revision_id]
      allOf:
        - if:
            properties:
              evaluation_status:
                const: RUNNING
            required: [evaluation_status]
          then:
            required: [evaluation_id, evaluation_revision_id, revision]
        - if:
            properties:
              evaluation_status:
                const: READY
            required: [evaluation_status]
          then:
            required:
              - evaluation_id
              - evaluation_revision_id
              - revision
              - report_ref
              - scoreability_status
              - summary
            not:
              required: [stable_failure]
        - if:
            properties:
              evaluation_status:
                const: FAILED
            required: [evaluation_status]
          then:
            required: [stable_failure]
            not:
              anyOf:
                - required: [report_ref]
                - required: [scoreability_status]
                - required: [summary]
        - if:
            properties:
              evaluation_status:
                enum: [QUEUED, RUNNING]
            required: [evaluation_status]
          then:
            not:
              anyOf:
                - required: [report_ref]
                - required: [scoreability_status]
                - required: [summary]
                - required: [stable_failure]
        - if:
            properties:
              practice_mode:
                const: FULL_MOCK
            required: [practice_mode]
          then:
            properties:
              detail_schema:
                const: ielts-speaking-report/v1
        - if:
            properties:
              practice_mode:
                enum: [PART_1, PART_2, PART_3]
              evaluation_status:
                const: READY
            required: [practice_mode, evaluation_status]
          then:
            properties:
              detail_schema:
                enum:
                  - ielts-speaking-practice-report/v1
                  - general-scene-evaluation/v1
        - if:
            properties:
              practice_mode:
                enum: [PART_1, PART_2, PART_3]
              evaluation_status:
                enum: [QUEUED, RUNNING, FAILED]
            required: [practice_mode, evaluation_status]
          then:
            properties:
              detail_schema:
                const: ielts-speaking-practice-report/v1
    PracticeSessionReportRef:
      type: object
      additionalProperties: false
      required: [report_id, href]
      properties:
        report_id:
          $ref: '#/components/schemas/EvaluationUUID'
        href:
          type: string
          maxLength: 64
          pattern: '^/v1/evaluation-reports/[0-9a-fA-F-]{36}$'
    PracticeSessionReportFailure:
      type: object
      additionalProperties: false
      required: [reason_code, retryable]
      properties:
        reason_code:
          type: string
          enum:
            - STRATEGY_NOT_AVAILABLE
            - POLICY_VIOLATION
            - EVIDENCE_REF_INVALID
            - VERSION_CONFLICT
            - INTERNAL_RETRYABLE
            - INTERNAL_NON_RETRYABLE
        retryable:
          type: boolean
      allOf:
        - if:
            properties:
              reason_code:
                const: INTERNAL_RETRYABLE
            required: [reason_code]
          then:
            properties:
              retryable:
                const: true
        - if:
            properties:
              reason_code:
                enum:
                  - STRATEGY_NOT_AVAILABLE
                  - POLICY_VIOLATION
                  - EVIDENCE_REF_INVALID
                  - VERSION_CONFLICT
                  - INTERNAL_NON_RETRYABLE
            required: [reason_code]
          then:
            properties:
              retryable:
                const: false
    EvaluationFormalReport:
      type: object
      additionalProperties: false
      description: |
        Canonical user-facing report projected from one READY Evaluation
        revision. Review may query and present this resource but never creates
        or stores a second scoring result.
      required:
        - report_id
        - evaluation_id
        - evaluation_revision_id
        - practice_session_id
        - revision
        - schema_version
        - scene_type
        - practice_experience
        - scene_category
        - practice_mode
        - scoreability_status
        - summary
        - dimensions
        - priority_actions
        - detail_schema
        - detail
        - created_at
      properties:
        report_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        practice_session_id:
          $ref: '#/components/schemas/StableIdentifier'
        revision:
          type: integer
          minimum: 1
        schema_version:
          type: string
          const: evaluation-report/v1
        scene_type:
          $ref: '#/components/schemas/EvaluationSceneType'
        practice_experience:
          $ref: ./scene.yaml#/components/schemas/PracticeExperience
        scene_category:
          $ref: ./scene.yaml#/components/schemas/SceneCategory
        practice_mode:
          $ref: ./scene.yaml#/components/schemas/PracticeMode
        scoreability_status:
          $ref: '#/components/schemas/EvaluationReportScoreabilityStatus'
        summary:
          type: string
          minLength: 1
          maxLength: 2048
        dimensions:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/EvaluationReportDimension'
        priority_actions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/EvaluationReportPriorityAction'
        detail_schema:
          $ref: '#/components/schemas/VersionReference'
        detail:
          type: object
          description: Scene-specific report payload selected by detail_schema.
        created_at:
          type: string
          format: date-time
    EvaluationReportScoreabilityStatus:
      type: string
      enum:
        - PROVISIONAL
        - INSUFFICIENT
    EvaluationReportScoreScale:
      type: string
      enum:
        - PERCENTAGE_100
        - IELTS_BAND
    EvaluationReportDimension:
      type: object
      additionalProperties: false
      required:
        - key
        - scale
        - coverage
        - confidence
        - reason_codes
        - evidence_ref_ids
        - strengths
        - improvements
        - recommended_examples
      properties:
        key:
          $ref: '#/components/schemas/VersionReference'
        score:
          type: number
          minimum: 0
          maximum: 100
        scale:
          $ref: '#/components/schemas/EvaluationReportScoreScale'
        coverage:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/VersionReference'
        evidence_ref_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        strengths:
          $ref: '#/components/schemas/EvaluationReportFindings'
        improvements:
          $ref: '#/components/schemas/EvaluationReportFindings'
        recommended_examples:
          $ref: '#/components/schemas/EvaluationReportFindings'
      allOf:
        - if:
            properties:
              scale:
                const: IELTS_BAND
            required:
              - scale
          then:
            properties:
              score:
                maximum: 9
    EvaluationReportFindings:
      type: array
      maxItems: 5
      items:
        $ref: '#/components/schemas/EvaluationReportFinding'
    EvaluationReportFinding:
      type: object
      additionalProperties: false
      required:
        - finding_id
        - message
        - evidence
      properties:
        finding_id:
          $ref: '#/components/schemas/VersionReference'
        message:
          type: string
          minLength: 1
          maxLength: 2048
        suggestion:
          type: string
          minLength: 1
          maxLength: 2048
        evidence:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/EvaluationReportEvidence'
    EvaluationReportEvidence:
      type: object
      additionalProperties: false
      required:
        - evidence_ref_id
        - turn_id
        - start_utf8_byte
        - end_utf8_byte
        - original_excerpt
      properties:
        evidence_ref_id:
          $ref: '#/components/schemas/StableIdentifier'
        turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        start_utf8_byte:
          type: integer
          minimum: 0
        end_utf8_byte:
          type: integer
          minimum: 1
        original_excerpt:
          type: string
          minLength: 1
          maxLength: 16384
    EvaluationReportPriorityAction:
      type: object
      additionalProperties: false
      required:
        - dimension_key
        - finding_id
      properties:
        dimension_key:
          $ref: '#/components/schemas/VersionReference'
        finding_id:
          $ref: '#/components/schemas/VersionReference'
    EvaluationStatus:
      type: string
      enum:
        - RECEIVED
        - VALIDATING
        - QUEUED
        - RUNNING
        - PARTIAL_READY
        - READY
        - FAILED
        - SUPERSEDED
    ScoreabilityStatus:
      type: string
      enum:
        - RELIABLE
        - PROVISIONAL
        - INSUFFICIENT
    GateStatus:
      type: string
      enum:
        - PASS
        - FEEDBACK_ONLY
        - BLOCKED
    ModuleStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - READY
        - FAILED
        - SKIPPED
    EvaluationReasonCode:
      type: string
      enum:
        - STRATEGY_NOT_AVAILABLE
        - AUDIO_UNUSABLE
        - SPEAKER_ATTRIBUTION_FAILED
        - INSUFFICIENT_EVIDENCE
        - ASR_LOW_CONFIDENCE
        - REQUIRED_DIMENSION_MISSING
        - SCORE_INCONSISTENT
        - EVIDENCE_REF_INVALID
        - VERSION_CONFLICT
        - DUPLICATE_REQUEST
        - POLICY_VIOLATION
        - INTERNAL_RETRYABLE
        - INTERNAL_NON_RETRYABLE
        - OPPORTUNITY_NOT_PROVIDED
    RoundingRule:
      type: string
      enum:
