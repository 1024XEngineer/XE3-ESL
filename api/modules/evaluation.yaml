paths:
  /v1/practice-sessions/{practice_session_id}/evaluation:
    get:
      tags: [Evaluation]
      summary: Get the evaluation for a practice session
      operationId: getPracticeSessionEvaluation
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
      responses:
        '200':
          description: The SESSION_REPORT evaluation for this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResource'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-turns/{turn_id}/evaluation:
    get:
      tags: [Evaluation]
      summary: Get the evaluation for a confirmed practice turn
      operationId: getPracticeTurnEvaluation
      parameters:
        - $ref: '#/components/parameters/TurnId'
      responses:
        '200':
          description: The PRACTICE_TURN_FEEDBACK evaluation for this turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResource'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/agent-messages/{message_id}/evaluation:
    get:
      tags: [Evaluation]
      summary: Get the evaluation for a committed agent message
      operationId: getAgentMessageEvaluation
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The AGENT_MESSAGE_FEEDBACK evaluation for this message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResource'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/evaluation-reports:
    get:
      tags: [Evaluation]
      summary: List completed practice-session reports
      description: Results are ordered by completion time and evaluation ID descending. The cursor is opaque.
      operationId: listEvaluationReports
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 2000
      responses:
        '200':
          description: A stable keyset page of actor-owned reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationReportPage'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/evaluation-reports/{report_id}:
    get:
      tags: [Evaluation]
      summary: Get one completed practice-session report
      operationId: getEvaluationReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: One actor-owned READY session report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFormalReport'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError

components:
  parameters:
    PracticeSessionId:
      name: practice_session_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    TurnId:
      name: turn_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    MessageId:
      name: message_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ReportId:
      name: report_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  schemas:
    UUID:
      type: string
      format: uuid
    EvaluationKind:
      type: string
      enum: [SESSION_REPORT, PRACTICE_TURN_FEEDBACK, AGENT_MESSAGE_FEEDBACK]
    EvaluationStatus:
      type: string
      enum: [QUEUED, RUNNING, READY, FAILED]
    EvaluationResource:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - kind
        - source_id
        - context_id
        - status
        - created_at
        - updated_at
        - feedback_items
      properties:
        evaluation_id: {$ref: '#/components/schemas/UUID'}
        kind: {$ref: '#/components/schemas/EvaluationKind'}
        source_id: {$ref: '#/components/schemas/UUID'}
        context_id: {$ref: '#/components/schemas/UUID'}
        status: {$ref: '#/components/schemas/EvaluationStatus'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        feedback_items:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/FeedbackItem'}
        result:
          oneOf:
            - $ref: '#/components/schemas/FormalReport'
            - $ref: '#/components/schemas/SpeechEvaluationResult'
        error: {$ref: '#/components/schemas/EvaluationFailure'}
      allOf:
        - if:
            properties: {status: {const: READY}}
            required: [status]
          then:
            required: [result]
            not: {required: [error]}
        - if:
            properties: {status: {const: FAILED}}
            required: [status]
          then:
            required: [error]
            not: {required: [result]}
        - if:
            properties:
              status: {enum: [QUEUED, RUNNING]}
            required: [status]
          then:
            not:
              anyOf:
                - {required: [result]}
                - {required: [error]}
    EvaluationFailure:
      type: object
      additionalProperties: false
      required: [code, retryable, message]
      properties:
        code: {$ref: '#/components/schemas/Identifier'}
        retryable: {type: boolean}
        message:
          type: string
          minLength: 1
          maxLength: 2048
    FeedbackItem:
      type: object
      additionalProperties: false
      required:
        - feedback_item_id
        - evaluation_id
        - position
        - category
        - evidence
        - recommendation
        - repractice_mode
        - created_at
      properties:
        feedback_item_id: {$ref: '#/components/schemas/UUID'}
        evaluation_id: {$ref: '#/components/schemas/UUID'}
        position: {type: integer, minimum: 1}
        category: {$ref: '#/components/schemas/Identifier'}
        severity: {$ref: '#/components/schemas/Identifier'}
        evidence: {$ref: '#/components/schemas/FeedbackEvidence'}
        recommendation:
          type: string
          minLength: 1
          maxLength: 4096
        correction:
          type: string
          maxLength: 4096
        repractice_mode:
          type: string
          enum: [NONE, SAME_QUESTION]
        created_at: {type: string, format: date-time}
    FeedbackEvidence:
      type: object
      additionalProperties: false
      required: [evidence_ref_id, start_utf8_byte, end_utf8_byte, original_excerpt]
      properties:
        evidence_ref_id: {$ref: '#/components/schemas/UUID'}
        start_utf8_byte: {type: integer, minimum: 0}
        end_utf8_byte: {type: integer, minimum: 1}
        original_excerpt:
          type: string
          minLength: 1
          maxLength: 16384
    AcousticAssessment:
      oneOf:
        - $ref: '#/components/schemas/AcousticAssessed'
        - $ref: '#/components/schemas/AcousticNotAssessed'
      discriminator:
        propertyName: status
        mapping:
          ASSESSED: '#/components/schemas/AcousticAssessed'
          NOT_ASSESSED: '#/components/schemas/AcousticNotAssessed'
    AcousticAssessed:
      type: object
      additionalProperties: false
      required: [status, pronunciation]
      properties:
        status: {type: string, const: ASSESSED}
        pronunciation: {type: number, minimum: 0, maximum: 100}
        fluency: {type: number, minimum: 0, maximum: 100}
        integrity: {type: number, minimum: 0, maximum: 100}
        speaking_speed_wpm: {type: number, minimum: 0}
    AcousticNotAssessed:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: {type: string, const: NOT_ASSESSED}
        reason: {$ref: '#/components/schemas/Identifier'}
    SpeechEvaluationResult:
      type: object
      additionalProperties: false
      required: [schema_version, scoreability_status, summary, reason_codes, acoustic]
      properties:
        schema_version: {type: string, const: speech-feedback/v1}
        scoreability_status:
          type: string
          enum: [PROVISIONAL, INSUFFICIENT]
        summary:
          type: string
          minLength: 1
          maxLength: 2048
        reason_codes:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        acoustic: {$ref: '#/components/schemas/AcousticAssessment'}
    FormalReport:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - scene_type
        - practice_experience
        - scene_category
        - practice_mode
        - scoreability_status
        - summary
        - questions
        - dimensions
        - priority_actions
      properties:
        schema_version: {type: string, const: evaluation-report/v2}
        scene_type:
          type: string
          enum: [IELTS_SPEAKING, INTERVIEW, OVERSEAS_DAILY_LIFE, OVERSEAS_WORKPLACE]
        practice_experience: {$ref: '#/components/schemas/Identifier'}
        scene_category: {$ref: '#/components/schemas/Identifier'}
        practice_mode: {$ref: '#/components/schemas/Identifier'}
        scoreability_status:
          type: string
          enum: [PROVISIONAL, INSUFFICIENT]
        summary:
          type: string
          minLength: 1
          maxLength: 2048
        questions:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/ReportQuestion'}
        dimensions:
          type: array
          minItems: 1
          maxItems: 8
          items: {$ref: '#/components/schemas/ReportDimension'}
        priority_actions:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/ReportPriorityAction'}
    ReportQuestion:
      type: object
      additionalProperties: false
      required: [question_id, position, text, answer]
      properties:
        question_id: {$ref: '#/components/schemas/UUID'}
        position: {type: integer, minimum: 1}
        parent_question_id: {$ref: '#/components/schemas/UUID'}
        text:
          type: string
          minLength: 1
          maxLength: 16384
        answer:
          oneOf:
            - {$ref: '#/components/schemas/ReportAnswer'}
            - {type: 'null'}
    ReportAnswer:
      type: object
      additionalProperties: false
      required: [turn_id, transcript]
      properties:
        turn_id: {$ref: '#/components/schemas/UUID'}
        transcript:
          type: string
          minLength: 1
          maxLength: 65536
    ReportDimension:
      type: object
      additionalProperties: false
      required:
        - key
        - score
        - scale
        - coverage
        - confidence
        - reason_codes
        - evidence_ref_ids
        - strengths
        - improvements
        - recommended_examples
      properties:
        key: {$ref: '#/components/schemas/Identifier'}
        score:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Null when the dimension was explicitly not assessed, including acoustic failure or disabled capability.
        scale:
          type: string
          enum: [PERCENTAGE_100, IELTS_BAND_9]
        coverage: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        reason_codes:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        evidence_ref_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {$ref: '#/components/schemas/UUID'}
        strengths: {$ref: '#/components/schemas/ReportFindings'}
        improvements: {$ref: '#/components/schemas/ReportFindings'}
        recommended_examples: {$ref: '#/components/schemas/ReportFindings'}
    ReportFindings:
      type: array
      maxItems: 5
      items: {$ref: '#/components/schemas/ReportFinding'}
    ReportFinding:
      type: object
      additionalProperties: false
      required: [finding_id, message, evidence]
      properties:
        finding_id:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 2048
        suggestion:
          type: string
          minLength: 1
          maxLength: 2048
        evidence:
          type: array
          maxItems: 8
          items: {$ref: '#/components/schemas/ReportEvidence'}
    ReportEvidence:
      type: object
      additionalProperties: false
      required: [evidence_ref_id, turn_id, start_utf8_byte, end_utf8_byte, original_excerpt]
      properties:
        evidence_ref_id: {$ref: '#/components/schemas/UUID'}
        turn_id: {$ref: '#/components/schemas/UUID'}
        start_utf8_byte: {type: integer, minimum: 0}
        end_utf8_byte: {type: integer, minimum: 1}
        original_excerpt:
          type: string
          minLength: 1
          maxLength: 16384
    ReportPriorityAction:
      type: object
      additionalProperties: false
      required: [dimension_key, finding_id]
      properties:
        dimension_key: {$ref: '#/components/schemas/Identifier'}
        finding_id:
          type: string
          minLength: 1
          maxLength: 128
    StoredFormalReport:
      type: object
      additionalProperties: false
      required: [report_id, evaluation_id, practice_session_id, report, created_at]
      properties:
        report_id: {$ref: '#/components/schemas/UUID'}
        evaluation_id: {$ref: '#/components/schemas/UUID'}
        practice_session_id: {$ref: '#/components/schemas/UUID'}
        report: {$ref: '#/components/schemas/FormalReport'}
        created_at: {type: string, format: date-time}
    EvaluationReportPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/StoredFormalReport'}
        next_cursor:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
