          then:
            required:
              - raw_score
              - display_score
            properties:
              evidence_refs:
                type: array
                minItems: 1
          else:
            required:
              - reason_codes
              - profile_update_eligible
            properties:
              reason_codes:
                type: array
                minItems: 1
              profile_update_eligible:
                type: boolean
                const: false
            not:
              anyOf:
                - required:
                    - raw_score
                - required:
                    - display_score
                - required:
                    - interval
    NamedWeight:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]*$'
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    EvidenceRef:
      type: object
      additionalProperties: false
      required:
        - evidence_ref_id
        - snapshot_id
        - turn_id
        - speaker
        - quality
        - lineage
      properties:
        evidence_ref_id:
          $ref: '#/components/schemas/StableIdentifier'
        snapshot_id:
