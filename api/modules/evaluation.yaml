        - if:
            properties:
              channels:
                type: array
                contains:
                  const: CORE_4D
            required:
              - channels
          then:
            required:
              - core_4d_strategy_ref
    ReevaluateEvaluationRequest:
      type: object
      additionalProperties: false
      required:
        - channels
        - pipeline_version
      properties:
        channels:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationChannel'
        scene_strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        core_4d_strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        pipeline_version:
          $ref: '#/components/schemas/VersionReference'
        client_request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
      allOf:
        - if:
            properties:
              channels:
                type: array
                contains:
                  const: SCENE
            required:
              - channels
          then:
            required:
              - scene_strategy_ref
        - if:
            properties:
              channels:
                type: array
                contains:
                  const: CORE_4D
            required:
              - channels
          then:
            required:
              - core_4d_strategy_ref
    EvaluationAccepted:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - evaluation_revision_id
        - revision
        - evaluation_status
        - status_url
      properties:
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        supersedes_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_status:
          type: string
          const: QUEUED
        status_url:
          type: string
          pattern: '^/v1/evaluations/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    EvaluationReplay:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - evaluation_revision_id
        - revision
        - evaluation_status
        - status_url
      properties:
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        supersedes_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_status:
          type: string
          enum:
            - RECEIVED
            - VALIDATING
            - RUNNING
            - PARTIAL_READY
            - READY
            - FAILED
            - SUPERSEDED
        status_url:
          type: string
          pattern: '^/v1/evaluations/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    InterviewReportEnvelope:
      type: object
      additionalProperties: false
      required:
        - practice_session_id
        - evaluation_id
        - evaluation_revision_id
        - revision
        - evaluation_status
        - is_final
        - status_url
      properties:
        practice_session_id:
          $ref: '#/components/schemas/StableIdentifier'
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        evaluation_status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - READY
            - FAILED
        is_final:
          type: boolean
          const: false
        status_url:
          type: string
          maxLength: 167
          pattern: '^/v1/practice-sessions/[A-Za-z0-9][A-Za-z0-9_-]*/interview-report$'
        report:
          $ref: '#/components/schemas/InterviewReport'
        stable_failure:
          $ref: '#/components/schemas/InterviewReportFailure'
      allOf:
        - if:
            properties:
              evaluation_status:
                const: READY
            required:
              - evaluation_status
          then:
            required:
              - report
            not:
              required:
                - stable_failure
        - if:
            properties:
              evaluation_status:
                const: FAILED
            required:
              - evaluation_status
          then:
            required:
              - stable_failure
            not:
              required:
                - report
        - if:
            properties:
              evaluation_status:
                enum:
                  - QUEUED
                  - RUNNING
            required:
              - evaluation_status
          then:
            not:
              anyOf:
                - required:
                    - report
                - required:
                    - stable_failure
    InterviewReport:
      type: object
      additionalProperties: false
      description: |
        Versioned Interview practice feedback projected from one frozen Shadow
        revision. Assessable dimensions include a 0-100 coaching score based
        only on confirmed transcript evidence. The report contains no hiring
        probability, readiness inference, pronunciation, pace, stress,
        phoneme, or other acoustic assessment.
      required:
        - schema_version
        - scoreability_status
        - gate_status
        - readiness_level
        - readiness_notice
        - dimensions
        - questions
        - priority_actions
      properties:
        schema_version:
          type: string
          const: interview-report/v1
        scoreability_status:
          $ref: '#/components/schemas/InterviewReportScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/InterviewReportGateStatus'
        readiness_level:
          type: string
          const: NOT_ASSESSED
        readiness_notice:
          type: string
          const: Practice feedback only; not a hiring decision or probability.
        dimensions:
          $ref: '#/components/schemas/InterviewReportDimensions'
        questions:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InterviewReportQuestion'
        priority_actions:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InterviewReportPriorityAction'
      allOf:
        - if:
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            properties:
              gate_status:
                const: FEEDBACK_ONLY
        - if:
            properties:
              scoreability_status:
                const: INSUFFICIENT
            required:
              - scoreability_status
          then:
            properties:
              gate_status:
                const: BLOCKED
    InterviewReportScoreabilityStatus:
      type: string
      enum:
        - PROVISIONAL
        - INSUFFICIENT
    InterviewReportGateStatus:
      type: string
      enum:
        - FEEDBACK_ONLY
        - BLOCKED
    InterviewReportReasonCode:
      type: string
      enum:
        - ASR_CONFIDENCE_UNAVAILABLE
        - INSUFFICIENT_EVIDENCE
        - OPPORTUNITY_NOT_PROVIDED
    InterviewReportDimensionId:
      type: string
      enum:
        - INTERVIEW_RELEVANCE
        - INTERVIEW_STRUCTURE
        - INTERVIEW_EVIDENCE
        - INTERVIEW_PROFESSIONAL
        - INTERVIEW_INTERACTION
    InterviewReportDimensions:
      type: array
      minItems: 5
      maxItems: 5
      prefixItems:
        - $ref: '#/components/schemas/InterviewReportRelevanceDimension'
        - $ref: '#/components/schemas/InterviewReportStructureDimension'
        - $ref: '#/components/schemas/InterviewReportEvidenceDimension'
        - $ref: '#/components/schemas/InterviewReportProfessionalDimension'
        - $ref: '#/components/schemas/InterviewReportInteractionDimension'
      items: false
    InterviewReportRelevanceDimension:
      allOf:
        - $ref: '#/components/schemas/InterviewReportDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_RELEVANCE
    InterviewReportStructureDimension:
      allOf:
        - $ref: '#/components/schemas/InterviewReportDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_STRUCTURE
    InterviewReportEvidenceDimension:
      allOf:
        - $ref: '#/components/schemas/InterviewReportDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_EVIDENCE
    InterviewReportProfessionalDimension:
      allOf:
        - $ref: '#/components/schemas/InterviewReportDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_PROFESSIONAL
    InterviewReportInteractionDimension:
      allOf:
        - $ref: '#/components/schemas/InterviewReportDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_INTERACTION
    InterviewReportDimension:
      type: object
      additionalProperties: false
      required:
        - dimension_id
        - scoreability_status
        - gate_status
        - coverage
        - confidence
        - reason_codes
        - evidence_ref_ids
        - strengths
        - improvements
        - recommended_expressions
      properties:
        dimension_id:
          $ref: '#/components/schemas/InterviewReportDimensionId'
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Transcript-evidence coaching score for this dimension.
        scoreability_status:
          $ref: '#/components/schemas/InterviewReportScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/InterviewReportGateStatus'
        coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Evidence opportunity coverage metadata, not a user score.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Evidence attribution confidence metadata, not a user score.
        reason_codes:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InterviewReportReasonCode'
        evidence_ref_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        strengths:
          $ref: '#/components/schemas/InterviewReportFindings'
        improvements:
          $ref: '#/components/schemas/InterviewReportFindings'
        recommended_expressions:
          $ref: '#/components/schemas/InterviewReportFindings'
      allOf:
        - if:
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            required:
              - score
            properties:
              gate_status:
                const: FEEDBACK_ONLY
              reason_codes:
                type: array
                items:
                  const: ASR_CONFIDENCE_UNAVAILABLE
              evidence_ref_ids:
                type: array
                minItems: 1
            anyOf:
              - properties:
                  strengths:
                    type: array
                    minItems: 1
              - properties:
                  improvements:
                    type: array
                    minItems: 1
        - if:
            properties:
              scoreability_status:
                const: INSUFFICIENT
            required:
              - scoreability_status
          then:
            not:
              required:
                - score
            properties:
              gate_status:
                const: BLOCKED
              reason_codes:
                type: array
                items:
                  enum:
                    - INSUFFICIENT_EVIDENCE
                    - OPPORTUNITY_NOT_PROVIDED
              evidence_ref_ids:
                type: array
                maxItems: 0
              strengths:
                type: array
                maxItems: 0
              improvements:
                type: array
                maxItems: 0
              recommended_expressions:
                type: array
                maxItems: 0
    InterviewReportFindings:
      type: array
      maxItems: 3
      items:
        $ref: '#/components/schemas/InterviewReportFinding'
    InterviewReportFinding:
      type: object
      additionalProperties: false
      required:
        - finding_id
        - message
        - evidence
      properties:
        finding_id:
          $ref: '#/components/schemas/StableIdentifier'
        message:
          $ref: '#/components/schemas/InterviewReportText'
        suggestion:
          $ref: '#/components/schemas/InterviewReportText'
        evidence:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/InterviewReportEvidence'
    InterviewReportEvidence:
      type: object
      additionalProperties: false
      required:
        - evidence_ref_id
        - turn_id
        - start_utf8_byte
        - end_utf8_byte
        - original_excerpt
      properties:
        evidence_ref_id:
          $ref: '#/components/schemas/StableIdentifier'
        turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        start_utf8_byte:
          type: integer
          minimum: 0
        end_utf8_byte:
          type: integer
          minimum: 1
        original_excerpt:
          type: string
          minLength: 1
          maxLength: 16384
    InterviewReportQuestion:
      type: object
      additionalProperties: false
      required:
        - question_id
        - question_type
        - opportunity_status
        - assessment_status
        - question_text
        - evidence_ref_ids
        - dimension_findings
      properties:
        question_id:
          $ref: '#/components/schemas/StableIdentifier'
        question_type:
          type: string
          enum:
            - PRIMARY
            - FOLLOW_UP
        parent_question_id:
          $ref: '#/components/schemas/StableIdentifier'
        opportunity_status:
          type: string
          enum:
            - PROVIDED
            - NOT_PROVIDED
        assessment_status:
          type: string
          enum:
            - ASSESSED
            - NOT_ASSESSED
        question_text:
          $ref: '#/components/schemas/InterviewReportSourceText'
        confirmed_transcript:
          $ref: '#/components/schemas/InterviewReportSourceText'
        response_turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        evidence_ref_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        dimension_findings:
          $ref: '#/components/schemas/InterviewReportQuestionDimensions'
      allOf:
        - if:
            properties:
              question_type:
                const: PRIMARY
            required:
              - question_type
          then:
            not:
              required:
                - parent_question_id
        - if:
            properties:
              question_type:
                const: FOLLOW_UP
            required:
              - question_type
          then:
            required:
              - parent_question_id
        - if:
            properties:
              opportunity_status:
                const: PROVIDED
            required:
              - opportunity_status
          then:
            required:
              - confirmed_transcript
              - response_turn_id
            properties:
              assessment_status:
                const: ASSESSED
              evidence_ref_ids:
                type: array
                minItems: 1
        - if:
            properties:
              opportunity_status:
                const: NOT_PROVIDED
            required:
              - opportunity_status
          then:
            properties:
              assessment_status:
                const: NOT_ASSESSED
              evidence_ref_ids:
                type: array
                maxItems: 0
            not:
              anyOf:
                - required:
                    - confirmed_transcript
                - required:
                    - response_turn_id
    InterviewReportQuestionDimensions:
      type: array
      minItems: 5
      maxItems: 5
      prefixItems:
        - $ref: '#/components/schemas/InterviewReportQuestionRelevance'
        - $ref: '#/components/schemas/InterviewReportQuestionStructure'
        - $ref: '#/components/schemas/InterviewReportQuestionEvidence'
        - $ref: '#/components/schemas/InterviewReportQuestionProfessional'
        - $ref: '#/components/schemas/InterviewReportQuestionInteraction'
      items: false
    InterviewReportQuestionRelevance:
      allOf:
        - $ref: '#/components/schemas/InterviewReportQuestionDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_RELEVANCE
    InterviewReportQuestionStructure:
      allOf:
        - $ref: '#/components/schemas/InterviewReportQuestionDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_STRUCTURE
    InterviewReportQuestionEvidence:
      allOf:
        - $ref: '#/components/schemas/InterviewReportQuestionDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_EVIDENCE
    InterviewReportQuestionProfessional:
      allOf:
        - $ref: '#/components/schemas/InterviewReportQuestionDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_PROFESSIONAL
    InterviewReportQuestionInteraction:
      allOf:
        - $ref: '#/components/schemas/InterviewReportQuestionDimension'
        - type: object
          required:
            - dimension_id
          properties:
            dimension_id:
              const: INTERVIEW_INTERACTION
    InterviewReportQuestionDimension:
      type: object
      additionalProperties: false
      required:
        - dimension_id
        - strength_finding_ids
        - improvement_finding_ids
        - recommended_expression_finding_ids
      properties:
        dimension_id:
          $ref: '#/components/schemas/InterviewReportDimensionId'
        strength_finding_ids:
          $ref: '#/components/schemas/InterviewReportFindingIds'
        improvement_finding_ids:
          $ref: '#/components/schemas/InterviewReportFindingIds'
        recommended_expression_finding_ids:
          $ref: '#/components/schemas/InterviewReportFindingIds'
    InterviewReportFindingIds:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/StableIdentifier'
    InterviewReportPriorityAction:
      type: object
      additionalProperties: false
      required:
        - dimension_id
        - finding_id
      properties:
        dimension_id:
          $ref: '#/components/schemas/InterviewReportDimensionId'
        finding_id:
          $ref: '#/components/schemas/StableIdentifier'
    InterviewReportFailure:
      type: object
      additionalProperties: false
      required:
        - reason_code
        - retryable
      properties:
        reason_code:
          type: string
          enum:
            - POLICY_VIOLATION
            - EVIDENCE_REF_INVALID
            - VERSION_CONFLICT
            - INTERNAL_RETRYABLE
            - INTERNAL_NON_RETRYABLE
        retryable:
          type: boolean
      allOf:
        - if:
            properties:
              reason_code:
                const: INTERNAL_RETRYABLE
            required:
              - reason_code
          then:
            properties:
              retryable:
                const: true
        - if:
            properties:
              reason_code:
                enum:
                  - POLICY_VIOLATION
                  - EVIDENCE_REF_INVALID
                  - VERSION_CONFLICT
                  - INTERNAL_NON_RETRYABLE
            required:
              - reason_code
          then:
            properties:
              retryable:
                const: false
    InterviewReportText:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^\S(?:[\s\S]*\S)?$'
      description: |
        Server-controlled feedback template text validated by the frozen
        Interview Shadow revision; never unvalidated provider prose.
    InterviewReportSourceText:
      type: string
      minLength: 1
      maxLength: 16384
      pattern: '^\S(?:[\s\S]*\S)?$'
    IeltsSpeakingReportEnvelope:
      type: object
      additionalProperties: false
      required:
        - practice_session_id
        - evaluation_id
        - evaluation_revision_id
        - revision
        - evaluation_status
        - is_final
        - status_url
      properties:
        practice_session_id:
          $ref: '#/components/schemas/StableIdentifier'
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        evaluation_status:
          $ref: '#/components/schemas/IeltsSpeakingReportEvaluationStatus'
        is_final:
          type: boolean
          const: false
        status_url:
          type: string
          maxLength: 173
          pattern: '^/v1/practice-sessions/[A-Za-z0-9][A-Za-z0-9_-]*/ielts-speaking-report$'
        report:
          $ref: '#/components/schemas/IeltsSpeakingReport'
        stable_failure:
          $ref: '#/components/schemas/IeltsSpeakingReportFailure'
      allOf:
        - if:
            type: object
            properties:
              evaluation_status:
                const: READY
            required:
              - evaluation_status
          then:
            type: object
            required:
              - report
            not:
              required:
                - stable_failure
        - if:
            type: object
            properties:
              evaluation_status:
                const: FAILED
            required:
              - evaluation_status
          then:
            type: object
            required:
              - stable_failure
            not:
              required:
                - report
        - if:
            type: object
            properties:
              evaluation_status:
                enum:
                  - QUEUED
                  - RUNNING
            required:
              - evaluation_status
          then:
            type: object
            not:
              anyOf:
                - required:
                    - report
                - required:
                    - stable_failure
    IeltsSpeakingReportEvaluationStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - READY
        - FAILED
    IeltsSpeakingReport:
      type: object
      additionalProperties: false
      description: |
        Partial IELTS Speaking practice feedback projected from one frozen
        Shadow revision. LR and GRA may contain provisional integer rubric
        Bands. FC never contains a complete Band, PR is blocked, Speaking
        Overall is unavailable, and no Part or question contains a score.
      required:
        - schema_version
        - disclaimer_code
        - disclaimer
        - scoreability_status
        - gate_status
        - test_summary
        - criteria
        - speaking_overall
        - part_reviews
        - questions
        - target_plan
        - priority_actions
      properties:
        schema_version:
          type: string
          const: ielts-speaking-report/v1
        disclaimer_code:
          type: string
          const: AI_PRACTICE_ESTIMATE_NOT_OFFICIAL_IELTS
        disclaimer:
          type: string
          const: AI 练习估分，非 IELTS 官方成绩。
        scoreability_status:
          $ref: '#/components/schemas/IeltsSpeakingReportScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/IeltsSpeakingReportGateStatus'
        test_summary:
          $ref: '#/components/schemas/IeltsSpeakingReportTestSummary'
        criteria:
          $ref: '#/components/schemas/IeltsSpeakingReportCriteria'
        speaking_overall:
          oneOf:
            - $ref: '#/components/schemas/IeltsSpeakingOverallAvailable'
            - $ref: '#/components/schemas/IeltsSpeakingOverallUnavailable'
        part_reviews:
          $ref: '#/components/schemas/IeltsSpeakingPartReviews'
        questions:
          type: array
          minItems: 3
          maxItems: 64
          items:
            $ref: '#/components/schemas/IeltsSpeakingQuestionReview'
        target_plan:
          $ref: '#/components/schemas/IeltsSpeakingTargetPlan'
        priority_actions:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IeltsSpeakingPriorityAction'
      allOf:
        - if:
            type: object
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            type: object
            properties:
              gate_status:
                const: FEEDBACK_ONLY
              criteria:
                type: array
                contains:
                  type: object
                  properties:
                    scoreability_status:
                      const: PROVISIONAL
                  required:
                    - scoreability_status
                minContains: 1
        - if:
            type: object
            properties:
              scoreability_status:
                const: INSUFFICIENT
            required:
              - scoreability_status
          then:
            type: object
            properties:
              gate_status:
                const: BLOCKED
              criteria:
                type: array
                not:
                  contains:
                    type: object
                    properties:
                      scoreability_status:
                        const: PROVISIONAL
                    required:
                      - scoreability_status
              priority_actions:
                type: array
                maxItems: 0
    IeltsSpeakingReportScoreabilityStatus:
      type: string
      enum:
        - PROVISIONAL
        - INSUFFICIENT
    IeltsSpeakingReportGateStatus:
      type: string
      enum:
        - FEEDBACK_ONLY
        - BLOCKED
    IeltsSpeakingReportTestSummary:
      type: object
      additionalProperties: false
      required:
        - part_1_topic
        - part_2_topic
        - part_3_topic
        - question_count
        - answered_count
        - recording_duration_ms
      properties:
        part_1_topic:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        part_2_topic:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        part_3_topic:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        question_count:
          type: integer
          minimum: 3
          maximum: 64
        answered_count:
          type: integer
          minimum: 0
          maximum: 64
        recording_duration_ms:
          type: integer
          format: int64
          minimum: 0
    IeltsSpeakingReportReasonCode:
      type: string
      enum:
        - ASR_CONFIDENCE_UNAVAILABLE
        - FLUENCY_TIMING_UNAVAILABLE
        - PRONUNCIATION_ARTIFACT_UNAVAILABLE
        - INSUFFICIENT_EVIDENCE
        - OPPORTUNITY_NOT_PROVIDED
        - PRACTICE_ESTIMATE_UNCALIBRATED
    IeltsSpeakingCriterionId:
      type: string
      enum:
        - IELTS_FC
        - IELTS_LR
        - IELTS_GRA
        - IELTS_PR
    IeltsSpeakingReportCriteria:
      type: array
      minItems: 4
      maxItems: 4
      prefixItems:
        - $ref: '#/components/schemas/IeltsSpeakingFluencyCoherenceCriterion'
        - $ref: '#/components/schemas/IeltsSpeakingLexicalResourceCriterion'
        - $ref: '#/components/schemas/IeltsSpeakingGrammarCriterion'
        - $ref: '#/components/schemas/IeltsSpeakingPronunciationCriterion'
      items: false
    IeltsSpeakingFluencyCoherenceCriterion:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingReportCriterion'
        - type: object
          required:
            - criterion_id
          properties:
            criterion_id:
              const: IELTS_FC
        - if:
            type: object
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            type: object
            oneOf:
              - required:
                  - estimated_band
                  - band_descriptor
                properties:
                  reason_codes:
                    type: array
                    contains:
                      const: PRACTICE_ESTIMATE_UNCALIBRATED
              - not:
                  anyOf:
                    - required:
                        - estimated_band
                    - required:
                        - band_descriptor
                properties:
                  reason_codes:
                    type: array
                    contains:
                      const: FLUENCY_TIMING_UNAVAILABLE
    IeltsSpeakingLexicalResourceCriterion:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingReportCriterion'
        - type: object
          required:
            - criterion_id
          properties:
            criterion_id:
              const: IELTS_LR
        - if:
            type: object
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            type: object
            required:
              - estimated_band
              - band_descriptor
            properties:
              reason_codes:
                type: array
                contains:
                  const: ASR_CONFIDENCE_UNAVAILABLE
    IeltsSpeakingGrammarCriterion:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingReportCriterion'
        - type: object
          required:
            - criterion_id
          properties:
            criterion_id:
              const: IELTS_GRA
        - if:
            type: object
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            type: object
            required:
              - estimated_band
              - band_descriptor
            properties:
              reason_codes:
                type: array
                contains:
                  const: ASR_CONFIDENCE_UNAVAILABLE
    IeltsSpeakingPronunciationCriterion:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingReportCriterion'
        - type: object
          required:
            - criterion_id
          properties:
            criterion_id:
              const: IELTS_PR
          oneOf:
            - required:
                - estimated_band
                - band_descriptor
              properties:
                scoreability_status:
                  const: PROVISIONAL
                gate_status:
                  const: FEEDBACK_ONLY
                reason_codes:
                  type: array
                  contains:
                    const: PRACTICE_ESTIMATE_UNCALIBRATED
            - properties:
                scoreability_status:
                  const: INSUFFICIENT
                gate_status:
                  const: BLOCKED
                reason_codes:
                  type: array
                  minItems: 1
                  maxItems: 1
                  prefixItems:
                    - const: PRONUNCIATION_ARTIFACT_UNAVAILABLE
                  items: false
              not:
                anyOf:
                  - required:
                      - estimated_band
                  - required:
                      - band_descriptor
    IeltsSpeakingReportCriterion:
      type: object
      additionalProperties: false
      required:
        - criterion_id
        - scoreability_status
        - gate_status
        - explanation
        - coverage
        - confidence
        - reason_codes
        - evidence_ref_ids
        - strengths
        - improvements
        - upgrade_examples
      properties:
        criterion_id:
          $ref: '#/components/schemas/IeltsSpeakingCriterionId'
        scoreability_status:
          $ref: '#/components/schemas/IeltsSpeakingReportScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/IeltsSpeakingReportGateStatus'
        estimated_band:
          type: integer
          minimum: 1
          maximum: 9
          description: |
            Provisional transcript-rubric estimate; never a final or official
            IELTS result.
        band_descriptor:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        explanation:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Evidence opportunity coverage metadata, not a score.
        confidence:
          type: number
          const: 0
          description: |
            No calibrated ASR confidence source exists in this revision, so
            the server must publish zero rather than inventing confidence.
        reason_codes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IeltsSpeakingReportReasonCode'
        evidence_ref_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        strengths:
          $ref: '#/components/schemas/IeltsSpeakingReportFindings'
        improvements:
          $ref: '#/components/schemas/IeltsSpeakingReportFindings'
        upgrade_examples:
          $ref: '#/components/schemas/IeltsSpeakingReportFindings'
      allOf:
        - if:
            type: object
            properties:
              scoreability_status:
                const: PROVISIONAL
            required:
              - scoreability_status
          then:
            type: object
            properties:
              gate_status:
                const: FEEDBACK_ONLY
              evidence_ref_ids:
                type: array
                minItems: 1
            anyOf:
              - properties:
                  strengths:
                    type: array
                    minItems: 1
              - properties:
                  improvements:
                    type: array
                    minItems: 1
        - if:
            type: object
            properties:
              scoreability_status:
                const: INSUFFICIENT
            required:
              - scoreability_status
          then:
            type: object
            properties:
              gate_status:
                const: BLOCKED
              reason_codes:
                type: array
                items:
                  enum:
                    - INSUFFICIENT_EVIDENCE
                    - OPPORTUNITY_NOT_PROVIDED
                    - PRONUNCIATION_ARTIFACT_UNAVAILABLE
              evidence_ref_ids:
                type: array
                maxItems: 0
              strengths:
                type: array
                maxItems: 0
              improvements:
                type: array
                maxItems: 0
              upgrade_examples:
                type: array
                maxItems: 0
            not:
              anyOf:
                - required:
                    - estimated_band
                - required:
                    - band_descriptor
    IeltsSpeakingReportFindings:
      type: array
      maxItems: 3
      items:
        $ref: '#/components/schemas/IeltsSpeakingReportFinding'
    IeltsSpeakingReportFinding:
      type: object
      additionalProperties: false
      required:
        - finding_id
        - message
        - evidence
      properties:
        finding_id:
          $ref: '#/components/schemas/StableIdentifier'
        message:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        suggestion:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/IeltsSpeakingReportEvidence'
    IeltsSpeakingReportEvidence:
      type: object
      additionalProperties: false
      required:
        - evidence_ref_id
        - turn_id
        - start_utf8_byte
        - end_utf8_byte
        - original_excerpt
      properties:
        evidence_ref_id:
          $ref: '#/components/schemas/StableIdentifier'
        turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        start_utf8_byte:
          type: integer
          minimum: 0
        end_utf8_byte:
          type: integer
          minimum: 1
        original_excerpt:
          $ref: '#/components/schemas/IeltsSpeakingReportSourceText'
    IeltsSpeakingOverallUnavailable:
      type: object
      additionalProperties: false
      required:
        - status
        - explanation
      properties:
        status:
          type: string
          const: NOT_AVAILABLE
        explanation:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
    IeltsSpeakingOverallAvailable:
      type: object
      additionalProperties: false
      required:
        - status
        - estimated_band
        - explanation
      properties:
        status:
          type: string
          const: AVAILABLE
        estimated_band:
          type: number
          minimum: 1
          maximum: 9
          multipleOf: 0.5
        explanation:
          $ref: '#/components/schemas/IeltsSpeakingReportText'
    IeltsSpeakingPartId:
      type: string
      enum:
        - PART_1
        - PART_2
        - PART_3
    IeltsSpeakingPracticeReport:
      type: object
      additionalProperties: false
      description: |
        Canonical section projection for one IELTS standalone practice
        FormalReport. It groups only questions, evidence and findings that
        belong to the frozen Part assignment; scores remain in the parent
        EvaluationFormalReport and no full-mock Overall Band is inferred.
      required:
        - schema_version
        - report_scope
        - available_sections
        - questions
        - section_reviews
      properties:
        schema_version:
          type: string
          const: ielts-speaking-practice-report/v1
        report_scope:
          type: string
          enum:
            - PART_1
            - PART_2_3
            - PART_3
        available_sections:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IeltsSpeakingPartId'
        questions:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/IeltsSpeakingPracticeQuestionReview'
        section_reviews:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/IeltsSpeakingPartReview'
      oneOf:
        - properties:
            report_scope:
              const: PART_1
            available_sections:
              prefixItems:
                - const: PART_1
              items: false
            section_reviews:
              prefixItems:
                - $ref: '#/components/schemas/IeltsSpeakingPartOneReview'
              items: false
        - properties:
            report_scope:
              const: PART_2_3
            available_sections:
              prefixItems:
                - const: PART_2
                - const: PART_3
              items: false
            section_reviews:
              prefixItems:
                - $ref: '#/components/schemas/IeltsSpeakingPartTwoReview'
                - $ref: '#/components/schemas/IeltsSpeakingPartThreeReview'
              items: false
        - properties:
            report_scope:
              const: PART_3
            available_sections:
              prefixItems:
                - const: PART_3
              items: false
            section_reviews:
              prefixItems:
                - $ref: '#/components/schemas/IeltsSpeakingPartThreeReview'
              items: false
    IeltsSpeakingPracticeQuestionReview:
      type: object
      additionalProperties: false
      required:
        - question_id
        - part_id
        - index
        - question_text
        - evidence_ref_ids
      properties:
        question_id:
          $ref: '#/components/schemas/StableIdentifier'
        part_id:
          $ref: '#/components/schemas/IeltsSpeakingPartId'
        index:
          type: integer
          minimum: 1
          maximum: 64
        question_text:
          $ref: '#/components/schemas/IeltsSpeakingReportSourceText'
        confirmed_transcript:
          $ref: '#/components/schemas/IeltsSpeakingReportSourceText'
        response_turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        evidence_ref_ids:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
      allOf:
        - if:
            required:
              - response_turn_id
          then:
            required:
              - confirmed_transcript
            properties:
              evidence_ref_ids:
                minItems: 1
          else:
            properties:
              evidence_ref_ids:
                maxItems: 0
            not:
              required:
                - confirmed_transcript
    IeltsSpeakingPartReviews:
      type: array
      minItems: 3
      maxItems: 3
      prefixItems:
        - $ref: '#/components/schemas/IeltsSpeakingPartOneReview'
        - $ref: '#/components/schemas/IeltsSpeakingPartTwoReview'
        - $ref: '#/components/schemas/IeltsSpeakingPartThreeReview'
      items: false
    IeltsSpeakingPartOneReview:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingPartReview'
        - type: object
          properties:
            part_id:
              const: PART_1
    IeltsSpeakingPartTwoReview:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingPartReview'
        - type: object
          properties:
            part_id:
              const: PART_2
    IeltsSpeakingPartThreeReview:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingPartReview'
        - type: object
          properties:
            part_id:
              const: PART_3
    IeltsSpeakingPartReview:
      type: object
      additionalProperties: false
      required:
        - part_id
        - question_indexes
        - evidence_ref_ids
        - strength_finding_ids
        - improvement_finding_ids
        - upgrade_example_finding_ids
      properties:
        part_id:
          $ref: '#/components/schemas/IeltsSpeakingPartId'
        question_indexes:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 64
        evidence_ref_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        strength_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingPartFindingIds'
        improvement_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingPartFindingIds'
        upgrade_example_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingPartFindingIds'
    IeltsSpeakingQuestionReview:
      type: object
      additionalProperties: false
      required:
        - question_id
        - part_id
        - index
        - question_text
        - opportunity_status
        - assessment_status
        - evidence_ref_ids
        - criterion_findings
      properties:
        question_id:
          $ref: '#/components/schemas/StableIdentifier'
        part_id:
          $ref: '#/components/schemas/IeltsSpeakingPartId'
        index:
          type: integer
          minimum: 1
          maximum: 64
        question_text:
          $ref: '#/components/schemas/IeltsSpeakingReportSourceText'
        opportunity_status:
          type: string
          enum:
            - PROVIDED
            - NOT_PROVIDED
        assessment_status:
          type: string
          enum:
            - ASSESSED
            - NOT_ASSESSED
        confirmed_transcript:
          $ref: '#/components/schemas/IeltsSpeakingReportSourceText'
        response_turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        evidence_ref_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        criterion_findings:
          $ref: '#/components/schemas/IeltsSpeakingQuestionCriterionFindings'
      allOf:
        - if:
            type: object
            properties:
              opportunity_status:
                const: PROVIDED
            required:
              - opportunity_status
          then:
            type: object
            required:
              - confirmed_transcript
              - response_turn_id
            properties:
              assessment_status:
                const: ASSESSED
              evidence_ref_ids:
                type: array
                minItems: 1
        - if:
            type: object
            properties:
              opportunity_status:
                const: NOT_PROVIDED
            required:
              - opportunity_status
          then:
            type: object
            properties:
              assessment_status:
                const: NOT_ASSESSED
              evidence_ref_ids:
                type: array
                maxItems: 0
            not:
              anyOf:
                - required:
                    - confirmed_transcript
                - required:
                    - response_turn_id
        - if:
            type: object
            properties:
              assessment_status:
                const: ASSESSED
            required:
              - assessment_status
          then:
            type: object
            properties:
              opportunity_status:
                const: PROVIDED
        - if:
            type: object
            properties:
              assessment_status:
                const: NOT_ASSESSED
            required:
              - assessment_status
          then:
            type: object
            properties:
              criterion_findings:
                type: array
                items:
                  type: object
                  properties:
                    strength_finding_ids:
                      type: array
                      maxItems: 0
                    improvement_finding_ids:
                      type: array
                      maxItems: 0
                    upgrade_example_finding_ids:
                      type: array
                      maxItems: 0
    IeltsSpeakingQuestionCriterionFindings:
      type: array
      minItems: 4
      maxItems: 4
      prefixItems:
        - $ref: '#/components/schemas/IeltsSpeakingQuestionFcFindings'
        - $ref: '#/components/schemas/IeltsSpeakingQuestionLrFindings'
        - $ref: '#/components/schemas/IeltsSpeakingQuestionGraFindings'
        - $ref: '#/components/schemas/IeltsSpeakingQuestionPrFindings'
      items: false
    IeltsSpeakingQuestionFcFindings:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingQuestionCriterionFinding'
        - type: object
          properties:
            criterion_id:
              const: IELTS_FC
    IeltsSpeakingQuestionLrFindings:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingQuestionCriterionFinding'
        - type: object
          properties:
            criterion_id:
              const: IELTS_LR
    IeltsSpeakingQuestionGraFindings:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingQuestionCriterionFinding'
        - type: object
          properties:
            criterion_id:
              const: IELTS_GRA
    IeltsSpeakingQuestionPrFindings:
      allOf:
        - $ref: '#/components/schemas/IeltsSpeakingQuestionCriterionFinding'
        - type: object
          properties:
            criterion_id:
              const: IELTS_PR
            strength_finding_ids:
              type: array
              maxItems: 0
            improvement_finding_ids:
              type: array
              maxItems: 0
            upgrade_example_finding_ids:
              type: array
              maxItems: 0
    IeltsSpeakingQuestionCriterionFinding:
      type: object
      additionalProperties: false
      required:
        - criterion_id
        - strength_finding_ids
        - improvement_finding_ids
        - upgrade_example_finding_ids
      properties:
        criterion_id:
          $ref: '#/components/schemas/IeltsSpeakingCriterionId'
        strength_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingFindingIds'
        improvement_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingFindingIds'
        upgrade_example_finding_ids:
          $ref: '#/components/schemas/IeltsSpeakingFindingIds'
    IeltsSpeakingFindingIds:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/StableIdentifier'
    IeltsSpeakingPartFindingIds:
      type: array
      maxItems: 36
      uniqueItems: true
      items:
        $ref: '#/components/schemas/StableIdentifier'
    IeltsSpeakingTargetPlan:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: NOT_CONFIGURED
    IeltsSpeakingPriorityAction:
      type: object
      additionalProperties: false
      required:
        - criterion_id
        - finding_id
      properties:
        criterion_id:
          $ref: '#/components/schemas/IeltsSpeakingCriterionId'
        finding_id:
          $ref: '#/components/schemas/StableIdentifier'
    IeltsSpeakingReportFailure:
      type: object
      additionalProperties: false
      required:
        - reason_code
        - retryable
      properties:
        reason_code:
          type: string
          enum:
            - POLICY_VIOLATION
            - EVIDENCE_REF_INVALID
            - VERSION_CONFLICT
            - INTERNAL_RETRYABLE
            - INTERNAL_NON_RETRYABLE
        retryable:
          type: boolean
      allOf:
        - if:
            type: object
            properties:
              reason_code:
                const: INTERNAL_RETRYABLE
            required:
              - reason_code
          then:
            type: object
            properties:
              retryable:
                const: true
        - if:
            type: object
            properties:
              reason_code:
                enum:
                  - POLICY_VIOLATION
                  - EVIDENCE_REF_INVALID
                  - VERSION_CONFLICT
                  - INTERNAL_NON_RETRYABLE
            required:
              - reason_code
          then:
            type: object
            properties:
              retryable:
                const: false
    IeltsSpeakingReportText:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^\S(?:[\s\S]*\S)?$'
      description: |
        Server-controlled rubric descriptor or feedback template text;
        never unvalidated provider prose.
    IeltsSpeakingReportSourceText:
      type: string
      minLength: 1
      maxLength: 16384
      pattern: '^\S(?:[\s\S]*\S)?$'
    Evaluation:
      $ref: '#/components/schemas/EvaluationCommonProperties'
    EvaluationCommonProperties:
      type: object
      additionalProperties: false
      required:
        - evaluation_id
        - evaluation_revision_id
        - revision
        - practice_session_id
        - input_snapshot_id
        - input_revision
        - scope
        - scene_type
        - channels
        - pipeline_version
        - schema_version
        - evaluation_status
        - module_statuses
        - is_final
        - created_at
        - updated_at
      properties:
        evaluation_id:
          $ref: '#/components/schemas/EvaluationUUID'
        evaluation_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        revision:
          type: integer
          minimum: 1
        supersedes_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        superseded_by_revision_id:
          $ref: '#/components/schemas/EvaluationUUID'
        practice_session_id:
          $ref: '#/components/schemas/StableIdentifier'
        input_snapshot_id:
          $ref: '#/components/schemas/StableIdentifier'
        input_revision:
          type: integer
          minimum: 1
        scope:
          $ref: '#/components/schemas/EvaluationScope'
        scene_type:
          $ref: '#/components/schemas/EvaluationSceneType'
        channels:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationChannel'
        scene_strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        core_4d_strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        pipeline_version:
          $ref: '#/components/schemas/VersionReference'
        schema_version:
          $ref: '#/components/schemas/VersionReference'
        evaluation_status:
          $ref: '#/components/schemas/EvaluationStatus'
        scoreability_status:
          $ref: '#/components/schemas/ScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/GateStatus'
        module_statuses:
          type: object
          minProperties: 1
          maxProperties: 32
          propertyNames:
            pattern: '^[a-z][a-z0-9_]{0,63}$'
          additionalProperties:
            $ref: '#/components/schemas/ModuleStatus'
        scene_result:
          $ref: '#/components/schemas/SceneEvaluationResult'
        core_4d_observations:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/CoreAbilityObservation'
        stable_failure:
          $ref: '#/components/schemas/EvaluationFailure'
        is_final:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              evaluation_status:
                type: string
                const: READY
            required:
              - evaluation_status
          then:
            required:
              - scoreability_status
              - gate_status
              - completed_at
            anyOf:
              - required:
                  - scene_result
              - required:
                  - core_4d_observations
        - if:
            properties:
              evaluation_status:
                type: string
                const: FAILED
            required:
              - evaluation_status
          then:
            required:
              - stable_failure
              - completed_at
            not:
              anyOf:
                - required:
                    - scoreability_status
                - required:
                    - gate_status
                - required:
                    - scene_result
                - required:
                    - core_4d_observations
        - if:
            properties:
              evaluation_status:
                type: string
                const: SUPERSEDED
            required:
              - evaluation_status
          then:
            required:
              - superseded_by_revision_id
    EvaluationFailure:
      type: object
      additionalProperties: false
      required:
        - reason_code
        - retryable
      properties:
        reason_code:
          $ref: '#/components/schemas/EvaluationReasonCode'
        retryable:
          type: boolean
    SceneEvaluationResult:
      $ref: '#/components/schemas/SceneResultCommonProperties'
    SceneResultCommonProperties:
      type: object
      additionalProperties: false
      required:
        - scene_type
        - dimensions
        - task_results
        - question_results
        - core4_observation_refs
        - evaluation_status
        - scoreability_status
        - gate_status
        - module_statuses
        - strategy_ref
        - aggregation_version
        - calibration_version
        - full_config_hash
        - is_final
      properties:
        scene_type:
          $ref: '#/components/schemas/EvaluationSceneType'
        dimensions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/SceneDimension'
        task_results:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/SceneTaskResult'
        question_results:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/QuestionEvaluationResult'
        core4_observation_refs:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        evaluation_status:
          type: string
          enum:
            - PARTIAL_READY
            - READY
        scoreability_status:
          $ref: '#/components/schemas/ScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/GateStatus'
        module_statuses:
          type: object
          minProperties: 1
          maxProperties: 32
          propertyNames:
            pattern: '^[a-z][a-z0-9_]{0,63}$'
          additionalProperties:
            $ref: '#/components/schemas/ModuleStatus'
        strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        aggregation_version:
          $ref: '#/components/schemas/VersionReference'
        calibration_version:
          $ref: '#/components/schemas/CalibrationVersion'
        full_config_hash:
          $ref: '#/components/schemas/ConfigHash'
        is_final:
          type: boolean
        overall_raw:
          type: number
          minimum: 0
          maximum: 9
        overall_display:
          type: number
          minimum: 0
          maximum: 9
          multipleOf: 0.5
        overall_rounding_rule:
          type: string
          const: HALF_UP_TO_0_5
        readiness_level:
          type: string
          enum:
            - HIGH
            - MEDIUM
            - LOW
            - NOT_ASSESSED
      allOf:
        - if:
            properties:
              scene_type:
                type: string
                const: IELTS_SPEAKING
            required:
              - scene_type
          then:
            not:
              required:
                - readiness_level
            allOf:
              - if:
                  properties:
                    gate_status:
                      type: string
                      const: PASS
                  required:
                    - gate_status
                then:
                  required:
                    - overall_raw
                    - overall_display
                    - overall_rounding_rule
                else:
                  not:
                    anyOf:
                      - required:
                          - overall_raw
                      - required:
                          - overall_display
                      - required:
                          - overall_rounding_rule
          else:
            not:
              anyOf:
                - required:
                    - overall_raw
                - required:
                    - overall_display
                - required:
                    - overall_rounding_rule
        - if:
            properties:
              scene_type:
                type: string
                const: INTERVIEW
            required:
              - scene_type
          then:
            required:
              - readiness_level
          else:
            not:
              required:
                - readiness_level
    SceneTaskResult:
      type: object
      additionalProperties: false
      required:
        - task_blueprint_ref
        - opportunity_status
        - outcome_status
        - reason_codes
        - evidence_refs
      properties:
        task_blueprint_ref:
          $ref: '#/components/schemas/VersionReference'
        opportunity_status:
          type: string
          enum:
            - PROVIDED
            - NOT_PROVIDED
        outcome_status:
          type: string
          enum:
            - ACHIEVED
            - PARTIAL
            - NOT_ACHIEVED
            - NOT_ASSESSED
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationReasonCode'
        evidence_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
      allOf:
        - if:
            properties:
              opportunity_status:
                type: string
                const: NOT_PROVIDED
            required:
              - opportunity_status
          then:
            properties:
              outcome_status:
                type: string
                const: NOT_ASSESSED
              reason_codes:
                type: array
                minItems: 1
    QuestionEvaluationResult:
      type: object
      additionalProperties: false
      required:
        - question_id
        - opportunity_status
        - response_turn_ids
        - dimension_evidence
        - evidence_refs
        - confidence
        - module_status
      properties:
        question_id:
          $ref: '#/components/schemas/StableIdentifier'
        opportunity_status:
          type: string
          enum:
            - PROVIDED
            - NOT_PROVIDED
        response_turn_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
        dimension_evidence:
          type: array
          maxItems: 17
          items:
            $ref: '#/components/schemas/QuestionDimensionEvidence'
        evidence_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        module_status:
          $ref: '#/components/schemas/ModuleStatus'
    QuestionDimensionEvidence:
      type: object
      additionalProperties: false
      required:
        - dimension_id
        - coverage
        - probe_weight
        - gate_status
        - reason_codes
        - evidence_refs
      properties:
        dimension_id:
          type: string
          enum:
            - IELTS_FC
            - IELTS_LR
            - IELTS_GRA
            - IELTS_PR
            - INTERVIEW_RELEVANCE
            - INTERVIEW_STRUCTURE
            - INTERVIEW_EVIDENCE
            - INTERVIEW_PROFESSIONAL
            - INTERVIEW_INTERACTION
            - DAILY_GOAL_ACHIEVEMENT
            - DAILY_CLARITY_ACCURACY
            - DAILY_INTERACTION
            - DAILY_APPROPRIATENESS
            - WORKPLACE_TASK_PROGRESS
            - WORKPLACE_CLARITY
            - WORKPLACE_COLLABORATION
            - WORKPLACE_PROFESSIONALISM
        question_score:
          type: number
          minimum: 0
          maximum: 100
        coverage:
          type: number
          minimum: 0
          maximum: 1
        probe_weight:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        gate_status:
          $ref: '#/components/schemas/GateStatus'
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationReasonCode'
        evidence_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
      allOf:
        - if:
            properties:
              gate_status:
                type: string
                const: PASS
            required:
              - gate_status
          then:
            required:
              - question_score
            properties:
              evidence_refs:
                type: array
                minItems: 1
          else:
            properties:
              reason_codes:
                type: array
                minItems: 1
            not:
              required:
                - question_score
    SceneDimension:
      $ref: '#/components/schemas/SceneDimensionCommonProperties'
    SceneDimensionCommonProperties:
      type: object
      additionalProperties: false
      required:
        - dimension_id
        - rounding_rule
        - scoreability_status
        - gate_status
        - confidence
        - coverage
        - reason_codes
        - evidence_refs
      properties:
        dimension_id:
          type: string
          enum:
            - IELTS_FC
            - IELTS_LR
            - IELTS_GRA
            - IELTS_PR
            - INTERVIEW_RELEVANCE
            - INTERVIEW_STRUCTURE
            - INTERVIEW_EVIDENCE
            - INTERVIEW_PROFESSIONAL
            - INTERVIEW_INTERACTION
            - DAILY_GOAL_ACHIEVEMENT
            - DAILY_CLARITY_ACCURACY
            - DAILY_INTERACTION
            - DAILY_APPROPRIATENESS
            - WORKPLACE_TASK_PROGRESS
            - WORKPLACE_CLARITY
            - WORKPLACE_COLLABORATION
            - WORKPLACE_PROFESSIONALISM
        rounding_rule:
          $ref: '#/components/schemas/RoundingRule'
        scoreability_status:
          $ref: '#/components/schemas/ScoreabilityStatus'
        gate_status:
          $ref: '#/components/schemas/GateStatus'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        coverage:
          type: number
          minimum: 0
          maximum: 1
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationReasonCode'
        evidence_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
        raw:
          type: number
          minimum: 0
          maximum: 100
        display:
          type: number
          minimum: 0
          maximum: 100
        interval:
          $ref: '#/components/schemas/ScoreInterval'
      allOf:
        - if:
            properties:
              gate_status:
                type: string
                const: PASS
            required:
              - gate_status
          then:
            required:
              - raw
              - display
            properties:
              evidence_refs:
                type: array
                minItems: 1
          else:
            required:
              - reason_codes
            properties:
              reason_codes:
                type: array
                minItems: 1
            not:
              anyOf:
                - required:
                    - raw
                - required:
                    - display
                - required:
                    - interval
    ScoreInterval:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: number
          minimum: 0
          maximum: 100
        - type: number
          minimum: 0
          maximum: 100
      items: false
    CoreAbilityObservation:
      $ref: '#/components/schemas/CoreAbilityCommonProperties'
    CoreAbilityCommonProperties:
      type: object
      additionalProperties: false
      required:
        - observation_id
        - dimension
        - weights
        - rounding_rule
        - confidence
        - coverage
        - gate_status
        - reason_codes
        - evidence_refs
        - profile_update_eligible
        - strategy_ref
        - aggregation_version
        - calibration_version
        - full_config_hash
      properties:
        observation_id:
          $ref: '#/components/schemas/StableIdentifier'
        dimension:
          type: string
          enum:
            - PRONUNCIATION
            - FLUENCY
            - VOCABULARY
            - GRAMMAR
        weights:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/NamedWeight'
        rounding_rule:
          type: string
          const: HALF_UP_TO_INTEGER
        confidence:
          type: number
          minimum: 0
          maximum: 1
        coverage:
          type: number
          minimum: 0
          maximum: 1
        gate_status:
          $ref: '#/components/schemas/GateStatus'
        reason_codes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvaluationReasonCode'
        evidence_refs:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
        profile_update_eligible:
          type: boolean
        strategy_ref:
          $ref: '#/components/schemas/VersionReference'
        aggregation_version:
          $ref: '#/components/schemas/VersionReference'
        calibration_version:
          $ref: '#/components/schemas/CalibrationVersion'
        full_config_hash:
          $ref: '#/components/schemas/ConfigHash'
        raw_score:
          type: number
          minimum: 0
          maximum: 100
        display_score:
          type: integer
          minimum: 0
          maximum: 100
        interval:
          $ref: '#/components/schemas/ScoreInterval'
      allOf:
        - if:
            properties:
              gate_status:
                type: string
                const: PASS
            required:
              - gate_status
          then:
            required:
              - raw_score
              - display_score
            properties:
              evidence_refs:
                type: array
                minItems: 1
          else:
            required:
              - reason_codes
              - profile_update_eligible
            properties:
              reason_codes:
                type: array
                minItems: 1
              profile_update_eligible:
                type: boolean
                const: false
            not:
              anyOf:
                - required:
                    - raw_score
                - required:
                    - display_score
                - required:
                    - interval
    NamedWeight:
      type: object
      additionalProperties: false
      required:
        - key
        - value
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]*$'
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 1
    EvidenceRef:
      type: object
      additionalProperties: false
      required:
        - evidence_ref_id
        - snapshot_id
        - turn_id
        - speaker
        - quality
        - lineage
      properties:
        evidence_ref_id:
          $ref: '#/components/schemas/StableIdentifier'
        snapshot_id:
          $ref: '#/components/schemas/StableIdentifier'
        turn_id:
          $ref: '#/components/schemas/StableIdentifier'
        speaker:
          type: string
          enum:
            - USER
            - FACILITATOR
        transcript_span:
          $ref: '#/components/schemas/TranscriptSpan'
        audio_span:
          $ref: '#/components/schemas/AudioSpan'
        quality:
          $ref: '#/components/schemas/EvidenceQuality'
        lineage:
          $ref: '#/components/schemas/EvidenceLineage'
      anyOf:
        - required:
            - transcript_span
        - required:
            - audio_span
    TranscriptSpan:
      type: object
      additionalProperties: false
      required:
        - start_utf8_byte
        - end_utf8_byte
      properties:
        start_utf8_byte:
          type: integer
          minimum: 0
        end_utf8_byte:
          type: integer
          minimum: 1
        token_ids:
          type: array
          maxItems: 256
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StableIdentifier'
    AudioSpan:
      type: object
      additionalProperties: false
      required:
        - audio_asset_id
        - start_ms
        - end_ms
      properties:
        audio_asset_id:
          $ref: '#/components/schemas/StableIdentifier'
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
    EvidenceQuality:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        audio:
          type: number
          minimum: 0
          maximum: 1
        asr:
          type: number
          minimum: 0
          maximum: 1
        alignment:
          type: number
          minimum: 0
          maximum: 1
    EvidenceLineage:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        asr_artifact:
          $ref: '#/components/schemas/ArtifactDigest'
        feature_artifact:
          $ref: '#/components/schemas/ArtifactDigest'
