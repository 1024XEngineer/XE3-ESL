    CoreAbilityObservation:
      $ref: '#/components/schemas/CoreAbilityCommonProperties'
    CoreAbilityCommonProperties:
      type: object
      additionalProperties: false
      required:
        - observation_id
        - dimension
        - weights
        - rounding_rule
        - confidence
        - coverage
