paths:
  /v1/practice-sessions/{practice_session_id}/activation:
    post:
      tags:
        - Practice
      summary: Activate an existing Practice Session for voice interaction
      description: |
        Activates the exact Actor-owned Practice Session created from a
        confirmed Practice Plan. The empty request is idempotent and never
        infers a Plan from Agent Thread state or accepts a participant,
        question, transcript, Scene, or policy from the client.
      operationId: activatePracticeSessionInteraction
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Durable Session state and its current text Question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeInteractionState'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/interaction-state:
    get:
      tags:
        - Practice
      summary: Restore one exact Practice Session's voice state
      description: |
        Restores the Actor-owned Session by its explicit identifier. It never
        selects a recent Session or infers one from Agent Thread state.
      operationId: getPracticeInteractionState
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
      responses:
        '200':
          description: Recovered Session, latest confirmed Turn, and current Question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeInteractionState'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/questions/{question_id}/transcription-candidates:
    post:
      tags:
        - Practice
      summary: Transcribe one bounded WAV answer into an unconfirmed candidate
      description: |
        The body is raw `audio/wav`. The server validates its real WAV shape,
        byte size, duration, channels, and sample rate, keeps it only in a
        bounded temporary lifecycle, resolves the respondent from the Bearer
        Actor through Practice, and sends only the current recording to ASR.
        Failure does not create a Turn or advance Practice.
      operationId: createVoiceTranscriptionCandidate
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Candidate transcript awaiting explicit confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionCandidate'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/questions/{question_id}/deferred-transcriptions:
    post:
      tags: [Practice]
      summary: Durably stage a WAV answer for background transcription
      description: |
        Persists the bounded recording and a recoverable transcription
        reservation before returning. ASR and Turn confirmation continue in
        the server lifecycle; callers poll the returned Actor-owned status URL.
      operationId: createDeferredPracticeTranscription
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Recording durably staged for background processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredTranscription'
        '400': {$ref: ../common/errors.yaml#/components/responses/BadRequest}
        '401': {$ref: ../common/errors.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../common/errors.yaml#/components/responses/NotFound}
        '409': {$ref: ../common/errors.yaml#/components/responses/Conflict}
        default: {$ref: ../common/errors.yaml#/components/responses/DefaultError}
  /v1/practice-sessions/{practice_session_id}/deferred-transcriptions/{transcription_id}:
    get:
      tags: [Practice]
      summary: Read and recover one background transcription
      operationId: getDeferredPracticeTranscription
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - name: transcription_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/AggregateId'}
      responses:
        '200':
          description: Current durable processing state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredTranscription'
        '401': {$ref: ../common/errors.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../common/errors.yaml#/components/responses/NotFound}
        default: {$ref: ../common/errors.yaml#/components/responses/DefaultError}
  /v1/retry-turns/{retry_turn_id}/transcription-candidates:
    post:
      tags:
        - Practice
      summary: Transcribe one bounded WAV answer for an ANSWERING retry Turn
      description: |
        This is the only voice-answer entry for a same-question retry created
        by Review. The Actor supplies the deterministic answer path of the
        retry Turn returned by the feedback-item operation and a raw
        `audio/wav` body. Practice resolves
        the retry draft, original Question, Practice Session, and respondent
        entirely from `retry_turn_id`; the client cannot select or replace any
        of those trusted bindings.

        Replaying the same Actor, path, Idempotency-Key, and recording checksum
        restores the same completed candidate. A failed or expired ASR lease
        may be retried by repeating that identical request; different audio for
        the same idempotency scope is a conflict. This operation never submits
        the draft, advances `effective_turns`, replaces the ordinary current
        Question, or returns a PracticeInteractionState.
      operationId: createRetryTurnTranscriptionCandidate
      parameters:
        - $ref: '#/components/parameters/RetryTurnId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: |
            Completed retry transcription candidate, whether newly created or
            restored by an idempotent replay.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryTranscriptionCandidate'
        '400':
          $ref: '#/components/responses/RetryPrivateBadRequest'
        '401':
          $ref: '#/components/responses/RetryPrivateUnauthorized'
        '404':
          $ref: '#/components/responses/RetryPrivateNotFound'
        '409':
          $ref: '#/components/responses/RetryPrivateConflict'
        default:
          $ref: '#/components/responses/RetryPrivateDefaultError'
  /v1/retry-turns/{retry_turn_id}/transcription-candidates/{candidate_id}/confirmations:
    post:
      tags:
        - Practice
      summary: Confirm a candidate against its exact retry Turn draft
      description: |
        The request has no body. Practice verifies that both path IDs belong
        to the current Actor, then compares the candidate's persisted Session
        and Question with this exact `ANSWERING` retry draft. The confirmation
        transaction atomically binds the matching candidate and confirms the
        pre-created `retry_turn_id`; it never mints a different Turn and never
        routes the candidate through another confirmation path.

        The response is a ConfirmedRetryTurn only. It never advances the
        Session or replaces the current Question. Replaying the same
        Idempotency-Key restores the same confirmed retry Turn.
      operationId: confirmRetryTurnTranscriptionCandidate
      parameters:
        - $ref: '#/components/parameters/RetryTurnId'
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The original or replayed confirmed retry Turn.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedRetryTurn'
        '400':
          $ref: '#/components/responses/RetryPrivateBadRequest'
        '401':
          $ref: '#/components/responses/RetryPrivateUnauthorized'
        '404':
          $ref: '#/components/responses/RetryPrivateNotFound'
        '409':
          $ref: '#/components/responses/RetryPrivateConflict'
        default:
          $ref: '#/components/responses/RetryPrivateDefaultError'
  /v1/transcription-candidates/{candidate_id}/confirmations:
    post:
      tags:
        - Practice
      summary: Atomically confirm an Answer and advance Practice
      description: |
        The request has no body. One PostgreSQL transaction confirms the
        Answer, creates or restores its immutable Turn, advances Session state,
        and records PracticeCompleted when the Session reaches its limit. The
        request does not create a Review or calculate a score.
      operationId: confirmVoiceTranscriptionCandidate
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Recovered Practice state after confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeInteractionState'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/questions/{question_id}/text-answers:
    post:
      tags:
        - Practice
      summary: Submit one English text answer and advance the durable Practice state
      description: |
        Creates an immutable text-backed Practice input candidate and confirmed
        Turn in one idempotent transaction. It advances the Session exactly
        once, returns the next Question while active, and records
        PracticeCompleted at the terminal transition. No recording, ASR asset,
        Review, or score is created by this request.
      operationId: submitPracticeTextAnswer
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextAnswerRequest'
      responses:
        '200':
          description: Recovered Practice state after accepting the text answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeInteractionState'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-sessions/{practice_session_id}/questions/{question_id}/tips:
    post:
      tags:
        - Practice
      summary: Create or restore a short reference answer for the current interview Question
      description: |
        The request has no body. The server verifies that the authenticated
        Actor owns an active INTERVIEW Session and that `question_id` is its
        current PRIMARY or FOLLOW_UP Question. One durable Tip is generated per
        Question and replayed across repeated or concurrent requests. A Tip is
        a read aid only: it never creates a candidate or Turn, never advances
        effective turns or follow-up limits, and is excluded from Review,
        Evaluation, memory, and message history.
      operationId: ensurePracticeQuestionTip
      parameters:
        - $ref: '#/components/parameters/PracticeSessionId'
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The newly generated or previously persisted Question Tip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeQuestionTip'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-questions/{question_id}/speech:
    get:
      tags:
        - Practice
      summary: Synthesize the persisted Question on demand
      description: |
        Returns ephemeral WAV bytes. TTS failure never removes or hides the
        text Question returned by the Session resource.
      operationId: getPracticeQuestionSpeech
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Synthesized Question audio.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-questions/{question_id}/speech/realtime:
    get:
      tags:
        - Practice
      summary: Stream the persisted Question as synthesized PCM
      description: |
        Authenticates the Actor and resolves the Actor-owned persisted Question
        before upgrading. The server emits `stream.ready`, then binary mono
        24 kHz signed 16-bit little-endian PCM chunks as synthesis progresses,
        followed by exactly one `stream.completed` or `stream.failed` event.
        The client supplies only the Question identity and cannot provide or
        replace the text sent to the speech provider.
      operationId: streamPracticeQuestionSpeech
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          description: Required realtime Practice Question speech subprotocol.
          schema:
            type: string
            const: speakup.practice-question-speech.v1
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          headers:
            Sec-WebSocket-Protocol:
              description: Negotiated Practice Question speech protocol.
              schema:
                type: string
                const: speakup.practice-question-speech.v1
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
      x-websocket-event-schema:
        $ref: ../websocket/practice-question-speech.schema.json#/$defs/ServerEvent
      x-websocket-security:
        credential_location: authorization_header
        header: Authorization
        scheme: Bearer
        other_credential_locations_allowed: false
        production_transport: wss
        local_loopback_transport: ws
        pre_upgrade:
          validation_order:
            - session
            - actor
            - resource_ownership
            - subprotocol
            - upgrade
          authentication_failure:
            http_status: 401
            error_code: authentication_required
          resource_not_visible:
            http_status: 404
            error_code: resource_not_found
        connection_binding:
          actor_fields:
            - user_id
            - session_id
          target_field: question_id
          target_switch_allowed: false
        subprotocol:
          allowed:
            - speakup.practice-question-speech.v1
          carries_credentials: false
  /v1/practice-questions/{question_id}/translation:
    get:
      tags:
        - Practice
      summary: Translate an interview Question into Simplified Chinese on demand
      description: |
        Returns an ephemeral read aid for an Actor-owned INTERVIEW Question.
        Translation never creates a Message, Candidate, or Turn and is excluded
        from progression, Review, Evaluation, memory, and history.
      operationId: getPracticeQuestionTranslation
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Simplified Chinese translation of the Question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeQuestionTranslation'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/practice-speech/realtime:
    get:
      tags:
        - Practice
      summary: Stream authenticated Coaching prompt text as synthesized PCM
      description: |
        Authenticates the Actor before upgrading. After `stream.ready`, the
        client sends exactly one bounded `speak` event. The server streams mono
        24 kHz signed 16-bit little-endian PCM chunks and then exactly one
        `stream.completed` or `stream.failed` event. The prompt is ephemeral and
        must not be persisted or logged.
      operationId: streamPracticePromptSpeech
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            const: speakup.practice-question-speech.v1
      responses:
        '101':
          description: WebSocket protocol upgrade accepted.
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: string
                const: speakup.practice-question-speech.v1
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
      x-websocket-client-event-schema:
        $ref: ../websocket/practice-question-speech.schema.json#/$defs/ClientEvent
      x-websocket-event-schema:
        $ref: ../websocket/practice-question-speech.schema.json#/$defs/ServerEvent
      x-websocket-security:
        credential_location: authorization_header
        header: Authorization
        scheme: Bearer
        other_credential_locations_allowed: false
        production_transport: wss
        local_loopback_transport: ws
        subprotocol:
          allowed:
            - speakup.practice-question-speech.v1
          carries_credentials: false
  /v1/audio-assets/{audio_asset_id}:
    delete:
      tags:
        - Practice
      summary: Delete the current user's recording
      description: |
        The server atomically detaches the shared Media Asset from the current
        user's confirmed Practice Turn and schedules private-object cleanup.
        The confirmed Turn and transcript remain available, while playback is
        removed immediately. Object deletion is retried asynchronously if the
        provider is unavailable; this never restores playback access.

        A missing recording and a recording owned by another user produce the
        same `404` response.
      operationId: deleteAudioAsset
      parameters:
        - $ref: '#/components/parameters/AudioAssetId'
      responses:
        '204':
          description: |
            The recording was detached and is no longer playable. Its confirmed
            Turn and transcript were preserved. The response has no body.
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/audio-assets/{audio_asset_id}/playback:
    get:
      tags:
        - Practice
      summary: Get temporary playback access to the current user's recording
      description: |
        The server derives the trusted Actor from the validated Bearer Session
        and verifies that a ready shared Media Asset is still referenced by one
        of the Actor's confirmed Practice Turns before asking object storage for
        a signed URL. A missing, unavailable, detached, or differently owned
        recording produces the same `404` response.

        The returned HTTPS URL expires no later than two minutes after issuance
        and is itself a bearer capability, so clients must not persist, log, or
        share it. An OSS Presign URL may expose provider routing information,
        including the bucket, an AccessKey identifier, and the object key; the
        object key must therefore be an unguessable opaque path. The URL never
        contains an AccessKey Secret, reusable server credential, or permanent
        playback capability.
      operationId: getAudioAssetPlayback
      parameters:
        - $ref: '#/components/parameters/AudioAssetId'
      responses:
        '200':
          description: Temporary playback access for the owned recording.
          headers:
            Cache-Control:
              description: Prevent clients and intermediaries from storing the capability response.
              schema:
                type: string
                const: no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAssetPlayback'
              example:
                playback_url: https://media.example.invalid/temporary-playback
                expires_at: '2026-07-25T12:02:00Z'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    PracticeSessionId:
      name: practice_session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AggregateId'
    QuestionId:
      name: question_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AggregateId'
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AggregateId'
    RetryTurnId:
      name: retry_turn_id
      in: path
      required: true
      description: |
        Actor-owned Practice Turn ID returned by the feedback-item retry-turn
        operation. It must identify the same-question retry Turn.
      schema:
        $ref: '#/components/schemas/AggregateId'
    AudioAssetId:
      name: audio_asset_id
      in: path
      required: true
      description: |
        UUID of the shared Media Asset referenced by a confirmed Practice Turn.
      schema:
        $ref: '#/components/schemas/AggregateId'
    IdempotencyKey:
      $ref: ../common/parameters.yaml#/components/parameters/IdempotencyKey
  headers:
    PrivateNoStore:
      description: Prohibits shared and private storage of Actor-owned data.
      required: true
      schema:
        type: string
        const: private, no-store
  responses:
    RetryPrivateBadRequest:
      description: The retry voice request is malformed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
    RetryPrivateUnauthorized:
      description: A valid Bearer Session is required for this operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        WWW-Authenticate:
          description: Authentication scheme required by the API.
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
    RetryPrivateNotFound:
      description: |
        The draft or candidate is unknown, hidden, deleted, or unavailable to
        the current Actor. These cases are intentionally indistinguishable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
    RetryPrivateConflict:
      description: |
        The retry draft, candidate, recording checksum, or idempotency scope
        conflicts with the current durable state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          description: Optional delay while an existing ASR lease is active.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
    RetryPrivateDefaultError:
      description: A stable private retry voice error response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          description: Optional minimum delay for a retryable service failure.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: ../common/errors.yaml#/components/schemas/ErrorResponse
  schemas:
    AggregateId:
      type: string
      format: uuid
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    TextAnswerRequest:
      type: object
      additionalProperties: false
      required:
        - answer_text
      properties:
        answer_text:
          type: string
          minLength: 1
          maxLength: 8000
    PracticeInteractionState:
      type: object
      additionalProperties: false
      required:
        - practice_session_id
        - practice_plan_id
        - scene_id
        - scene_version
        - practice_experience
        - scene_category
        - practice_mode
        - practice_session_status
        - session_version
        - effective_turns
        - turn_limit
        - completion_mode
        - session_completed
        - practice_capabilities
      properties:
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        practice_plan_id:
          $ref: '#/components/schemas/AggregateId'
        scene_id:
          $ref: '#/components/schemas/ResourceId'
        scene_version:
          type: integer
          minimum: 1
        practice_experience:
          $ref: ./scene.yaml#/components/schemas/PracticeExperience
        scene_category:
          $ref: ./scene.yaml#/components/schemas/SceneCategory
        practice_mode:
          $ref: ./scene.yaml#/components/schemas/PracticeMode
        practice_session_status:
          type: string
          enum:
            - in_progress
            - paused
            - completed
            - ended_early
        session_version:
          type: integer
          minimum: 1
        effective_turns:
          type: integer
          minimum: 0
        turn_limit:
          type: integer
          minimum: 0
          maximum: 64
          description: Zero when completion_mode is USER_CONTROLLED.
        completion_mode:
          type: string
          enum:
            - TURN_LIMITED
            - USER_CONTROLLED
        session_completed:
          type: boolean
          description: |
            True when the Practice Session is terminal, whether it completed
            normally or ended early. `practice_session_status` remains the
            authoritative reason for the terminal state.
        practice_capabilities:
          $ref: '#/components/schemas/PracticeCapabilities'
        ielts_assignment:
          $ref: ./preparation.yaml#/components/schemas/IELTSAssignment
        current_question:
          $ref: '#/components/schemas/PracticeQuestion'
        current_turn:
          $ref: '#/components/schemas/ConfirmedPracticeTurn'
        turn_history:
          type: array
          description: |
            Confirmed `EFFECTIVE` turns ordered by Question sequence. A
            `PRIMARY` Turn advances `effective_turns`; a `FOLLOW_UP` Turn keeps
            the previous value. USER_CONTROLLED Sessions may continue until
            the learner explicitly completes them, so this projection has no
            fixed round-count bound.
            `RETRY` turns are intentionally excluded so same-question practice
            cannot change the Session's current Question, latest effective
            checkpoint, or `effective_turns` history invariant. This projection
            lets clients restore feedback beside its original effective message
            after a cold start. It is absent when no history projection is
            available.
          items:
            $ref: '#/components/schemas/PracticeTurnHistoryEntry'
      allOf:
        - if:
            properties:
              completion_mode:
                const: USER_CONTROLLED
            required:
              - completion_mode
          then:
            properties:
              turn_limit:
                type: integer
                const: 0
          else:
            properties:
              turn_limit:
                type: integer
                minimum: 1
        - if:
            properties:
              practice_experience:
                const: IELTS_SPEAKING
            required:
              - practice_experience
          then:
            required:
              - ielts_assignment
          else:
            not:
              required:
                - ielts_assignment
        - if:
            properties:
              practice_mode:
                const: FULL_MOCK
            required:
              - practice_mode
          then:
            properties:
              ielts_assignment:
                properties:
                  mode:
                    const: FULL_MOCK
        - if:
            properties:
              practice_mode:
                const: PART_1
            required:
              - practice_mode
          then:
            properties:
              ielts_assignment:
                properties:
                  mode:
                    const: PART_1
        - if:
            properties:
              practice_mode:
                const: PART_2
            required:
              - practice_mode
          then:
            properties:
              ielts_assignment:
                properties:
                  mode:
                    const: PART_2
        - if:
            properties:
              practice_mode:
                const: PART_3
            required:
              - practice_mode
          then:
            properties:
              ielts_assignment:
                properties:
                  mode:
                    const: PART_3
        - if:
            properties:
              session_completed:
                const: true
            required:
              - session_completed
          then:
            required:
              - current_turn
        - if:
            properties:
              session_completed:
                const: false
            required:
              - session_completed
          then:
            required:
              - current_question
    PracticeCapabilities:
      type: object
      additionalProperties: false
      readOnly: true
      required:
        - retry_allowed
        - question_translation_allowed
        - question_tips_allowed
        - speech_feedback_allowed
      properties:
        retry_allowed:
          type: boolean
        question_translation_allowed:
          type: boolean
        question_tips_allowed:
          type: boolean
        speech_feedback_allowed:
          type: boolean
    PracticeQuestion:
      type: object
      additionalProperties: false
      required:
        - question_id
        - practice_session_id
        - question_type
        - content
        - speaker_participant_id
        - addressee_participant_ids
        - speech_path
      properties:
        question_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_type:
          type: string
          enum: [PRIMARY, FOLLOW_UP]
        parent_question_id:
          $ref: '#/components/schemas/AggregateId'
        content:
          type: string
          minLength: 1
        speaker_participant_id:
          $ref: '#/components/schemas/AggregateId'
        addressee_participant_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AggregateId'
        speech_path:
          type: string
          pattern: '^/v1/practice-questions/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/speech$'
      allOf:
        - if:
            properties:
              question_type:
                const: FOLLOW_UP
            required: [question_type]
          then:
            required: [parent_question_id]
        - if:
            properties:
              question_type:
                const: PRIMARY
            required: [question_type]
          then:
            not:
              required: [parent_question_id]
    PracticeQuestionTranslation:
      type: object
      additionalProperties: false
      required:
        - question_id
        - target_language
        - translation
      properties:
        question_id:
          $ref: '#/components/schemas/AggregateId'
        target_language:
          type: string
          const: zh-CN
        translation:
          type: string
          minLength: 1
          maxLength: 2000
    PracticeQuestionTip:
      type: object
      additionalProperties: false
      required:
        - tip_id
        - practice_session_id
        - question_id
        - content
        - translation
        - created_at
      properties:
        tip_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        content:
          type: string
          minLength: 1
          maxLength: 800
        translation:
          type: string
          minLength: 1
          maxLength: 2000
          description: Simplified Chinese translation of the English Tip content.
        created_at:
          type: string
          format: date-time
    PracticeTurnHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - question
        - turn
      properties:
        question:
          $ref: '#/components/schemas/PracticeQuestion'
        turn:
          $ref: '#/components/schemas/ConfirmedPracticeTurn'
    TranscriptionCandidate:
      type: object
      additionalProperties: false
      required:
        - candidate_id
        - practice_session_id
        - question_id
        - respondent_participant_id
        - transcript_id
        - evidence_version
        - transcript
        - created_at
      properties:
        candidate_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        respondent_participant_id:
          $ref: '#/components/schemas/AggregateId'
        transcript_id:
          $ref: '#/components/schemas/ResourceId'
        evidence_version:
          type: integer
          format: int64
          minimum: 1
        transcript:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
    DeferredTranscription:
      type: object
      additionalProperties: false
      required:
        - transcription_id
        - practice_session_id
        - question_id
        - status
        - status_url
      properties:
        transcription_id: {$ref: '#/components/schemas/AggregateId'}
        practice_session_id: {$ref: '#/components/schemas/AggregateId'}
        question_id: {$ref: '#/components/schemas/AggregateId'}
        status:
          type: string
          enum: [processing, completed, failed]
        status_url:
          type: string
          pattern: '^/v1/practice-sessions/.+/deferred-transcriptions/.+$'
    RetryTranscriptionCandidate:
      type: object
      additionalProperties: false
      description: |
        Ready ASR candidate projected in the context of one pre-created
        same-question retry Turn. The create handler derives Session, Question,
        and respondent from the Actor-owned draft. Candidate persistence remains
        keyed by its canonical Session and Question; the later retry confirmation
        transaction verifies those fields against the draft before atomically
        binding it. This DTO cannot be passed to the ordinary effective-Turn
        confirmation operation.
      x-invariants:
        - retry_turn_id is the ANSWERING draft used to derive this response projection
        - practice_session_id and question_id equal the immutable retry draft bindings
      required:
        - candidate_id
        - retry_turn_id
        - practice_session_id
        - question_id
        - respondent_participant_id
        - candidate_status
        - transcript_id
        - evidence_version
        - transcript
        - created_at
      properties:
        candidate_id:
          $ref: '#/components/schemas/AggregateId'
        retry_turn_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        respondent_participant_id:
          $ref: '#/components/schemas/AggregateId'
        candidate_status:
          type: string
          const: READY
          readOnly: true
        transcript_id:
          $ref: '#/components/schemas/ResourceId'
        evidence_version:
          type: integer
          format: int64
          minimum: 1
        transcript:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^(?![\s\S]*\u0000)[\s\S]*\S[\s\S]*$'
          x-max-utf8-bytes: 16384
        created_at:
          type: string
          format: date-time
    ConfirmedRetryTurn:
      type: object
      additionalProperties: false
      description: |
        Immutable confirmation of the exact retry Turn draft. This is not a
        PracticeInteractionState and deliberately contains no `effective_turns`,
        Session version, completion state, current Question, turn history,
        formal Review, or SpeechFeedback projection.
      x-invariants:
        - turn_id equals the retry_turn_id used by the confirmation path
        - question_id equals the immutable Question referenced by original_turn_id
      required:
        - turn_id
        - original_turn_id
        - practice_session_id
        - question_id
        - respondent_participant_id
        - candidate_id
        - interaction_mode
        - answer_text
        - evidence_version
        - turn_kind
        - turn_status
        - counts_toward_turn_limit
        - created_at
        - confirmed_at
      properties:
        turn_id:
          $ref: '#/components/schemas/AggregateId'
        original_turn_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        respondent_participant_id:
          $ref: '#/components/schemas/AggregateId'
        candidate_id:
          $ref: '#/components/schemas/AggregateId'
        interaction_mode:
          type: string
          const: PUSH_TO_TALK
        answer_text:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^(?![\s\S]*\u0000)[\s\S]*\S[\s\S]*$'
          x-max-utf8-bytes: 16384
        evidence_version:
          type: integer
          format: int64
          minimum: 1
        turn_kind:
          type: string
          const: RETRY
        turn_status:
          type: string
          const: CONFIRMED
        counts_toward_turn_limit:
          type: boolean
          const: false
          description: |
            Frozen Practice policy decision for the current Daily/Workplace
            same-question retry. This is not the Session's progress value.
        audio_asset_id:
          $ref: '#/components/schemas/AggregateId'
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
    ConfirmedPracticeTurn:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - practice_session_id
        - question_id
        - respondent_participant_id
        - candidate_id
        - answer_text
        - evidence_version
        - effective_turns
        - counts_toward_effective_turn_limit
        - session_completed
      properties:
        turn_id:
          $ref: '#/components/schemas/AggregateId'
        practice_session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        respondent_participant_id:
          $ref: '#/components/schemas/AggregateId'
        candidate_id:
          $ref: '#/components/schemas/AggregateId'
        answer_text:
          type: string
          minLength: 1
        evidence_version:
          type: integer
          format: int64
          minimum: 1
        effective_turns:
          type: integer
          minimum: 1
        counts_toward_effective_turn_limit:
          type: boolean
        session_completed:
          type: boolean
        audio_asset_id:
          $ref: '#/components/schemas/AggregateId'
        speech_feedback_status_url:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^/v1/practice-turns/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/evaluation$'
          readOnly: true
          description: |
            Actor-owned PRACTICE_TURN_FEEDBACK Evaluation URL. Present only for
            an eligible confirmed Daily or Workplace voice Turn. It is absent,
            never null, for text, Interview, IELTS, assistant, unconfirmed,
            hidden, or deleted sources.
    AudioAssetPlayback:
      type: object
      additionalProperties: false
      description: |
        Ephemeral bearer capability for an owned recording. The URL is never
        stored as Media Asset metadata, is invalid after `expires_at`, and never
        contains an AccessKey Secret or reusable server credential.
      required:
        - playback_url
        - expires_at
      properties:
        playback_url:
          type: string
          format: uri
          pattern: '^https://'
          readOnly: true
          description: |
            A signed HTTPS GET bearer capability valid for no more than two
            minutes. Its path may reveal the unguessable opaque object key.
        expires_at:
          type: string
          format: date-time
          readOnly: true
    TranscriptSegment:
      type: object
      additionalProperties: false
      required:
        - start_ms
        - end_ms
        - text
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
    TranscriptSnapshot:
      type: object
      additionalProperties: false
      required:
        - transcript_id
        - text
        - language
        - status
      properties:
        transcript_id:
          $ref: '#/components/schemas/ResourceId'
        text:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 2
        status:
          type: string
          const: ready
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'
    AudioReference:
      type: object
      additionalProperties: false
      required:
        - audio_id
        - content_type
        - format
        - size_bytes
        - duration_ms
      properties:
        audio_id:
          $ref: '#/components/schemas/ResourceId'
        content_type:
          type: string
          pattern: '^audio/[A-Za-z0-9.+-]+$'
        format:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        duration_ms:
          type: integer
          minimum: 1
        checksum:
          type: string
          minLength: 1
    TurnReviewSource:
      type: object
      additionalProperties: false
      description: |
        Immutable Practice projection consumed by Review. `session_id`
        retains the exact canonical field frozen in Issue #34 and identifies a
        PracticeSession; changing it requires a later incremental decision.
      required:
        - turn_id
        - session_id
        - question_id
        - question_text
        - question_speaker_participant_id
        - addressee_participant_ids
        - respondent_participant_id
        - transcript
        - completed_at
      properties:
        turn_id:
          $ref: '#/components/schemas/AggregateId'
        session_id:
          $ref: '#/components/schemas/AggregateId'
        question_id:
          $ref: '#/components/schemas/AggregateId'
        question_text:
          type: string
          minLength: 1
        question_speaker_participant_id:
          $ref: '#/components/schemas/AggregateId'
        addressee_participant_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AggregateId'
        respondent_participant_id:
          $ref: '#/components/schemas/AggregateId'
        transcript:
          $ref: '#/components/schemas/TranscriptSnapshot'
        audio:
          $ref: '#/components/schemas/AudioReference'
        completed_at:
          type: string
          format: date-time
