paths:
  /v1/ielts-speaking/question-bank:
    get:
      tags: [IELTS Speaking]
      summary: Get the current published IELTS Speaking catalog
      description: Returns the server-defined season, filters, Part 1 topics, and paired Part 2/Part 3 groups. Full-mock assembly is performed by the server when a plan is created.
      operationId: getIeltsSpeakingQuestionBank
      security: []
      responses:
        '200':
          description: Current published mainland IELTS Speaking catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IeltsQuestionBank'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
    IeltsQuestionBank:
      type: object
      additionalProperties: false
      required: [schema_version, bank_id, season, season_label, season_start, season_end, source_cutoff, filters, part1_topics, topic_groups]
      properties:
        schema_version:
          type: integer
          const: 3
        bank_id:
          $ref: '#/components/schemas/ResourceId'
        season:
          $ref: '#/components/schemas/ResourceId'
        season_label:
          type: string
          minLength: 1
        season_start:
          type: string
          format: date
        season_end:
          type: string
          format: date
        source_cutoff:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/IeltsCatalogFilters'
        part1_topics:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IeltsPart1PracticeTopic'
        topic_groups:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IeltsTopicGroup'
    IeltsCatalogFilters:
      type: object
      additionalProperties: false
      required: [releases, parts, topic_tags, cue_card_types]
      properties:
        releases:
          type: array
          items: {$ref: '#/components/schemas/IeltsFilterOption'}
        parts:
          type: array
          items: {$ref: '#/components/schemas/IeltsFilterOption'}
        topic_tags:
          type: array
          items: {$ref: '#/components/schemas/IeltsFilterOption'}
        cue_card_types:
          type: array
          items: {$ref: '#/components/schemas/IeltsFilterOption'}
    IeltsFilterOption:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: {$ref: '#/components/schemas/ResourceId'}
        label:
          type: string
          minLength: 1
    IeltsPart1PracticeTopic:
      type: object
      additionalProperties: false
      required: [id, title_zh, title_en, release_status, tag_codes, questions]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        title_zh: {type: string, minLength: 1}
        title_en: {type: string, minLength: 1}
        release_status:
          type: string
          enum: [new, carry_over, evergreen]
        tag_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/ResourceId'}
        questions:
          type: array
          minItems: 2
          items: {type: string, minLength: 1}
    IeltsTopicGroup:
      type: object
      additionalProperties: false
      required: [id, title_zh, release_status, cue_card_type, tag_codes, part2, part3_questions]
      properties:
        id: {$ref: '#/components/schemas/ResourceId'}
        title_zh: {type: string, minLength: 1}
        release_status:
          type: string
          enum: [new, carry_over, evergreen]
        cue_card_type:
          type: string
          enum: [person, place, thing, experience]
        tag_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/ResourceId'}
        part2: {$ref: '#/components/schemas/IeltsPart2CueCard'}
        part3_questions:
          type: array
          minItems: 1
          maxItems: 6
          items: {type: string, minLength: 1}
    IeltsPart2CueCard:
      type: object
      additionalProperties: false
      required: [prompt, points]
      properties:
        prompt: {type: string, minLength: 1}
        points:
          type: array
          minItems: 3
          items: {type: string, minLength: 1}
