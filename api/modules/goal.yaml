paths:
  /v1/goals:
    post:
      tags:
        - Goal
      summary: Create a user-owned real-world Goal
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
            example:
              title: Customer renewal meeting
      responses:
        '201':
          description: The Goal was created for the trusted Actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    get:
      tags:
        - Goal
      summary: List Goals owned by the trusted Actor
      operationId: listGoals
      responses:
        '200':
          description: The Actor's Goals ordered by latest update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalList'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
  /v1/goals/{goal_id}:
    parameters:
      - $ref: '#/components/parameters/GoalId'
    get:
      tags:
        - Goal
      summary: Restore one Goal owned by the trusted Actor
      operationId: getGoal
      responses:
        '200':
          description: The current durable Goal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
    patch:
      tags:
        - Goal
      summary: Complete, archive, or reopen an owned Goal
      operationId: changeGoalStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGoalStatusRequest'
      responses:
        '200':
          description: The Goal lifecycle transition was committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError
components:
  parameters:
    GoalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    GoalStatus:
      type: string
      enum:
        - active
        - completed
        - archived
    Goal:
      type: object
      additionalProperties: false
      required:
        - goal_id
        - title
        - status
        - version
        - created_at
        - updated_at
      properties:
        goal_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
        status:
          $ref: '#/components/schemas/GoalStatus'
        version:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    GoalList:
      type: object
      additionalProperties: false
      required:
        - goals
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\u0000]*$'
          x-max-utf8-bytes: 512
    ChangeGoalStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - expected_version
      properties:
        status:
          $ref: '#/components/schemas/GoalStatus'
        expected_version:
          type: integer
          format: int64
          minimum: 1
