paths:
  /v1/evaluation-feedback-items/{feedback_item_id}/retry-turns:
    post:
      tags: [Review]
      summary: Create a same-question retry turn from feedback
      description: |
        Accepts an actor-owned READY practice-turn feedback item whose
        repractice_mode is SAME_QUESTION. The request has no body. The
        Idempotency-Key is scoped to this feedback item; replay returns the
        same turn without creating another row.
      operationId: createEvaluationFeedbackRetryTurn
      parameters:
        - name: feedback_item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: Idempotent replay of the existing retry turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRetryTurnResponse'
        '201':
          description: A retry turn was created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRetryTurnResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/BadRequest
        '401':
          $ref: ../common/errors.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../common/errors.yaml#/components/responses/NotFound
        '409':
          $ref: ../common/errors.yaml#/components/responses/Conflict
        default:
          $ref: ../common/errors.yaml#/components/responses/DefaultError

components:
  schemas:
    CreateRetryTurnResponse:
      type: object
      additionalProperties: false
      required: [turn, replayed]
      properties:
        turn:
          $ref: '#/components/schemas/RetryTurnResource'
        replayed:
          type: boolean
    RetryTurnResource:
      type: object
      additionalProperties: false
      required:
        - turn_id
        - practice_session_id
        - question_id
        - original_turn_id
        - sequence
        - status
        - created_at
      properties:
        turn_id: {type: string, format: uuid}
        practice_session_id: {type: string, format: uuid}
        question_id: {type: string, format: uuid}
        original_turn_id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        status:
          type: string
          enum: [answering, transcribing, transcribed, confirmed, failed]
        created_at: {type: string, format: date-time}
