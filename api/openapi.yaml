    result:
      $ref: '#/components/schemas/CreateRetryTurnResult'
    idempotency_key: retry_request_id
    description: |
      Review invokes this command after durably saving a pending RetryRequest.
      Conversation validates that the original Turn is completed, reuses its
      Session, immutable Question, sequence, and respondent, and creates a real
      `ANSWERING` retry Turn. The result includes the server-authoritative
      `answer_path` for that draft. Replaying the same ID and payload returns
      the same `new_turn_id`; changing `original_turn_id` for that ID is a
      conflict. This is an internal modular-monolith contract and is never
      called by Flutter.
