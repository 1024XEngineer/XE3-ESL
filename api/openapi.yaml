openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SpeakUp MS1 API
  version: 0.1.0
  description: |
    Language-neutral REST contract for the deterministic MS1 practice flow.
    User-private operations require a first-party opaque Bearer Session. Only
    explicitly marked public operations accept anonymous requests. Fixed demo
    identities remain limited to explicit Mock and Test composition roots;
    production requests derive their trusted actor from the validated Session.
    Clients never submit trusted user or respondent participant identifiers.
    The formal `Idempotency-Key` scope for protected writes is the trusted
    Actor, HTTP method, canonical path, and key.

    Optional JSON properties use absent-only semantics: clients omit values that
    are not present and must not serialize them as explicit `null`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local deterministic MS1 server
security:
  - BearerSession: []
x-json-null-policy: omit
tags:
  - name: Identity
    description: Minimal account registration, opaque Session, and current-user operations.
  - name: Goal
    description: User-owned real-world activities and their lifecycle.
  - name: Agent
    description: Durable Agent Threads, Goal links, and committed Messages.
  - name: Scene
    description: Versioned training Scenes, roles, and practice options.
  - name: IELTS Speaking
    description: Published question-bank resources and actor-owned answer preparation.
  - name: Preparation
    description: User materials, immutable snapshots, and versioned practice plans.
  - name: Practice
    description: Session lifecycle, frozen context, Questions, Answers, Turns, and completion facts.
  - name: Review
    description: Analysis, evidence feedback, same-question retry, and history projections.
  - name: Evaluation
    description: Versioned Scene and Core 4D evaluation facts, gates, evidence, and revisions.
  - name: Avatar
    description: Short-lived avatar rendering credentials for owned interactive practice sessions.
  - name: Resume
    description: Actor-owned PDF resumes, structured content revisions, and parsing lifecycle.
paths:
  /health:
    get:
      summary: Check the modular monolith process
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Process health and registered business modules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                modules:
                  - preparation
                  - practice
                  - conversation
                  - review
        '400':
          $ref: ./common/errors.yaml#/components/responses/BadRequest
        default:
          $ref: ./common/errors.yaml#/components/responses/DefaultError
