openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SpeakUp MS1 API
  version: 0.1.0
  description: |
    Language-neutral REST contract for the deterministic MS1 practice flow.
    User-private operations require a first-party opaque Bearer Session. Only
    explicitly marked public operations accept anonymous requests. Fixed demo
    identities remain limited to explicit Mock and Test composition roots;
    production requests derive their trusted actor from the validated Session.
    Clients never submit trusted user or respondent participant identifiers.
    The formal `Idempotency-Key` scope for protected writes is the trusted
    Actor, HTTP method, canonical path, and key.

    Optional JSON properties use absent-only semantics: clients omit values that
    are not present and must not serialize them as explicit `null`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local deterministic MS1 server
security:
  - BearerSession: []
x-json-null-policy: omit
tags:
  - name: Identity
    description: Minimal account registration, opaque Session, and current-user operations.
  - name: Coaching Profile
    description: Fixed-schema cross-conversation coaching facts and preferences.
  - name: Agent
    description: Durable Agent Threads and committed Messages.
  - name: Scene
    description: Versioned training Scenes, roles, and practice options.
  - name: IELTS Speaking
    description: Published question-bank resources and actor-owned answer preparation.
  - name: Preparation
    description: Interview preparation aggregates and executable practice cards.
  - name: Practice
    description: Session lifecycle, frozen context, Questions, Answers, Turns, and completion facts.
  - name: Review
    description: Same-question retry actions over Evaluation feedback items; Review owns no report tables.
  - name: Evaluation
    description: The single asynchronous evaluation lifecycle for session reports and speech feedback.
  - name: Avatar
    description: Optional short-lived rendering credentials for owned Practice sessions.
paths:
