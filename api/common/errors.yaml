components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
        - correlation_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: Sanitized user-facing summary.
        retryable:
          type: boolean
        correlation_id:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
    ErrorCode:
      type: string
      description: Stable machine-readable Delivery error code.
      enum:
        - invalid_request
        - invalid_image
        - unsupported_image_format
        - image_too_large
        - authentication_required
        - invalid_credentials
        - account_registration_unavailable
        - account_unavailable
        - profile_not_found
        - profile_version_conflict
        - rate_limited
        - resource_not_found
        - resource_conflict
        - resource_processing
        - idempotency_key_conflict
        - provider_unavailable
        - quota_exhausted
        - voice_capacity_exhausted
        - scene_not_found
        - practice_plan_not_found
        - practice_session_not_found
        - practice_session_already_terminal
        - confirmation_required
        - version_conflict
        - internal_error
      x-http-status-map:
        invalid_request: 400
        invalid_image: 400
        unsupported_image_format: 400
        image_too_large: 413
        authentication_required: 401
        confirmation_required: 409
        version_conflict: 409
        invalid_credentials: 401
        account_unavailable: 403
        scene_not_found: 404
        practice_plan_not_found: 404
        practice_session_not_found: 404
        resource_not_found: 404
        profile_not_found: 404
        account_registration_unavailable: 409
        profile_version_conflict: 409
        idempotency_key_conflict: 409
        resource_conflict: 409
        resource_processing: 409
        practice_session_already_terminal: 409
        rate_limited: 429
        provider_unavailable: 503
        quota_exhausted: 503
        voice_capacity_exhausted: 503
        internal_error: 500
  responses:
    BadRequest:
      description: The request is malformed or violates a field constraint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request
              message: Request validation failed.
              retryable: false
              correlation_id: corr_invalid_request
              details:
                - field: body
                  reason: One or more fields are invalid.
    PayloadTooLarge:
      description: The uploaded payload exceeds an endpoint limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: image_too_large
              message: The image exceeds the allowed limits.
              retryable: false
              correlation_id: corr_image_too_large
    Unauthorized:
      description: A valid Bearer Session is required for this operation.
      headers:
        WWW-Authenticate:
          description: Authentication scheme required by the API.
          schema:
            type: string
            const: Bearer
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: authentication_required
              message: Authentication is required.
              retryable: false
              correlation_id: corr_authentication_required
    NotFound:
      description: The requested resource does not exist for the current actor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource_not_found
              message: Resource was not found.
              retryable: false
              correlation_id: corr_not_found
    Forbidden:
      description: The current actor cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: practice_participant_not_authorized
              message: The current actor is not an addressee for this question.
              retryable: false
              correlation_id: corr_forbidden
    Conflict:
      description: The request conflicts with the current resource state.
      headers:
        Retry-After:
          description: Optional minimum delay when the conflicting resource is still processing.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource_conflict
              message: Resource state conflicts with this operation.
              retryable: false
              correlation_id: corr_conflict
    TooManyRequests:
      description: The caller must wait before attempting this operation again.
      headers:
        Retry-After:
          description: Minimum number of seconds before the caller retries.
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again later.
              retryable: true
              correlation_id: corr_rate_limited
    DefaultError:
      description: A stable error response.
      headers:
        Retry-After:
          description: Optional minimum delay for a retryable service failure.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
