name: Quality

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.scope.outputs.flutter }}
      go: ${{ steps.scope.outputs.go }}
      api: ${{ steps.scope.outputs.api }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select required checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          flutter=false
          go=false
          api=false

          set_all_checks() {
            flutter=true
            go=true
            api=true
          }

          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_REF" == "main" ]]; then
            set_all_checks
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            changed_files="$RUNNER_TEMP/quality-changed-files"
            git diff \
              --no-renames \
              --name-only \
              -z \
              "$BASE_SHA...$HEAD_SHA" > "$changed_files"

            while IFS= read -r -d '' file; do
              printf 'Changed file: %q\n' "$file"
              case "$file" in
                Makefile|.github/workflows/quality.yml|.github/workflows/coverage-comment.yml)
                  set_all_checks
                  ;;
                mobile/*)
                  flutter=true
                  ;;
                server/*)
                  go=true
                  ;;
                api/*)
                  api=true
                  ;;
              esac
            done < "$changed_files"
          fi

          {
            echo "flutter=$flutter"
            echo "go=$go"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Restore Pub package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-flutter-3.44.6-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-flutter-3.44.6-

      - name: Check Flutter
        run: make check-flutter

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: server/go.sum

      - name: Check Go and collect coverage
        run: make check-go-coverage

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage-server
          path: |
            server/coverage.out
            server/coverage.txt
          if-no-files-found: error
          retention-days: 14

  api:
    name: API contracts
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Check API contracts
        run: make check-api

  coverage-gate:
    name: Coverage gate
    needs:
      - changes
      - go
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.go == 'true' &&
      needs.go.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download current Go coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-coverage-server
          path: coverage/current

      - name: Resolve baseline run
        id: baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const qualityWorkflow = workflows.find(
              (workflow) => workflow.name === "Quality",
            );
            if (!qualityWorkflow) {
              core.warning("Unable to find the Quality workflow; coverage gate skipped");
              core.setOutput("available", "false");
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: qualityWorkflow.id,
                branch: baseBranch,
                event: "push",
                status: "completed",
                per_page: 100,
              },
            );

            let baseline = null;
            for (const run of runs.filter(
              (candidate) => candidate.conclusion === "success",
            )) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              if (artifacts.some(
                (artifact) => artifact.name === "go-coverage-server",
              )) {
                baseline = run;
                break;
              }
            }

            if (!baseline) {
              core.warning(
                "No successful Quality run has a Go coverage artifact; coverage gate skipped",
              );
              core.setOutput("available", "false");
              return;
            }

            core.setOutput("run_id", String(baseline.id));
            core.setOutput("available", "true");

      - name: Explain missing coverage baseline
        if: steps.baseline.outputs.available != 'true'
        run: >-
          echo "Coverage gate skipped because the base branch has no Go
          coverage artifact baseline yet."

      - name: Download baseline Go coverage
        if: steps.baseline.outputs.available == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: go-coverage-server
          path: coverage/baseline
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reject total Go coverage regression
        if: steps.baseline.outputs.available == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            function readCoverage(profilePath) {
              let totalStatements = 0;
              let coveredStatements = 0;
              const content = fs.readFileSync(profilePath, "utf8");

              for (const line of content.split(/\r?\n/)) {
                if (!line || line.startsWith("mode:")) continue;

                const match = line.match(
                  /^(.*):\d+\.\d+,\d+\.\d+\s+(\d+)\s+(\d+)$/,
                );
                if (!match) continue;

                const statements = Number(match[2]);
                const hits = Number(match[3]);
                totalStatements += statements;
                coveredStatements += hits > 0 ? statements : 0;
              }

              return totalStatements === 0
                ? 0
                : (coveredStatements / totalStatements) * 100;
            }

            const current = readCoverage(
              path.join("coverage", "current", "coverage.out"),
            );
            const baseline = readCoverage(
              path.join("coverage", "baseline", "coverage.out"),
            );
            const currentRounded = Number(current.toFixed(1));
            const baselineRounded = Number(baseline.toFixed(1));

            core.info(
              `Current: ${current.toFixed(1)}%; baseline: ${baseline.toFixed(1)}%`,
            );
            if (currentRounded < baselineRounded) {
              core.setFailed(
                `Total Go coverage ${current.toFixed(1)}% is below baseline ` +
                  `${baseline.toFixed(1)}%`,
              );
            }

  quality-gate:
    name: Quality gate
    needs:
      - changes
      - flutter
      - go
      - api
      - coverage-gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FLUTTER_REQUIRED: ${{ needs.changes.outputs.flutter }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}
      GO_REQUIRED: ${{ needs.changes.outputs.go }}
      GO_RESULT: ${{ needs.go.result }}
      API_REQUIRED: ${{ needs.changes.outputs.api }}
      API_RESULT: ${{ needs.api.result }}
      COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
    steps:
      - name: Require every selected check to pass
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          require_result() {
            local name=$1
            local required=$2
            local result=$3

            case "$required" in
              true|false)
                ;;
              *)
                echo "$name has invalid required state: $required"
                return 1
                ;;
            esac

            case "$result" in
              success|skipped)
                ;;
              *)
                echo "$name finished with unexpected result: $result"
                return 1
                ;;
            esac

            if [[ "$required" == "true" && "$result" != "success" ]]; then
              echo "$name was required but finished with: $result"
              return 1
            fi
          }

          require_result "Flutter" "$FLUTTER_REQUIRED" "$FLUTTER_RESULT"
          require_result "Go" "$GO_REQUIRED" "$GO_RESULT"
          require_result "API contracts" "$API_REQUIRED" "$API_RESULT"

          case "$COVERAGE_RESULT" in
            success|skipped)
              ;;
            *)
              echo "Coverage gate finished with unexpected result: $COVERAGE_RESULT"
              exit 1
              ;;
          esac
