name: speakup
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.4+5

environment:
  sdk: ^3.12.2

dependencies:
  avatar_kit: 1.0.0-beta.44
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^10.3.1
  file_picker: ^10.3.10
  image_picker: ^1.2.3
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  record: ^6.1.2
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Allura
      fonts:
        - asset: assets/fonts/allura/Allura-Regular.ttf
  assets:
    - assets/images/brand/
    - assets/images/scenes/
